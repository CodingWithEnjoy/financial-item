name: Financial & PAMP Data Save (Every 5 Min Tehran)

on:
  schedule:
    - cron: "* * * * *"   # every 1 minute UTC
  workflow_dispatch:

jobs:
  save-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and store data
        run: |
          set -e

          # Tehran time (UTC+3:30)
          DATE=$(date -u -d "+3 hours 30 minutes" +"%Y-%m-%d")
          TIME=$(date -u -d "+3 hours 30 minutes" +"%H:%M:%S")

          mkdir -p data

          #### Financial API ####
          FIN_FILE="data/${DATE}_financial.json"
          FIN_API="https://api.dastyar.io/express/financial-item"
          FIN_RESPONSE=$(curl -s "$FIN_API")
          echo "$FIN_RESPONSE" | jq empty

          if [ ! -f "$FIN_FILE" ]; then
            echo "[]" > "$FIN_FILE"
          fi

          jq --arg time "$TIME" \
             --argjson data "$FIN_RESPONSE" \
             '. += [{"time": $time, "data": $data}]' \
             "$FIN_FILE" > tmp.json && mv tmp.json "$FIN_FILE"

          #### PAMP API ####
          PAMP_FILE="data/${DATE}_pamp.json"
          PAMP_API="https://amirmasoud.netlify.app/api/v1/pamp"
          PAMP_RESPONSE=$(curl -s "$PAMP_API")
          echo "$PAMP_RESPONSE" | jq empty

          if [ ! -f "$PAMP_FILE" ]; then
            echo "[]" > "$PAMP_FILE"
          fi

          jq --arg time "$TIME" \
             --argjson data "$PAMP_RESPONSE" \
             '. += [{"time": $time, "data": $data}]' \
             "$PAMP_FILE" > tmp.json && mv tmp.json "$PAMP_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/

          git commit -m "Snapshot $(date -u -d '+3 hours 30 minutes' +"%Y-%m-%d %H:%M")" || echo "No changes to commit"

          git push
