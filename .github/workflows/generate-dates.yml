name: Generate dates index

on:
  workflow_dispatch: 
  push:
    paths:
      - "data/*.json"
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate dates.json
        run: |
          ls data/*.json \
            | sed 's|data/||' \
            | sed 's|\.json||' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r \
            | jq -R -s -c 'split("\n")[:-1]' \
            > data/dates.json

      - name: Commit dates.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/dates.json
          git commit -m "Update dates.json" || exit 0
          git push
