name: Hourly Financial Data Save

on:
  schedule:
    - cron: "0 * * * *"   # every hour (UTC)
  workflow_dispatch:

jobs:
  save-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and store data
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIME=$(date -u +"%H:%M:%S")
          FILE="data/$DATE.json"

          API_URL="https://corsproxy.io/?url=https://api.dastyar.io/express/financial-item

          RESPONSE=$(curl -s "$API_URL")

          # Create file if not exists
          if [ ! -f "$FILE" ]; then
            echo "[]" > "$FILE"
          fi

          # Append new hourly entry
          jq --arg time "$TIME" \
             --argjson data "$RESPONSE" \
             '. += [{"time": $time, "data": $data}]' \
             "$FILE" > tmp.json && mv tmp.json "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git commit -m "Hourly financial snapshot $(date -u +"%Y-%m-%d %H:%M")" || exit 0
          git push
