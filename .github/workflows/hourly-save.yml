name: Financial Data Save (Every 30 Min Tehran)

on:
  schedule:
    - cron: "0,30 * * * *"   # every 30 minutes UTC (Tehran +3:30)
  workflow_dispatch:

jobs:
  save-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and store data
        run: |
          set -e

          # Tehran time (UTC+3:30)
          DATE=$(date -u -d "+3 hours 30 minutes" +"%Y-%m-%d")
          TIME=$(date -u -d "+3 hours 30 minutes" +"%H:%M:%S")
          FILE="data/$DATE.json"

          API_URL="https://api.dastyar.io/express/financial-item"

          RESPONSE=$(curl -s "$API_URL")

          # Validate JSON response
          echo "$RESPONSE" | jq empty

          # Create daily file if it doesn't exist
          if [ ! -f "$FILE" ]; then
            echo "[]" > "$FILE"
          fi

          # Append snapshot
          jq --arg time "$TIME" \
             --argjson data "$RESPONSE" \
             '. += [{"time": $time, "data": $data}]' \
             "$FILE" > tmp.json && mv tmp.json "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/

          git commit -m "Financial snapshot $(date -u -d '+3 hours 30 minutes' +"%Y-%m-%d %H:%M")" || echo "No changes to commit"

          git push
