<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
      --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      padding: 40px 28px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    header {
      max-width: 1440px;
      margin: 0 auto 28px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .title-section p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      border-color: var(--muted);
      transform: translateY(-1px);
    }

    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .view-toggle button.active {
      background: var(--text);
      color: var(--bg);
    }

    .date-dropdown {
      position: relative;
    }

    .date-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 230px;
      max-height: 320px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    .date-menu.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .date-menu div {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.12s ease;
      color: var(--text);
    }

    .date-menu div:hover {
      background: var(--border);
    }

    .date-menu div:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .date-menu::-webkit-scrollbar {
      width: 8px;
    }

    .date-menu::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }

    .toolbar {
      max-width: 1440px;
      margin: 0 auto 34px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .tab:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 230px;
      outline: none;
      font: inherit;
      font-size: 0.875rem;
      transition: border-color 0.2s ease;
      box-shadow: var(--shadow);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      column-gap: 24px;
      row-gap: 64px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      height: 500px;
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 18px;
    }

    .asset-info {
      min-width: 0;
    }

    .asset-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .asset-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 6px;
      padding: 0;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .fav-btn:hover {
      transform: scale(1.1);
      color: #eab308;
    }

    .fav-btn.active {
      color: #eab308;
    }

    .asset-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .asset-meta strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }

    .range-bar {
      position: relative;
      width: 100%;
      max-width: 250px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      margin-top: 13px;
    }

    .range-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    .range-dot {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .price-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .price-current {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .price-change {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
    }

    .price-change.up {
      color: var(--green);
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.18);
    }

    .price-change.down {
      color: var(--red);
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.18);
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .chart-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      max-width: 1440px;
      margin: 70px auto 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 100;
    }

    .loader.show {
      display: block;
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 22px 14px;
      }

      header {
        margin-bottom: 22px;
      }

      .toolbar {
        margin-bottom: 26px;
      }

      .search-input {
        width: 100%;
      }

      .grid {
        row-gap: 38px;
      }

      .card {
        height: 460px;
        padding: 18px;
      }

      .card-header {
        gap: 14px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="title-section">
    <h1>📈 Markets</h1>
    <p>Minimal financial dashboard</p>
  </div>

  <div class="controls">
    <div class="view-toggle" id="viewToggle">
      <button data-view="daily" class="active">Daily</button>
      <button data-view="monthly">Monthly</button>
    </div>

    <div class="date-dropdown">
      <button class="btn" id="dateBtn">📅 Loading...</button>
      <div id="dateMenu" class="date-menu"></div>
    </div>

    <button class="btn" id="themeBtn">🌙</button>
  </div>
</header>

<div class="toolbar">
  <div class="tabs" id="categoryTabs">
    <button class="tab active" data-category="all">All</button>
    <button class="tab" data-category="currency">Currencies</button>
    <button class="tab" data-category="gold">Gold</button>
    <button class="tab" data-category="crypto">Crypto</button>
    <button class="tab" data-category="pamp">PAMP</button>
    <button class="tab" data-category="favorites">★ Favorites</button>
  </div>

  <input id="assetSearch" class="search-input" type="text" placeholder="Search assets..." />
</div>

<section class="grid" id="chartGrid"></section>

<footer id="appFooter">Data updated via GitHub Actions</footer>

<div class="loader" id="loader"></div>

<script>
const ASSETS = [
  { id: "usd", key: "usd", label: "USD", color: "#3b82f6", category: "currency" },
  { id: "eur", key: "eur", label: "EUR", color: "#a855f7", category: "currency" },
  { id: "gbp", key: "gbp", label: "GBP", color: "#8b5cf6", category: "currency" },
  { id: "rob", key: "rob", label: "Roub", color: "#ec4899", category: "currency" },
  { id: "try", key: "try", label: "TRY", color: "#ef4444", category: "currency" },
  { id: "aed", key: "aed", label: "AED", color: "#10b981", category: "currency" },

  { id: "sekkeh", key: "sekkeh", label: "Sekkeh", color: "#eab308", category: "gold" },
  { id: "gold", key: "18ayar", label: "Gold 18k", color: "#f59e0b", category: "gold" },

  { id: "btc", key: "usd_btc", label: "Bitcoin", color: "#f97316", category: "crypto" },
  { id: "usdt", key: "usd_usdt", label: "Tether", color: "#22c55e", category: "crypto" },

  { id: "pamp1", key: 1, label: "PAMP 1g", color: "#eab308", category: "pamp" },
  { id: "pamp2_5", key: 2.5, label: "PAMP 2.5g", color: "#eab308", category: "pamp" },
  { id: "pamp5", key: 5, label: "PAMP 5g", color: "#f97316", category: "pamp" },
  { id: "pamp10", key: 10, label: "PAMP 10g", color: "#f97316", category: "pamp" },
  { id: "pamp15", key: 15.55175, label: "PAMP 15.55g", color: "#ef4444", category: "pamp" },
  { id: "pamp20", key: 20, label: "PAMP 20g", color: "#ef4444", category: "pamp" },
  { id: "pamp31_1", key: 31.1035, label: "PAMP 1oz", color: "#ec4899", category: "pamp" },
  { id: "pamp50", key: 50, label: "PAMP 50g", color: "#8b5cf6", category: "pamp" },
  { id: "pamp100", key: 100, label: "PAMP 100g", color: "#a855f7", category: "pamp" }
];

const charts = {};
const dataCache = new Map();

const grid = document.getElementById("chartGrid");
const dateBtn = document.getElementById("dateBtn");
const dateMenu = document.getElementById("dateMenu");
const loader = document.getElementById("loader");
const appFooter = document.getElementById("appFooter");
const categoryTabs = document.getElementById("categoryTabs");
const assetSearch = document.getElementById("assetSearch");
const viewToggle = document.getElementById("viewToggle");
const themeBtn = document.getElementById("themeBtn");

let currentView = "daily";
let activeCategory = "all";
let searchQuery = "";

let allDates = [];
let allMonths = [];

let currentEntries = [];
let currentLabels = [];
let displayLabels = [];
let displayIndices = [];

let favorites = [];
try {
  favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
} catch {
  favorites = [];
}

const themes = ["light", "dark", "system"];
let currentTheme = localStorage.getItem("theme") || "system";

// ---------- Utils ----------

function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function fmt(value) {
  const n = Number(value);
  if (value == null || !Number.isFinite(n)) return "—";
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function parseDate(dateStr) {
  return new Date(`${dateStr}T12:00:00Z`);
}

const jalaliFullFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric",
  month: "long",
  day: "numeric"
});

const jalaliShortFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
});

const jalaliMonthFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric",
  month: "long"
});

const jalaliMonthKeyFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric",
  month: "numeric"
});

function toJalali(dateStr) {
  return jalaliFullFormatter.format(parseDate(dateStr));
}

function toJalaliShort(dateStr) {
  return jalaliShortFormatter.format(parseDate(dateStr));
}

function getJalaliMonthLabel(dateStr) {
  return jalaliMonthFormatter.format(parseDate(dateStr));
}

function getJalaliMonthKey(dateStr) {
  const parts = jalaliMonthKeyFormatter.formatToParts(parseDate(dateStr));
  const year = parts.find(p => p.type === "year")?.value || "0000";
  const month = parts.find(p => p.type === "month")?.value || "00";
  return `${year}-${month.padStart(2, "0")}`;
}

function showLoading(show) {
  loader.classList.toggle("show", show);
}

// ---------- Theme ----------

function getChartColors() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";

  return {
    text: isDark ? "#a1a1aa" : "#71717a",
    grid: isDark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)",
    tooltipBg: isDark ? "#18181b" : "#ffffff",
    tooltipText: isDark ? "#fafafa" : "#18181b",
    tooltipBorder: isDark ? "#27272a" : "#e4e4e7"
  };
}

function updateChartsTheme() {
  const colors = getChartColors();

  Object.values(charts).forEach(chart => {
    chart.options.scales.x.ticks.color = colors.text;
    chart.options.scales.x.grid.color = colors.grid;
    chart.options.scales.y.ticks.color = colors.text;
    chart.options.scales.y.grid.color = colors.grid;

    if (chart.options.plugins.tooltip) {
      chart.options.plugins.tooltip.backgroundColor = colors.tooltipBg;
      chart.options.plugins.tooltip.titleColor = colors.tooltipText;
      chart.options.plugins.tooltip.bodyColor = colors.tooltipText;
      chart.options.plugins.tooltip.borderColor = colors.tooltipBorder;
    }

    chart.update("none");
  });
}

function applyTheme(theme) {
  currentTheme = theme;
  localStorage.setItem("theme", theme);

  const isDark =
    theme === "dark" ||
    (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);

  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  themeBtn.textContent = isDark ? "☀️" : "🌙";

  updateChartsTheme();
}

// ---------- Favorites ----------

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites = [...favorites, id];
  }

  localStorage.setItem("favorites", JSON.stringify(favorites));
}

// ---------- Filtering ----------

function getVisibleAssets() {
  return ASSETS.filter(asset => {
    const matchesCategory =
      activeCategory === "all" ||
      (activeCategory === "favorites"
        ? favorites.includes(asset.id)
        : asset.category === activeCategory);

    const matchesSearch =
      !searchQuery || asset.label.toLowerCase().includes(searchQuery);

    return matchesCategory && matchesSearch;
  });
}

function updateTabs() {
  document.querySelectorAll("#categoryTabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.category === activeCategory);
  });
}

// ---------- Data ----------

async function fetchDay(date) {
  const latestDate = allDates[0];
  const shouldCache = date !== latestDate;

  if (shouldCache && dataCache.has(date)) {
    return dataCache.get(date);
  }

  const res = await fetch(`data/${date}.json`);
  const json = res.ok ? await res.json() : null;

  if (shouldCache && json) {
    dataCache.set(date, json);
  }

  return json;
}

function computeDisplayIndices(length, maxPoints) {
  maxPoints = Math.max(2, maxPoints);

  if (!length) {
    displayIndices = [];
    displayLabels = [];
    return;
  }

  if (length <= maxPoints) {
    displayIndices = Array.from({ length }, (_, i) => i);
  } else {
    displayIndices = Array.from({ length: maxPoints }, (_, i) =>
      Math.round(i * (length - 1) / (maxPoints - 1))
    );
  }

  displayLabels = displayIndices.map(i => currentLabels[i]);
}

function getAssetValues(asset, entries) {
  return entries.map(entry => {
    if (!entry) return null;

    let price = null;

    if (Array.isArray(entry.data)) {
      const item = entry.data.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }

    if (price == null && Array.isArray(entry.financial)) {
      const item = entry.financial.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }

    if (price == null && entry.pamp && Array.isArray(entry.pamp.items)) {
      const item = entry.pamp.items.find(i => Number(i.weightGram) === Number(asset.key));
      if (item) price = Number(item.price);
    }

    return Number.isFinite(price) && price > 0 ? price : null;
  });
}

async function loadData(date) {
  showLoading(true);

  const json = await fetchDay(date);
  const entries = Array.isArray(json) ? json : [];

  currentEntries = entries;
  currentLabels = entries.map(e => e.time || "");

  computeDisplayIndices(currentLabels.length, 240);
  renderDashboard();

  const lastEntry = entries[entries.length - 1];
  if (lastEntry) {
    appFooter.textContent = `Last updated: ${toJalali(date)} at ${lastEntry.time}`;
  }

  showLoading(false);
}

async function loadMonthlyData(dates) {
  showLoading(true);

  const allData = await Promise.all(dates.map(d => fetchDay(d)));

  const labels = [];
  const entries = [];

  for (let i = dates.length - 1; i >= 0; i--) {
    const dayData = allData[i];

    if (Array.isArray(dayData) && dayData.length > 0) {
      labels.push(toJalaliShort(dates[i]));
      entries.push(dayData[dayData.length - 1]);
    }
  }

  currentLabels = labels;
  currentEntries = entries;

  computeDisplayIndices(currentLabels.length, 120);
  renderDashboard();

  if (dates.length && entries.length) {
    const lastEntry = entries[entries.length - 1];
    appFooter.textContent = `Monthly view: ending ${toJalali(dates[0])} at ${lastEntry.time || ""}`;
  }

  showLoading(false);
}

// ---------- Rendering ----------

function destroyCharts() {
  Object.keys(charts).forEach(id => {
    if (charts[id]) {
      charts[id].destroy();
      delete charts[id];
    }
  });
}

function createCard(asset) {
  const isFav = favorites.includes(asset.id);

  const div = document.createElement("div");
  div.className = "card";
  div.dataset.assetId = asset.id;

  div.innerHTML = `
    <div class="card-header">
      <div class="asset-info">
        <div class="asset-title">
          <h2>${asset.label}</h2>
          <button
            type="button"
            class="fav-btn ${isFav ? "active" : ""}"
            data-fav="${asset.id}"
            title="Toggle favorite"
          >${isFav ? "★" : "☆"}</button>
        </div>

        <div class="asset-meta">
          <span>O <strong id="open-${asset.id}">—</strong></span>
          <span>L <strong id="low-${asset.id}">—</strong></span>
          <span>H <strong id="high-${asset.id}">—</strong></span>
        </div>

        <div class="range-bar">
          <div class="range-fill" id="range-fill-${asset.id}"></div>
          <div class="range-dot" id="range-dot-${asset.id}"></div>
        </div>
      </div>

      <div class="price-info">
        <div class="price-current" id="price-${asset.id}">—</div>
        <div class="price-change" id="change-${asset.id}">—</div>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="${asset.id}"></canvas>
    </div>
  `;

  grid.appendChild(div);

  requestAnimationFrame(() => {
    div.classList.add("visible");
  });
}

function createChart(canvasId, labels, data, label, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  if (charts[canvasId]) {
    charts[canvasId].destroy();
  }

  const colors = getChartColors();

  let lastValidIndex = -1;
  for (let i = data.length - 1; i >= 0; i--) {
    if (data[i] != null && data[i] > 0) {
      lastValidIndex = i;
      break;
    }
  }

  charts[canvasId] = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label,
          data,
          borderColor: color,
          borderWidth: 2,
          fill: true,
          tension: 0.35,
          spanGaps: true,
          backgroundColor: ctx => {
            const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 300);
            g.addColorStop(0, color + "33");
            g.addColorStop(1, "transparent");
            return g;
          },
          pointRadius: ctx => ctx.dataIndex === lastValidIndex ? 4 : 0,
          pointHoverRadius: 6,
          pointBackgroundColor: color,
          pointBorderWidth: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      resizeDelay: 120,
      animation: {
        duration: 300,
        easing: "easeOutQuart"
      },
      interaction: {
        intersect: false,
        mode: "index"
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          backgroundColor: colors.tooltipBg,
          titleColor: colors.tooltipText,
          bodyColor: colors.tooltipText,
          borderColor: colors.tooltipBorder,
          borderWidth: 1,
          padding: 12,
          displayColors: false,
          callbacks: {
            title: items => items.length ? items[0].label : "",
            label: ctx => ctx.parsed.y == null ? "No data" : fmt(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: colors.text,
            maxRotation: 0,
            autoSkipPadding: 18,
            maxTicksLimit: 8
          },
          grid: {
            color: colors.grid
          }
        },
        y: {
          beginAtZero: false,
          grace: "10%",
          ticks: {
            color: colors.text,
            maxTicksLimit: 6,
            callback: v => Number(v).toLocaleString()
          },
          grid: {
            color: colors.grid
          }
        }
      }
    }
  });
}

function updateAssetStats(assetId, values) {
  const priceEl = document.getElementById(`price-${assetId}`);
  const changeEl = document.getElementById(`change-${assetId}`);
  const openEl = document.getElementById(`open-${assetId}`);
  const lowEl = document.getElementById(`low-${assetId}`);
  const highEl = document.getElementById(`high-${assetId}`);
  const fillEl = document.getElementById(`range-fill-${assetId}`);
  const dotEl = document.getElementById(`range-dot-${assetId}`);

  if (!priceEl || !changeEl || !openEl || !lowEl || !highEl || !fillEl || !dotEl) return;

  const clean = values.filter(v => v != null && v > 0);

  if (!clean.length) {
    priceEl.textContent = "—";
    changeEl.textContent = "—";
    changeEl.className = "price-change";
    openEl.textContent = "—";
    lowEl.textContent = "—";
    highEl.textContent = "—";
    fillEl.style.width = "0%";
    dotEl.style.left = "0%";
    return;
  }

  const open = clean[0];
  const close = clean[clean.length - 1];
  const low = Math.min(...clean);
  const high = Math.max(...clean);

  const change = open > 0 ? ((close - open) / open) * 100 : 0;
  const rangePosition = high > low ? ((close - low) / (high - low)) * 100 : 0;

  priceEl.textContent = fmt(close);

  openEl.textContent = fmt(open);
  lowEl.textContent = fmt(low);
  highEl.textContent = fmt(high);

  changeEl.textContent = `${change >= 0 ? "▲" : "▼"} ${Math.abs(change).toFixed(2)}%`;
  changeEl.className = `price-change ${change >= 0 ? "up" : "down"}`;

  fillEl.style.width = `${rangePosition}%`;
  dotEl.style.left = `${rangePosition}%`;
}

function renderDashboard() {
  destroyCharts();
  grid.innerHTML = "";

  if (!currentEntries.length) {
    grid.innerHTML = `
      <div class="empty-state">
        No data loaded.
      </div>
    `;
    return;
  }

  const visibleAssets = getVisibleAssets();

  if (!visibleAssets.length) {
    grid.innerHTML = `
      <div class="empty-state">
        ${
          activeCategory === "favorites"
            ? "No favorite assets yet. Click ☆ on a card to add one."
            : "No assets found."
        }
      </div>
    `;
    return;
  }

  visibleAssets.forEach(asset => {
    createCard(asset);

    const fullValues = getAssetValues(asset, currentEntries);
    const chartValues = displayIndices.map(i => fullValues[i] ?? null);

    createChart(asset.id, displayLabels, chartValues, asset.label, asset.color);
    updateAssetStats(asset.id, fullValues);
  });
}

// ---------- Dates ----------

function renderDateMenu() {
  dateMenu.innerHTML = "";

  const items = currentView === "daily" ? allDates : allMonths;

  if (!items.length) {
    const div = document.createElement("div");
    div.textContent = "No dates found";
    dateMenu.appendChild(div);
    return;
  }

  items.forEach(item => {
    const div = document.createElement("div");

    if (currentView === "daily") {
      div.textContent = toJalali(item);
      div.onclick = () => {
        dateBtn.textContent = `📅 ${toJalali(item)}`;
        dateMenu.classList.remove("show");
        loadData(item);
      };
    } else {
      div.textContent = item.label;
      div.onclick = () => {
        dateBtn.textContent = `📅 ${item.label}`;
        dateMenu.classList.remove("show");
        loadMonthlyData(item.dates);
      };
    }

    dateMenu.appendChild(div);
  });
}

async function loadAvailableDates() {
  const res = await fetch("data/dates.json", { cache: "no-store" });
  allDates = res.ok ? await res.json() : [];

  if (!Array.isArray(allDates)) {
    allDates = [];
  }

  const monthMap = {};

  allDates.forEach(d => {
    const key = getJalaliMonthKey(d);

    if (!monthMap[key]) {
      monthMap[key] = {
        key,
        label: getJalaliMonthLabel(d),
        dates: []
      };
    }

    monthMap[key].dates.push(d);
  });

  allMonths = Object.values(monthMap).sort((a, b) => b.key.localeCompare(a.key));

  renderDateMenu();

  if (!allDates.length) {
    dateBtn.textContent = "📅 No dates";
    return;
  }

  if (currentView === "daily") {
    dateBtn.textContent = `📅 ${toJalali(allDates[0])}`;
    loadData(allDates[0]);
  } else {
    dateBtn.textContent = `📅 ${allMonths[0].label}`;
    loadMonthlyData(allMonths[0].dates);
  }
}

// ---------- Events ----------

themeBtn.addEventListener("click", () => {
  applyTheme(themes[(themes.indexOf(currentTheme) + 1) % themes.length]);
});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (currentTheme === "system") applyTheme("system");
});

viewToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn || btn.classList.contains("active")) return;

  document.querySelector("#viewToggle .active")?.classList.remove("active");
  btn.classList.add("active");

  currentView = btn.dataset.view;
  renderDateMenu();

  if (currentView === "daily" && allDates.length) {
    dateBtn.textContent = `📅 ${toJalali(allDates[0])}`;
    loadData(allDates[0]);
  }

  if (currentView === "monthly" && allMonths.length) {
    dateBtn.textContent = `📅 ${allMonths[0].label}`;
    loadMonthlyData(allMonths[0].dates);
  }
});

categoryTabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;

  activeCategory = btn.dataset.category;
  updateTabs();
  renderDashboard();
});

assetSearch.addEventListener("input", debounce(() => {
  searchQuery = assetSearch.value.trim().toLowerCase();
  renderDashboard();
}, 200));

grid.addEventListener("click", e => {
  const btn = e.target.closest(".fav-btn");
  if (!btn) return;

  const id = btn.dataset.fav;
  toggleFavorite(id);

  const isFav = favorites.includes(id);

  if (activeCategory === "favorites") {
    renderDashboard();
    return;
  }

  btn.classList.toggle("active", isFav);
  btn.textContent = isFav ? "★" : "☆";
});

dateBtn.onclick = () => dateMenu.classList.toggle("show");

document.addEventListener("click", e => {
  if (!e.target.closest(".date-dropdown")) {
    dateMenu.classList.remove("show");
  }
});

// ---------- Init ----------

applyTheme(currentTheme);
loadAvailableDates();
</script>
