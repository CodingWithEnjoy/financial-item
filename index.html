<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr" data-style="flat">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
    }

    [dir="rtl"] { --font: 'Vazirmatn', 'Inter', system-ui, sans-serif; }

    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      padding: 40px 28px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- Header ---------- */
    header {
      max-width: 1440px;
      margin: 0 auto 28px auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-section { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; }
    .title-section h1 { font-size: 1.8rem; font-weight: 700; }

    .controls-main { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .controls-icons { display: flex; gap: 10px; align-items: center; }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      height: 40px;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--muted); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    #dateBtn { padding: 0 14px; min-width: 200px; justify-content: flex-start; }
    #dateBtnText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #langBtn { width: 52px; font-weight: 700; }
    #themeBtn, #styleBtn { width: 40px; }

    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .view-toggle button.active { background: var(--text); color: var(--bg); }

    .date-dropdown { position: relative; }

    .date-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 230px;
      max-height: 320px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    [dir="rtl"] .date-menu { right: auto; left: 0; }
    .date-menu.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .date-menu div {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.12s ease;
      color: var(--text);
    }

    .date-menu div:hover { background: var(--border); }
    .date-menu div:not(:last-child) { border-bottom: 1px solid var(--border); }

    .date-menu::-webkit-scrollbar { width: 8px; }
    .date-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      max-width: 1440px;
      margin: 0 auto 34px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }

    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0 14px;
      height: 34px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab:hover { border-color: var(--muted); color: var(--text); }
    .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tab svg { width: 12px; height: 12px; }

    .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0 14px;
      height: 40px;
      min-width: 180px;
      outline: none;
      font: inherit;
      font-size: 0.875rem;
      transition: border-color 0.2s ease;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    .mode-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .mode-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .mode-toggle button svg { width: 14px; height: 14px; }
    .mode-toggle button.active { background: var(--text); color: var(--bg); }

    /* ---------- Icons ---------- */
    .asset-icon { width: 22px; height: 22px; object-fit: contain; border-radius: 6px; flex-shrink: 0; }
    .asset-icon-fallback { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .hl-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- Charts Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      column-gap: 24px;
      row-gap: 64px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      height: 500px;
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s ease, background 0.3s ease;
    }

    .card.visible { opacity: 1; transform: translateY(0); }
    .card:hover { border-color: var(--muted); }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 18px;
    }

    .asset-info { min-width: 0; }
    .asset-title { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }

    .asset-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      padding: 2px;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .fav-btn svg { width: 16px; height: 16px; }
    .fav-btn:hover { color: #eab308; }
    .fav-btn.active { color: #eab308; }
    .fav-btn.active svg { fill: currentColor; }

    .asset-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .asset-meta strong { color: var(--text); font-weight: 600; margin-left: 4px; }
    [dir="rtl"] .asset-meta strong { margin-left: 0; margin-right: 4px; }

    .range-bar {
      position: relative;
      width: 100%;
      max-width: 250px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      margin-top: 13px;
    }

    .range-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    .range-dot {
      position: absolute;
      top: 50%; left: 0%;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .price-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 0;
    }

    [dir="rtl"] .price-info { text-align: left; align-items: flex-start; }

    .price-current {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .price-change {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
      min-width: 76px;
      justify-content: center;
    }

    .price-change.up { color: var(--green); background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.18); }
    .price-change.down { color: var(--red); background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.18); }

    .chart-wrap { position: relative; flex: 1; min-height: 0; }
    .chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ---------- Skeleton Shimmer ---------- */
    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      height: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .skeleton-line {
      height: 20px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line.title { width: 60%; height: 24px; }
    .skeleton-line.price { width: 40%; height: 32px; }
    .skeleton-line.chart { flex: 1; border-radius: 12px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---------- Heatmap ---------- */
    .heatmap {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      overflow-x: hidden;
    }

    .heatmap-tile {
      aspect-ratio: 1.2;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
      overflow: hidden;
    }

    .heatmap-tile:hover { border-color: var(--text); }

    .heatmap-tile.positive {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .heatmap-tile.negative {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .heatmap-tile.neutral { background: var(--card); border: 1px solid var(--border); }

    .heatmap-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      min-width: 0;
    }

    .heatmap-label .asset-icon { width: 20px; height: 20px; }

    .heatmap-price { font-size: 0.95rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .heatmap-change { font-size: 0.8rem; font-weight: 700; }
    .heatmap-change.up { color: var(--green); }
    .heatmap-change.down { color: var(--red); }

    /* ---------- Table ---------- */
    .table-container {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .data-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .data-table thead { background: var(--bg); }

    .data-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    [dir="rtl"] .data-table th { text-align: right; }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .data-table tbody tr { transition: background 0.15s ease; }
    .data-table tbody tr:hover { background: var(--bg); }
    .data-table tbody tr:last-child td { border-bottom: none; }

    .table-asset { display: flex; align-items: center; gap: 10px; }
    .table-asset .asset-icon { width: 24px; height: 24px; }
    .table-asset-name { font-weight: 600; }

    .table-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .table-change.up { color: var(--green); background: rgba(34, 197, 94, 0.1); }
    .table-change.down { color: var(--red); background: rgba(239, 68, 68, 0.1); }

    .sparkline-canvas { width: 80px; height: 30px; display: block; }

    /* ---------- Wallet ---------- */
    .wallet-section { max-width: 1440px; margin: 0 auto; display: grid; gap: 24px; }

    .wallet-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .wallet-stat { display: flex; flex-direction: column; gap: 6px; }

    .wallet-stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .wallet-stat-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .wallet-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .wallet-table {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .wallet-empty { padding: 60px 20px; text-align: center; color: var(--muted); }

    /* ---------- Calendar Heatmap ---------- */
    .calendar-section { max-width: 1440px; margin: 0 auto; }

    .calendar-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .calendar-grid {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18px, 1fr));
      gap: 3px;
      overflow-x: hidden;
    }

    .calendar-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .calendar-cell:hover { transform: scale(1.3); z-index: 10; position: relative; }

    .calendar-cell.positive { background: var(--green); opacity: 0.3; }
    .calendar-cell.positive.strong { opacity: 0.6; }
    .calendar-cell.positive.stronger { opacity: 1; }

    .calendar-cell.negative { background: var(--red); opacity: 0.3; }
    .calendar-cell.negative.strong { opacity: 0.6; }
    .calendar-cell.negative.stronger { opacity: 1; }

    .calendar-cell.neutral { background: var(--border); }

    .calendar-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .cal-tooltip {
      position: fixed;
      z-index: 300;
      pointer-events: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      max-width: 240px;
    }

    .cal-tooltip.show { opacity: 1; transform: translateY(0); }
    .cal-tooltip .tt-date { font-weight: 700; margin-bottom: 4px; }
    .cal-tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
    .cal-tooltip .tt-row strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .cal-tooltip .up { color: var(--green); }
    .cal-tooltip .down { color: var(--red); }

    /* ---------- Afford / What can I buy ---------- */
    .afford-section { max-width: 1440px; margin: 0 auto; }

    .afford-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .afford-header label { font-weight: 600; font-size: 0.9rem; }
    #affordAmount { width: 220px; }

    .afford-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      overflow-x: hidden;
    }

    .afford-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .afford-tile-top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; min-width: 0; }
    .afford-price { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .afford-qty { font-size: 1.15rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .afford-qty small { color: var(--muted); font-weight: 500; font-size: 0.7rem; }

    /* ---------- Command Palette ---------- */
    .command-palette {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 100px;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .command-palette.show { display: flex; }

    .command-palette-inner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .command-search {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 20px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .command-list { flex: 1; overflow-y: auto; padding: 8px; }

    .command-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.1s ease;
    }

    .command-item:hover, .command-item.selected { background: var(--border); }
    .command-item-text { flex: 1; font-weight: 500; }
    .command-item-shortcut { font-size: 0.75rem; color: var(--muted); }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      max-width: 1440px;
      margin: 70px auto 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    /* ============================================================
       STYLE: NEO-BRUTALISM
       ============================================================ */
    html[data-style="neo"] {
      --bg: #F3E9D2; --card: #FBF3E0; --border: #141414;
      --text: #141414; --muted: #6E6552;
      --accent: #F07818; --accent-soft: rgba(240, 120, 24, 0.3);
      --green: #178A44; --red: #D23B2E; --radius: 14px;
    }
    html[data-style="neo"][data-theme="dark"] {
      --bg: #171310; --card: #241E17; --border: #EFE3C8;

// ---------- Jalali ----------
let jalaliFullFormatter, jalaliShortFormatter, jalaliMonthFormatter;
const jalaliMonthKeyFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", { year: "numeric", month: "numeric" });

function buildDateFormatters() {
  const locale = currentLang === "fa" ? "fa-IR-u-ca-persian" : "en-US-u-ca-persian-nu-latn";
  jalaliFullFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long", day: "numeric" });
  jalaliShortFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "2-digit", day: "2-digit" });
  jalaliMonthFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long" });
}

function parseDate(d) { return new Date(`${d}T12:00:00Z`); }
function toJalali(d) { return jalaliFullFormatter.format(parseDate(d)); }
function toJalaliShort(d) { return jalaliShortFormatter.format(parseDate(d)); }
function getJalaliMonthLabel(d) { return jalaliMonthFormatter.format(parseDate(d)); }
function getJalaliMonthKey(d) {
  const parts = jalaliMonthKeyFormatter.formatToParts(parseDate(d));
  const y = parts.find(p => p.type === "year")?.value || "0000";
  const m = parts.find(p => p.type === "month")?.value || "00";
  return `${y}-${m.padStart(2, "0")}`;
}

const ASSETS = [

};

const assetMeta = {};

function mergeFinMeta(item) {
  const asset = ASSETS.find(a => String(a.key) === String(item.key));
  if (asset && (item.icon || item.image)) assetMeta[asset.id] = { icon: item.icon || item.image, faTitle: item.title || "" };
}
function mergePampMeta(item) {
  const asset = ASSETS.find(a => Number(a.key) === Number(item.weightGram));
  if (asset && item.image) assetMeta[asset.id] = { icon: item.image, faTitle: item.name || "" };
}
function extractMetaFromEntry(entry) {
  if (!entry) return;
  const fin = Array.isArray(entry.financial) ? entry.financial : (Array.isArray(entry.data) ? entry.data : null);
  if (fin) fin.forEach(mergeFinMeta);
  if (entry.pamp && Array.isArray(entry.pamp.items)) entry.pamp.items.forEach(mergePampMeta);
}

async function loadAssetMetaFromAPI() {
  try {
    const [fin, pamp] = await Promise.allSettled([
      fetch("https://api.dastyar.io/express/financial-item").then(r => r.json()),
      fetch("https://amirmasoud.netlify.app/api/v1/pamp").then(r => r.json())
    ]);
    if (fin.status === "fulfilled" && Array.isArray(fin.value)) fin.value.forEach(mergeFinMeta);
    if (pamp.status === "fulfilled" && pamp.value && Array.isArray(pamp.value.items)) pamp.value.items.forEach(mergePampMeta);
  } catch {}
  if (currentEntries.length) renderDashboard();
}

function getAssetIcon(asset) { return assetMeta[asset.id]?.icon || ICON_FALLBACKS[asset.id] || null; }

function assetLabel(asset) {
  if (currentLang === "fa") {

    const fa = assetMeta[asset.id]?.faTitle;
    if (fa) return fa;
  }
  return asset.label;
}

function iconHtml(asset) {
  const src = getAssetIcon(asset);
  const dot = `<span class="asset-icon-fallback" style="background:${asset.color};display:${src ? "none" : "inline-block"}"></span>`;

  return `<img class="asset-icon" src="${src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';">${dot}`;
}

// ---------- URL ----------
function parseURLState() {
  const p = new URLSearchParams(window.location.search);
  if (p.has("view")) currentView = p.get("view");
  if (p.has("mode")) currentMode = p.get("mode");
  if (p.has("category")) activeCategory = p.get("category");
  if (p.has("lang")) currentLang = p.get("lang");
  if (p.has("style")) currentStyle = p.get("style");
  if (p.has("q")) searchQuery = p.get("q");
}

function updateURLState() {
  const p = new URLSearchParams();
  if (currentView !== URL_DEFAULTS.view) p.set("view", currentView);
  if (currentMode !== URL_DEFAULTS.mode) p.set("mode", currentMode);
  if (activeCategory !== URL_DEFAULTS.category) p.set("category", activeCategory);
  if (currentLang !== URL_DEFAULTS.lang) p.set("lang", currentLang);
  if (currentStyle !== URL_DEFAULTS.style) p.set("style", currentStyle);
  if (searchQuery) p.set("q", searchQuery);
  const qs = p.toString();
  window.history.replaceState({}, "", window.location.pathname + (qs ? `?${qs}` : ""));
}

// ---------- Utils ----------
function debounce(fn, wait = 200) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); };
}

function fmt(v) {
  const n = Number(v);
  if (v == null || !Number.isFinite(n)) return "—";
  return n.toLocaleString(numLocale(), { maximumFractionDigits: 2 });
}

function fmtQty(q) {
  if (q == null || !Number.isFinite(q)) return "—";
  // Always use thousand separators for better UX
  if (q >= 1000) {
    return q.toLocaleString(numLocale(), { maximumFractionDigits: 2 });
  }
  if (q >= 1) {
    return q.toLocaleString(numLocale(), { maximumFractionDigits: 2 });
  }
  // For very small numbers, show more decimals
  return q.toLocaleString(numLocale(), { maximumFractionDigits: 6 });
}

// ---------- Prices ----------
function getAssetPriceInToman(asset, entries) {
  const values = getAssetValues(asset, entries);
  const price = values[values.length - 1];
  if (!price) return null;

  if (String(asset.key).startsWith("usd_")) {
    const usdAsset = ASSETS.find(a => a.key === "usd");
    const usdValues = getAssetValues(usdAsset, entries);
    const usdPrice = usdValues[usdValues.length - 1];
    return usdPrice ? price * usdPrice : null;
  }

  return price;
}

// ---------- Wallet ----------
function calculateWalletValue() {
  if (!currentEntries.length || !wallet.length) return { total: 0, holdings: [] };

  let total = 0;
  const holdings = wallet.map(h => {
    const asset = ASSETS.find(a => a.id === h.assetId);
    if (!asset) return null;

    const price = getAssetPriceInToman(asset, currentEntries);
    if (!price) return null;

    const value = price * h.quantity;
    total += value;

    return { asset, quantity: h.quantity, price, value, percentage: 0 };
  }).filter(Boolean);

  holdings.forEach(h => { h.percentage = total > 0 ? (h.value / total) * 100 : 0; });

  return { total, holdings };
}

// Optimized calendar loading with parallel fetching and caching
async function loadCalendarData() {
  const assetId = document.getElementById("calendarAsset")?.value || ASSETS[0].id;
  const asset = ASSETS.find(a => a.id === assetId);
  if (!asset) return;

  // Show loading state
  calendarGrid.innerHTML = `<div class="calendar-loading">${t("loadingCalendar")}</div>`;

  const cacheKey = assetId;
  if (calendarCache.has(cacheKey)) {
    renderCalendarCells(calendarCache.get(cacheKey));
    return;
  }

  const datesToLoad = allDates.slice(0, Math.min(365, allDates.length));
  
  // Fetch in parallel batches of 20 for better performance
  const batchSize = 20;
  const dayChanges = [];
  
  for (let i = 0; i < datesToLoad.length; i += batchSize) {
    const batch = datesToLoad.slice(i, i + batchSize);
    const batchPromises = batch.map(async (date) => {
      const json = await fetchDay(date);
      if (!json || !Array.isArray(json) || json.length < 2) {
        return { date, change: 0, open: null, close: null };
      }

      const values = getAssetValues(asset, json);
      const clean = values.filter(v => v != null && v > 0);
      const first = clean[0] ?? null;
      const last = clean.length ? clean[clean.length - 1] : null;

      let change = 0;
      if (first && last && first > 0) change = ((last - first) / first) * 100;

      return { date, change, open: first, close: last };
    });

    const batchResults = await Promise.all(batchPromises);
    dayChanges.push(...batchResults);
  }

  dayChanges.reverse();
  
  // Cache the results
  calendarCache.set(cacheKey, dayChanges);
  
  renderCalendarCells(dayChanges);
}

function renderCalendarCells(dayChanges) {
  calendarGrid.innerHTML = "";
  
  dayChanges.forEach(day => {
    const cell = document.createElement("div");
    cell.className = "calendar-cell neutral";

    if (day.change > 0.5) {
      cell.className = "calendar-cell positive";
      if (day.change > 2) cell.classList.add("strong");
      if (day.change > 5) cell.classList.add("stronger");
    } else if (day.change < -0.5) {
      cell.className = "calendar-cell negative";
      if (day.change < -2) cell.classList.add("strong");
      if (day.change < -5) cell.classList.add("stronger");
    }

    cell.dataset.date = day.date;
    cell.dataset.change = day.change.toFixed(2);
    cell.dataset.open = day.open ?? "";
    cell.dataset.close = day.close ?? "";

    calendarGrid.appendChild(cell);
  });
}

function positionCalTooltip(x, y) {
  const pad = 14;
  const r = calTooltip.getBoundingClientRect();

  if (left + r.width > window.innerWidth - 8) left = x - r.width - pad;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - pad;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  calTooltip.style.left = left + "px";
  calTooltip.style.top = top + "px";
}

// ---------- Sparklines ----------
function drawSparkline(canvas, values, color) {
  const ctx = canvas.getContext("2d");
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);

  const clean = values.filter(v => v != null && v > 0);
  if (clean.length < 2) return;

  const min = Math.min(...clean);
  const max = Math.max(...clean);
  const range = max - min || 1;

  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  const step = w / (clean.length - 1);

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  clean.forEach((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// ---------- Filtering ----------

    const okCat = activeCategory === "all" ||

    if (!okCat) return false;

    const faPamp = asset.category === "pamp" ? assetLabel(asset) : "";

  });
}

// ---------- Data ----------
async function fetchDay(date) {
  const latest = allDates[0];
  const cache = date !== latest;
  if (cache && dataCache.has(date)) return dataCache.get(date);
  const res = await fetch(`data/${date}.json`);
  const json = res.ok ? await res.json() : null;
  if (cache && json) dataCache.set(date, json);
  return json;
}

function computeDisplayIndices(length, maxPoints) {
  maxPoints = Math.max(2, maxPoints);
  if (!length) { displayIndices = []; displayLabels = []; return; }
  if (length <= maxPoints) displayIndices = Array.from({ length }, (_, i) => i);
  else displayIndices = Array.from({ length: maxPoints }, (_, i) => Math.round(i * (length - 1) / (maxPoints - 1)));
  displayLabels = displayIndices.map(i => currentLabels[i]);
}

function getAssetValues(asset, entries) {
  return entries.map(entry => {
    if (!entry) return null;
    let price = null;
    if (Array.isArray(entry.data)) {
      const it = entry.data.find(i => String(i.key) === String(asset.key));
      if (it) price = Number(it.price);
    }
    if (price == null && Array.isArray(entry.financial)) {
      const it = entry.financial.find(i => String(i.key) === String(asset.key));
      if (it) price = Number(it.price);
    }
    if (price == null && entry.pamp && Array.isArray(entry.pamp.items)) {
      const it = entry.pamp.items.find(i => Number(i.weightGram) === Number(asset.key));
      if (it) price = Number(it.price);
    }
    return Number.isFinite(price) && price > 0 ? price : null;
  });
}

function calculateStats(values) {
  const clean = values.filter(v => v != null && v > 0);
  if (!clean.length) return null;
  const open = clean[0];
  const close = clean[clean.length - 1];
  const prev = clean.length > 1 ? clean[clean.length - 2] : open;
  const low = Math.min(...clean);
  const high = Math.max(...clean);
  const change = prev > 0 ? ((close - prev) / prev) * 100 : 0;
  return { open, prev, close, low, high, change };
}

async function loadData(date) {
  renderSkeletonCards();
  const json = await fetchDay(date);
  const entries = Array.isArray(json) ? json : [];
  selectedDate = date; selectedMonthKey = null;
  currentEntries = entries;
  currentLabels = entries.map(e => e.time || "");
  computeDisplayIndices(currentLabels.length, 240);
  extractMetaFromEntry(entries[entries.length - 1]);
  refreshDateLabel();
  renderDashboard();
  const last = entries[entries.length - 1];
  if (last) { lastFooter = { view: "daily", dateStr: date, time: last.time }; renderFooter(); }
}

async function loadMonthlyData(dates, monthKey) {
  renderSkeletonCards();
  const allData = await Promise.all(dates.map(d => fetchDay(d)));
  const labels = [], entries = [];
  for (let i = dates.length - 1; i >= 0; i--) {
    const day = allData[i];
    if (Array.isArray(day) && day.length > 0) {
      labels.push(toJalaliShort(dates[i]));
      entries.push(day[day.length - 1]);
    }
  }
  selectedMonthKey = monthKey; selectedDate = null;
  currentLabels = labels; currentEntries = entries;
  computeDisplayIndices(currentLabels.length, 120);
  extractMetaFromEntry(entries[entries.length - 1]);
  refreshDateLabel();
  renderDashboard();
  if (dates.length && entries.length) {
    const last = entries[entries.length - 1];
    lastFooter = { view: "monthly", dateStr: dates[0], time: last.time || "" };
    renderFooter();
  }
}

function createCard(asset) {
  const isFav = favorites.includes(asset.id);
  const label = assetLabel(asset);
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.assetId = asset.id;
  div.innerHTML = `
    <div class="card-header">
      <div class="asset-info">
        <div class="asset-title">
          ${iconHtml(asset)}
          <h2 title="${label}">${label}</h2>
          <button type="button" class="fav-btn ${isFav ? "active" : ""}" data-fav="${asset.id}" title="Favorite">
            <i data-feather="star"></i>
          </button>
        </div>
        <div class="asset-meta">
          <span>${t("now")} <strong id="now-${asset.id}">—</strong></span>
          <span>${t("low")} <strong id="low-${asset.id}">—</strong></span>
          <span>${t("high")} <strong id="high-${asset.id}">—</strong></span>
        </div>
        <div class="range-bar">
          <div class="range-fill" id="range-fill-${asset.id}"></div>
          <div class="range-dot" id="range-dot-${asset.id}"></div>
        </div>
      </div>
      <div class="price-info">
        <div class="price-current" id="price-${asset.id}">—</div>
        <div class="price-change" id="change-${asset.id}">—</div>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="${asset.id}"></canvas></div>
  `;
  grid.appendChild(div);
  requestAnimationFrame(() => div.classList.add("visible"));
}

function createChart(canvasId, labels, data, label, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (charts[canvasId]) charts[canvasId].destroy();

  const colors = getChartColors();
  let lastValidIndex = -1;
  for (let i = data.length - 1; i >= 0; i--) { if (data[i] != null && data[i] > 0) { lastValidIndex = i; break; } }

  const datasets = [];
  if (colors.casing) {
    datasets.push({
      label, data, borderColor: colors.casing, borderWidth: 6, tension: 0.35,
      spanGaps: true, fill: false, pointRadius: 0, pointHoverRadius: 0
    });
  }
  datasets.push({
    label, data, borderColor: color, borderWidth: colors.casing ? 3 : 2,
    fill: colors.fill, tension: 0.35, spanGaps: true,
    backgroundColor: colors.fill ? (ctx => {
      const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 300);
      g.addColorStop(0, color + "33"); g.addColorStop(1, "transparent");
      return g;
    }) : "transparent",
    pointRadius: ctx => ctx.dataIndex === lastValidIndex ? 4.5 : 0,
    pointHoverRadius: 6, pointBackgroundColor: color,
    pointBorderColor: colors.casing || color, pointBorderWidth: colors.casing ? 2 : 0
  });

  const mainIndex = datasets.length - 1;

  charts[canvasId] = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, resizeDelay: 120,
      animation: { duration: 300, easing: "easeOutQuart" },
      interaction: { intersect: false, mode: "index" },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: colors.tooltipBg, titleColor: colors.tooltipText, bodyColor: colors.tooltipText,
          borderColor: colors.tooltipBorder, borderWidth: 1, padding: 12, displayColors: false,
          filter: item => item.datasetIndex === mainIndex,
          callbacks: {
            title: items => items.length ? items[0].label : "",
            label: ctx => ctx.parsed.y == null ? "No data" : fmt(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: colors.text, maxRotation: 0, autoSkipPadding: 18, maxTicksLimit: 8, font: { family: colors.fontFamily, weight: 600 } },
          grid: { color: colors.grid }
        },
        y: {
          beginAtZero: false, grace: "10%",
          ticks: { color: colors.text, maxTicksLimit: 6, font: { family: colors.fontFamily, weight: 600 }, callback: v => Number(v).toLocaleString(numLocale()) },
          grid: { color: colors.grid }
        }
      }
    }
  });
}

function updateAssetStats(assetId, values) {
  const stats = calculateStats(values);
  assetStats[assetId] = stats;
  const priceEl = document.getElementById(`price-${assetId}`);
  const changeEl = document.getElementById(`change-${assetId}`);
  const nowEl = document.getElementById(`now-${assetId}`);
  const lowEl = document.getElementById(`low-${assetId}`);
  const highEl = document.getElementById(`high-${assetId}`);
  const fillEl = document.getElementById(`range-fill-${assetId}`);
  const dotEl = document.getElementById(`range-dot-${assetId}`);
  if (!priceEl || !changeEl || !nowEl || !lowEl || !highEl || !fillEl || !dotEl) return;

  if (!stats) {
    priceEl.textContent = "—"; changeEl.textContent = "—"; changeEl.className = "price-change";
    nowEl.textContent = "—"; lowEl.textContent = "—"; highEl.textContent = "—";
    fillEl.style.width = "0%"; dotEl.style.left = "0%";
    return;
  }

  priceEl.textContent = fmt(stats.close);
  nowEl.textContent = fmt(stats.close);
  lowEl.textContent = fmt(stats.low);
  highEl.textContent = fmt(stats.high);
  changeEl.textContent = `${stats.change >= 0 ? "▲" : "▼"} ${Math.abs(stats.change).toFixed(2)}%`;
  changeEl.className = `price-change ${stats.change >= 0 ? "up" : "down"}`;
  const pos = stats.high > stats.low ? ((stats.close - stats.low) / (stats.high - stats.low)) * 100 : 0;
  fillEl.style.width = `${pos}%`;
  dotEl.style.left = `${pos}%`;
}

function renderCharts() {
  destroyCharts();
  grid.innerHTML = "";
  grid.style.display = "";
  heatmapGrid.style.display = "none";
  tableContainer.style.display = "none";
  walletSection.style.display = "none";
  calendarSection.style.display = "none";
  affordSection.style.display = "none";

  if (!currentEntries.length) { grid.innerHTML = `<div class="empty-state">${t("noData")}</div>`; return; }
  const visible = getVisibleAssets();
  if (!visible.length) {
    grid.innerHTML = `<div class="empty-state">${activeCategory === "favorites" ? t("noFavorites") : t("noAssets")}</div>`;
    return;
  }
  visible.forEach(asset => {
    createCard(asset);
    const full = getAssetValues(asset, currentEntries);
    const chartVals = displayIndices.map(i => full[i] ?? null);
    createChart(asset.id, displayLabels, chartVals, asset.label, asset.color);
    updateAssetStats(asset.id, full);
  });
  feather.replace();
}

function renderHeatmap() {
  grid.style.display = "none";
  tableContainer.style.display = "none";
  walletSection.style.display = "none";
  calendarSection.style.display = "none";
  affordSection.style.display = "none";
  heatmapGrid.style.display = "";
  heatmapGrid.innerHTML = "";
  const visible = getVisibleAssets();
  if (!visible.length) { heatmapGrid.innerHTML = `<div class="empty-state">${t("noAssets")}</div>`; return; }

  visible.forEach(asset => {
    const stats = calculateStats(getAssetValues(asset, currentEntries));
    const label = assetLabel(asset);
    const tile = document.createElement("div");
    let cls = "heatmap-tile neutral", chCls = "", chTxt = "—";
    if (stats) {
      if (stats.change > 0) { cls = "heatmap-tile positive"; chCls = "heatmap-change up"; chTxt = `▲ ${stats.change.toFixed(2)}%`; }
      else if (stats.change < 0) { cls = "heatmap-tile negative"; chCls = "heatmap-change down"; chTxt = `▼ ${Math.abs(stats.change).toFixed(2)}%`; }
    }
    tile.className = cls;
    tile.innerHTML = `
      <div class="heatmap-label">${iconHtml(asset)}<span class="hl-text" title="${label}">${label}</span></div>
      <div>
        <div class="heatmap-price">${stats ? fmt(stats.close) : "—"}</div>
        <div class="${chCls}">${chTxt}</div>
      </div>`;
    heatmapGrid.appendChild(tile);
  });
}

function renderTable() {
  grid.style.display = "none";
  heatmapGrid.style.display = "none";
  walletSection.style.display = "none";
  calendarSection.style.display = "none";
  affordSection.style.display = "none";
  tableContainer.style.display = "";
  tableBody.innerHTML = "";
  const visible = getVisibleAssets();
  if (!visible.length) {
    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px">${t("noAssets")}</td></tr>`;
    return;
  }
  visible.forEach(asset => {
    const fullValues = getAssetValues(asset, currentEntries);
    const stats = calculateStats(fullValues);
    const label = assetLabel(asset);
    const tr = document.createElement("tr");
    let ch = "—";
    if (stats) {
      const cls = stats.change >= 0 ? "up" : "down";
      const arrow = stats.change >= 0 ? "▲" : "▼";
      ch = `<span class="table-change ${cls}">${arrow} ${Math.abs(stats.change).toFixed(2)}%</span>`;
    }

    const sparkId = `spark-${asset.id}`;
    tr.innerHTML = `
      <td><div class="table-asset">${iconHtml(asset)}<span class="table-asset-name">${label}</span></div></td>
      <td><canvas id="${sparkId}" class="sparkline-canvas"></canvas></td>
      <td>${stats ? fmt(stats.close) : "—"}</td>
      <td>${stats ? fmt(stats.low) : "—"}</td>
      <td>${stats ? fmt(stats.high) : "—"}</td>
      <td>${ch}</td>`;
    tableBody.appendChild(tr);

    requestAnimationFrame(() => {
      const canvas = document.getElementById(sparkId);
      if (canvas) drawSparkline(canvas, fullValues.slice(-50), asset.color);
    });
  });
}

function renderDashboard() {
  assetStats = {};
  calTooltip.classList.remove("show");
  if (currentMode === "charts") renderCharts();
  else if (currentMode === "heatmap") renderHeatmap();
  else if (currentMode === "table") renderTable();
  else if (currentMode === "wallet") renderWallet();
  else if (currentMode === "calendar") renderCalendar();
  else if (currentMode === "afford") renderAfford();
  updateURLState();
}

// ---------- Command Palette ----------
const commands = [
  { id: "daily", text: "Switch to Daily View", shortcut: "D", action: () => setView("daily") },
  { id: "monthly", text: "Switch to Monthly View", shortcut: "M", action: () => setView("monthly") },
  { id: "charts", text: "Switch to Charts Mode", shortcut: "1", action: () => setMode("charts") },
  { id: "heatmap", text: "Switch to Heatmap Mode", shortcut: "2", action: () => setMode("heatmap") },
  { id: "table", text: "Switch to Table Mode", shortcut: "3", action: () => setMode("table") },
  { id: "wallet", text: "Switch to Wallet Mode", shortcut: "4", action: () => setMode("wallet") },
  { id: "calendar", text: "Switch to Calendar Mode", shortcut: "5", action: () => setMode("calendar") },
  { id: "afford", text: "Switch to Afford Mode", shortcut: "6", action: () => setMode("afford") },
  { id: "theme", text: "Toggle Theme", shortcut: "T", action: () => applyTheme(currentTheme === "dark" ? "light" : "dark") },
  { id: "lang", text: "Toggle Language", shortcut: "L", action: () => applyLanguage(currentLang === "en" ? "fa" : "en") },
  { id: "style", text: "Cycle UI Style", shortcut: "S", action: () => {
    const idx = STYLES.indexOf(currentStyle);
    applyStyle(STYLES[(idx + 1) % STYLES.length]);
  }},
  { id: "all", text: "Show All Assets", action: () => setCategory("all") },
  { id: "currency", text: "Show Currencies", action: () => setCategory("currency") },
  { id: "gold", text: "Show Gold", action: () => setCategory("gold") },
  { id: "crypto", text: "Show Crypto", action: () => setCategory("crypto") },
  { id: "pamp", text: "Show PAMP", action: () => setCategory("pamp") },
  { id: "favorites", text: "Show Favorites", action: () => setCategory("favorites") }
];

function setView(view) {
  currentView = view;
  document.querySelector("#viewToggle .active")?.classList.remove("active");
  document.querySelector(`#viewToggle [data-view="${view}"]`)?.classList.add("active");
  renderDateMenu();
  if (currentView === "daily" && allDates.length) loadData(allDates[0]);
  if (currentView === "monthly" && allMonths.length) loadMonthlyData(allMonths[0].dates, allMonths[0].key);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelector("#modeToggle .active")?.classList.remove("active");
  document.querySelector(`#modeToggle [data-mode="${mode}"]`)?.classList.add("active");
  renderDashboard();
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll("#categoryTabs .tab").forEach(b => b.classList.toggle("active", b.dataset.category === cat));
  renderDashboard();
}

let commandSelectedIndex = 0;
let commandFiltered = commands;

function openCommandPalette() {
  commandPalette.classList.add("show");
  commandSearch.value = "";
  commandSearch.focus();
  commandFiltered = commands;
  commandSelectedIndex = 0;
  renderCommandList();
}

function closeCommandPalette() {
  commandPalette.classList.remove("show");
}

function renderCommandList() {
  commandList.innerHTML = commandFiltered.map((cmd, i) => `
    <div class="command-item ${i === commandSelectedIndex ? "selected" : ""}" data-index="${i}">
      <div class="command-item-text">${cmd.text}</div>
      ${cmd.shortcut ? `<div class="command-item-shortcut">${cmd.shortcut}</div>` : ""}
    </div>
  `).join("");

  commandList.querySelectorAll(".command-item").forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.index);
      commandFiltered[idx].action();
      closeCommandPalette();
    };
  });
}

commandSearch.addEventListener("input", () => {
  const q = commandSearch.value.toLowerCase();
  commandFiltered = commands.filter(c => c.text.toLowerCase().includes(q));
  commandSelectedIndex = 0;
  renderCommandList();
});

commandSearch.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    commandSelectedIndex = Math.min(commandSelectedIndex + 1, commandFiltered.length - 1);
    renderCommandList();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    commandSelectedIndex = Math.max(commandSelectedIndex - 1, 0);
    renderCommandList();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (commandFiltered[commandSelectedIndex]) {
      commandFiltered[commandSelectedIndex].action();
      closeCommandPalette();
    }
  } else if (e.key === "Escape") {
    closeCommandPalette();
  }
});

commandPalette.addEventListener("click", e => {
  if (e.target === commandPalette) closeCommandPalette();
});

// ---------- Keyboard Shortcuts ----------
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;

  const key = e.key.toLowerCase();

  if (e.ctrlKey && key === "k") { e.preventDefault(); openCommandPalette(); }
  else if (key === "/") { e.preventDefault(); openCommandPalette(); }
  else if (key === "escape") { closeCommandPalette(); dateMenu.classList.remove("show"); }
  else if (key === "d") setView("daily");
  else if (key === "m") setView("monthly");
  else if (key === "1") setMode("charts");
  else if (key === "2") setMode("heatmap");
  else if (key === "3") setMode("table");
  else if (key === "4") setMode("wallet");
  else if (key === "5") setMode("calendar");
  else if (key === "6") setMode("afford");
  else if (key === "t") applyTheme(currentTheme === "dark" ? "light" : "dark");
  else if (key === "l") applyLanguage(currentLang === "en" ? "fa" : "en");
  else if (key === "s") {
    const idx = STYLES.indexOf(currentStyle);
    applyStyle(STYLES[(idx + 1) % STYLES.length]);
  }
});

// ---------- Dates ----------
function rebuildMonths() {
  const map = {};
  allDates.forEach(d => {
    const k = getJalaliMonthKey(d);
    if (!map[k]) map[k] = { key: k, label: getJalaliMonthLabel(d), dates: [] };
    map[k].dates.push(d);
  });
  allMonths = Object.values(map).sort((a, b) => b.key.localeCompare(a.key));
}

function renderDateMenu() {
  dateMenu.innerHTML = "";
  const items = currentView === "daily" ? allDates : allMonths;
  if (!items.length) {
    const d = document.createElement("div");
    d.textContent = "No dates found";
    dateMenu.appendChild(d);
    return;
  }
  items.forEach(item => {
    const div = document.createElement("div");
    if (currentView === "daily") {
      div.textContent = toJalali(item);
      div.onclick = () => { dateMenu.classList.remove("show"); loadData(item); };
    } else {
      div.textContent = item.label;
      div.onclick = () => { dateMenu.classList.remove("show"); loadMonthlyData(item.dates, item.key); };
    }
    dateMenu.appendChild(div);
  });
}

async function loadAvailableDates() {
  const res = await fetch("data/dates.json", { cache: "no-store" });
  allDates = res.ok ? await res.json() : [];
  if (!Array.isArray(allDates)) allDates = [];
  rebuildMonths();
  renderDateMenu();
  if (!allDates.length) { dateBtnText.textContent = "No dates"; return; }
  if (currentView === "daily") loadData(allDates[0]);
  else loadMonthlyData(allMonths[0].dates, allMonths[0].key);
}

// ---------- Events ----------
themeBtn.addEventListener("click", () => applyTheme(currentTheme === "dark" ? "light" : "dark"));

styleBtn.addEventListener("click", () => {
  const idx = STYLES.indexOf(currentStyle);
  applyStyle(STYLES[(idx + 1) % STYLES.length]);
});

langBtn.addEventListener("click", () => applyLanguage(currentLang === "en" ? "fa" : "en"));

viewToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn || btn.classList.contains("active")) return;
  document.querySelector("#viewToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentView = btn.dataset.view;
  renderDateMenu();
  if (currentView === "daily" && allDates.length) loadData(allDates[0]);
  if (currentView === "monthly" && allMonths.length) loadMonthlyData(allMonths[0].dates, allMonths[0].key);
});

modeToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.classList.contains("active")) return;
  document.querySelector("#modeToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentMode = btn.dataset.mode;
  renderDashboard();
});

categoryTabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  activeCategory = btn.dataset.category;
  document.querySelectorAll("#categoryTabs .tab").forEach(b => b.classList.toggle("active", b.dataset.category === activeCategory));
  renderDashboard();
});

assetSearch.addEventListener("input", debounce(() => {
  searchQuery = assetSearch.value.trim().toLowerCase();
  renderDashboard();
}, 200));

grid.addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn");
  if (!favBtn) return;
  const id = favBtn.dataset.fav;
  toggleFavorite(id);
  const isFav = favorites.includes(id);
  if (activeCategory === "favorites") { renderDashboard(); return; }
  favBtn.classList.toggle("active", isFav);
});

dateBtn.onclick = () => dateMenu.classList.toggle("show");
document.addEventListener("click", e => { if (!e.target.closest(".date-dropdown")) dateMenu.classList.remove("show"); });

// ---------- Init ----------
parseURLState();
buildDateFormatters();
document.documentElement.setAttribute("data-style", currentStyle);
styleBtn.title = "Style: " + (STYLE_NAMES[currentStyle] || currentStyle);
affordAmountInput.value = storageGet("affordAmount") || "1000000";
applyTheme(currentTheme);
applyLanguage(currentLang);

if (searchQuery) assetSearch.value = searchQuery;

document.querySelectorAll("#viewToggle button").forEach(b => b.classList.toggle("active", b.dataset.view === currentView));
document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === currentMode));
document.querySelectorAll("#categoryTabs .tab").forEach(b => b.classList.toggle("active", b.dataset.category === activeCategory));

feather.replace();
loadAssetMetaFromAPI();
loadAvailableDates();
</script>
