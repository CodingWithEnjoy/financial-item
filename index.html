<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Financial Charts</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    canvas {
      max-width: 1100px;
      margin: 30px auto;
      display: block;
      background: #020617;
      border-radius: 12px;
      padding: 20px;
    }
    input {
      padding: 6px 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<h1>📊 Hourly Financial Prices</h1>

<label>
  Select date:
  <input type="date" id="datePicker">
</label>

<canvas id="chart"></canvas>

<script>
const ctx = document.getElementById("chart").getContext("2d");
let chart;

const ASSETS = [
  { key: "usd", label: "USD (Toman)" },
  { key: "eur", label: "EUR (Toman)" },
  { key: "sekkeh", label: "Sekkeh Emami" },
  { key: "18ayar", label: "Gold 18k (Toman)" },
  { key: "usd_btc", label: "Bitcoin (USD)" }
];

async function loadData(date) {
  const res = await fetch(`data/${date}.json`);
  const json = await res.json();

  const labels = json.map(e => e.time);

  const datasets = ASSETS.map(asset => {
    const values = json.map(entry => {
      const item = entry.data.find(i => i.key === asset.key);
      return item ? Number(item.priceFloat) : null;
    });

    return {
      label: asset.label,
      data: values,
      borderWidth: 2,
      tension: 0.3
    };
  });

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#e5e7eb" }
        }
      },
      scales: {
        x: { ticks: { color: "#e5e7eb" } },
        y: {
          ticks: { color: "#e5e7eb" },
          beginAtZero: false
        }
      }
    }
  });
}

// default = today
const picker = document.getElementById("datePicker");
const today = new Date().toISOString().slice(0, 10);
picker.value = today;

picker.addEventListener("change", e => loadData(e.target.value));
loadData(today);
</script>

</body>
</html>
