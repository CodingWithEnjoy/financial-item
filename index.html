<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Financial Data Visualization</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    canvas {
      max-width: 1000px;
      margin: 40px auto;
      display: block;
      background: #020617;
      border-radius: 12px;
      padding: 20px;
    }
    select {
      padding: 6px 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>📊 Financial Prices (Hourly)</h1>

  <label>
    Select date:
    <input type="date" id="datePicker">
  </label>

  <canvas id="chart"></canvas>

  <script>
    const ctx = document.getElementById("chart").getContext("2d");
    let chart;

    async function loadData(date) {
      const res = await fetch(`data/${date}.json`);
      const json = await res.json();

      // 🔹 Example: Bitcoin (usd_btc)
      const labels = [];
      const prices = [];

      json.forEach(entry => {
        const btc = entry.data.find(i => i.key === "usd_btc");
        if (btc) {
          labels.push(entry.time);
          prices.push(Number(btc.priceFloat));
        }
      });

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Bitcoin (USD)",
            data: prices,
            borderWidth: 2,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: "#e5e7eb" } }
          },
          scales: {
            x: { ticks: { color: "#e5e7eb" } },
            y: { ticks: { color: "#e5e7eb" } }
          }
        }
      });
    }

    // Default = today
    const today = new Date().toISOString().slice(0, 10);
    const picker = document.getElementById("datePicker");
    picker.value = today;

    picker.addEventListener("change", e => loadData(e.target.value));

    loadData(today);
  </script>

</body>
</html>
