<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
      --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      padding: 48px 32px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    /* Layout */
    header {
      max-width: 1440px;
      margin: 0 auto 80px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .title-section h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }
    .title-section p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Components */
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .btn:hover {
      background: var(--border);
      border-color: var(--muted);
    }

    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .view-toggle button.active {
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow);
    }

    .date-dropdown { position: relative; }
    .date-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 220px;
      max-height: 320px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    .date-menu.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .date-menu div { 
      padding: 12px 16px; 
      cursor: pointer; 
      font-size: 0.875rem; 
      transition: background 0.1s;
      color: var(--text);
    }
    .date-menu div:hover { background: var(--border); }
    .date-menu div:not(:last-child) { border-bottom: 1px solid var(--border); }

    /* Grid & Cards */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); 
      column-gap: 24px;
      row-gap: 64px; /* Increased row gap for breathing room */
      max-width: 1440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    /* Card Header & Badges */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .asset-info h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .asset-meta {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .asset-meta span strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }

    .price-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .price-current {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .price-change {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .price-change.up {
      color: var(--green);
      background: rgba(34, 197, 94, 0.12);
    }
    .price-change.down {
      color: var(--red);
      background: rgba(239, 68, 68, 0.12);
    }

    canvas { 
      flex: 1; 
      min-height: 260px; 
    }

    /* Loading */
    .loader {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 100;
    }
    .loader.show { display: block; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 24px 16px; }
      header { margin-bottom: 40px; }
      .grid { 
        grid-template-columns: 1fr; 
        column-gap: 0;
        row-gap: 40px;
      }
      .price-current { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="title-section">
    <h1>📈 Markets</h1>
    <p>Real-time financial dashboard</p>
  </div>
  <div class="controls">
    <div class="view-toggle" id="viewToggle">
      <button data-view="daily" class="active">Daily</button>
      <button data-view="monthly">Monthly</button>
    </div>
    <div class="date-dropdown">
      <button class="btn" id="dateBtn">📅 Select Date</button>
      <div id="dateMenu" class="date-menu"></div>
    </div>
    <button class="btn" id="themeBtn">🌙</button>
  </div>
</header>

<section class="grid" id="chartGrid"></section>

<div class="loader" id="loader"></div>

<script>
const ASSETS = [
  { id: "usd", key: "usd", label: "USD", color: "#3b82f6" },
  { id: "eur", key: "eur", label: "EUR", color: "#a855f7" },
  { id: "sekkeh", key: "sekkeh", label: "Sekkeh", color: "#eab308" },
  { id: "gold", key: "18ayar", label: "Gold 18k", color: "#f59e0b" },
  { id: "btc", key: "usd_btc", label: "Bitcoin", color: "#f97316" },
  { id: "usdt", key: "usd_usdt", label: "Tether", color: "#22c55e" },
  { id: "gbp", key: "gbp", label: "GBP", color: "#8b5cf6" },
  { id: "rob", key: "rob", label: "Roub", color: "#ec4899" },
  { id: "try", key: "try", label: "TRY", color: "#ef4444" },
  { id: "aed", key: "aed", label: "AED", color: "#10b981" },
  { id: "pamp1", key: 1, label: "PAMP 1g", color: "#eab308" },
  { id: "pamp2_5", key: 2.5, label: "PAMP 2.5g", color: "#eab308" },
  { id: "pamp5", key: 5, label: "PAMP 5g", color: "#f97316" },
  { id: "pamp10", key: 10, label: "PAMP 10g", color: "#f97316" },
  { id: "pamp15", key: 15.55175, label: "PAMP 15.55g", color: "#ef4444" },
  { id: "pamp20", key: 20, label: "PAMP 20g", color: "#ef4444" },
  { id: "pamp31_1", key: 31.1035, label: "PAMP 1oz", color: "#ec4899" },
  { id: "pamp50", key: 50, label: "PAMP 50g", color: "#8b5cf6" },
  { id: "pamp100", key: 100, label: "PAMP 100g", color: "#a855f7" }
];

const charts = {};
const grid = document.getElementById("chartGrid");
const dateBtn = document.getElementById("dateBtn");
const dateMenu = document.getElementById("dateMenu");
const loader = document.getElementById("loader");

let currentView = 'daily';
let allDates = [];
let allMonths = [];

// --- Jalali Date Helpers ---
const jalaliFullFormatter = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' });
const jalaliShortFormatter = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' });
const jalaliMonthFormatter = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'long' });

const toJalali = (dateStr) => jalaliFullFormatter.format(new Date(dateStr + 'T00:00:00'));
const toJalaliShort = (dateStr) => jalaliShortFormatter.format(new Date(dateStr + 'T00:00:00'));
const getJalaliMonthLabel = (dateStr) => jalaliMonthFormatter.format(new Date(dateStr + 'T00:00:00'));

const getJalaliMonthKey = (dateStr) => {
  const parts = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric' }).formatToParts(new Date(dateStr + 'T00:00:00'));
  const year = parts.find(p => p.type === 'year').value;
  const month = parts.find(p => p.type === 'month').value;
  return `${year}-${month.padStart(2, '0')}`;
};

// --- Theme Management ---
const themes = ['light', 'dark', 'system'];
let currentTheme = localStorage.getItem('theme') || 'system';

function getChartColors() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    text: isDark ? '#a1a1aa' : '#71717a',
    grid: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)',
    tooltipBg: isDark ? '#18181b' : '#ffffff',
    tooltipText: isDark ? '#fafafa' : '#18181b',
    tooltipBorder: isDark ? '#27272a' : '#e4e4e7'
  };
}

function updateChartsTheme() {
  const colors = getChartColors();
  Object.values(charts).forEach(chart => {
    chart.options.scales.x.ticks.color = colors.text;
    chart.options.scales.x.grid.color = colors.grid;
    chart.options.scales.y.ticks.color = colors.text;
    chart.options.scales.y.grid.color = colors.grid;
    if(chart.options.plugins.tooltip) {
      chart.options.plugins.tooltip.backgroundColor = colors.tooltipBg;
      chart.options.plugins.tooltip.titleColor = colors.tooltipText;
      chart.options.plugins.tooltip.bodyColor = colors.tooltipText;
      chart.options.plugins.tooltip.borderColor = colors.tooltipBorder;
    }
    chart.update('none');
  });
}

function applyTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('theme', theme);
  const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  updateChartsTheme();
}

document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(themes[(themes.indexOf(currentTheme) + 1) % themes.length]);
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(currentTheme === 'system') applyTheme('system');
});
applyTheme(currentTheme);

// --- UI Helpers ---
function showLoading(show) {
  loader.classList.toggle('show', show);
}

function createCard(asset) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="card-header">
      <div class="asset-info">
        <h2>${asset.label}</h2>
        <div class="asset-meta">
          <span>L <strong id="low-${asset.id}">—</strong></span>
          <span>H <strong id="high-${asset.id}">—</strong></span>
        </div>
      </div>
      <div class="price-info">
        <div class="price-current" id="price-${asset.id}">—</div>
        <div class="price-change" id="change-${asset.id}">—</div>
      </div>
    </div>
    <canvas id="${asset.id}"></canvas>
  `;
  grid.appendChild(div);
  setTimeout(() => div.classList.add('visible'), 50);
}

function createChart(canvasId, labels, data, label, color) {
  if (charts[canvasId]) charts[canvasId].destroy();
  const colors = getChartColors();
  
  charts[canvasId] = new Chart(document.getElementById(canvasId).getContext("2d"), {
    type: "line",
    data: { 
      labels, 
      datasets: [{ 
        label, data, borderColor: color, 
        backgroundColor: ctx => { 
          const g = ctx.chart.ctx.createLinearGradient(0,0,0,300); 
          g.addColorStop(0, color + "33"); 
          g.addColorStop(1, "transparent"); 
          return g; 
        }, 
        borderWidth: 2, fill: true, tension: 0.4,
        pointRadius: ctx => ctx.dataIndex === data.length-1 ? 4 : 0, 
        pointHoverRadius: 6, 
        pointBackgroundColor: color
      }] 
    },
    options: { 
      responsive: true, maintainAspectRatio: false, 
      animation: { duration: 600, easing: 'easeOutQuart' },
      interaction: { intersect: false, mode: "index" }, 
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: colors.tooltipBg, titleColor: colors.tooltipText, bodyColor: colors.tooltipText,
          borderColor: colors.tooltipBorder, borderWidth: 1, padding: 12, displayColors: false,
          callbacks: { label: (ctx) => ctx.parsed.y.toLocaleString() }
        }
      }, 
      scales: {
        x: { ticks: { color: colors.text, maxRotation: 0 }, grid: { color: colors.grid } },
        y: { 
          beginAtZero: false, grace: "10%", 
          ticks: { color: colors.text, callback: v => v.toLocaleString() }, 
          grid: { color: colors.grid } 
        }
      }
    }
  });
}

// --- Data Logic ---
async function loadData(date) {
  showLoading(true);
  const res = await fetch(`data/${date}.json`);
  if (!res.ok) { showLoading(false); return; }
  const json = await res.json();

  grid.innerHTML = "";
  ASSETS.forEach(createCard);
  const labels = json.map(e => e.time);

  ASSETS.forEach(asset => {
    const values = json.map(entry => {
      if(entry.financial){ const item = entry.financial.find(i=>i.key===asset.key); if(item) return Number(item.price || 0); }
      if(entry.pamp && entry.pamp.items){ const pampItem = entry.pamp.items.find(i=>i.weightGram===asset.key); if(pampItem) return Number(pampItem.price || 0); }
      return 0;
    });

    createChart(asset.id, labels, values, asset.label, asset.color);
    const clean = values.filter(v => v>0);
    if (!clean.length) return;

    const first = clean[0], last = clean[clean.length-1], min = Math.min(...clean), max = Math.max(...clean);
    
    const priceEl = document.getElementById(`price-${asset.id}`);
    const changeEl = document.getElementById(`change-${asset.id}`);
    const lowEl = document.getElementById(`low-${asset.id}`);
    const highEl = document.getElementById(`high-${asset.id}`);

    if(priceEl) priceEl.textContent = last.toLocaleString();
    if(lowEl) lowEl.textContent = min.toLocaleString();
    if(highEl) highEl.textContent = max.toLocaleString();

    const change = first > 0 ? ((last - first) / first) * 100 : 0;
    if(changeEl) {
      changeEl.textContent = `${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}%`;
      changeEl.className = `price-change ${change >= 0 ? 'up' : 'down'}`;
    }
  });
  
  showLoading(false);
}

async function loadMonthlyData(dates) {
  showLoading(true);
  grid.innerHTML = "";
  ASSETS.forEach(createCard);

  const promises = dates.map(d => fetch(`data/${d}.json`).then(r => r.ok ? r.json() : null));
  const allData = await Promise.all(promises);

  const labels = [];
  const dailySnapshots = [];

  for(let i = dates.length - 1; i >= 0; i--) {
    const dayData = allData[i];
    if(dayData && dayData.length > 0) {
      const lastEntry = dayData[dayData.length - 1];
      labels.push(toJalaliShort(dates[i]));
      dailySnapshots.push(lastEntry);
    }
  }

  ASSETS.forEach(asset => {
    const values = dailySnapshots.map(entry => {
      if(entry.financial){ const item = entry.financial.find(i=>i.key===asset.key); if(item) return Number(item.price || 0); }
      if(entry.pamp && entry.pamp.items){ const pampItem = entry.pamp.items.find(i=>i.weightGram===asset.key); if(pampItem) return Number(pampItem.price || 0); }
      return 0;
    });

    createChart(asset.id, labels, values, asset.label, asset.color);
    const clean = values.filter(v => v>0);
    if (!clean.length) return;

    const first = clean[0], last = clean[clean.length-1], min = Math.min(...clean), max = Math.max(...clean);
    
    const priceEl = document.getElementById(`price-${asset.id}`);
    const changeEl = document.getElementById(`change-${asset.id}`);
    const lowEl = document.getElementById(`low-${asset.id}`);
    const highEl = document.getElementById(`high-${asset.id}`);

    if(priceEl) priceEl.textContent = last.toLocaleString();
    if(lowEl) lowEl.textContent = min.toLocaleString();
    if(highEl) highEl.textContent = max.toLocaleString();

    const change = first > 0 ? ((last - first) / first) * 100 : 0;
    if(changeEl) {
      changeEl.textContent = `${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)}%`;
      changeEl.className = `price-change ${change >= 0 ? 'up' : 'down'}`;
    }
  });

  showLoading(false);
}

// --- Navigation Logic ---
async function loadAvailableDates() {
  const res = await fetch("data/dates.json",{cache:"no-store"});
  allDates = res.ok ? await res.json() : [];
  
  const monthMap = {};
  allDates.forEach(d => {
    const key = getJalaliMonthKey(d);
    if(!monthMap[key]) monthMap[key] = { key, label: getJalaliMonthLabel(d), dates: [] };
    monthMap[key].dates.push(d);
  });
  allMonths = Object.values(monthMap).sort((a,b) => b.key.localeCompare(a.key));
  
  renderDateMenu();
  
  if(allDates.length) {
    if(currentView === 'daily') {
      dateBtn.textContent = `📅 ${toJalali(allDates[0])}`;
      loadData(allDates[0]);
    } else {
      dateBtn.textContent = `📅 ${allMonths[0].label}`;
      loadMonthlyData(allMonths[0].dates);
    }
  }
}

function renderDateMenu() {
  dateMenu.innerHTML = "";
  const items = currentView === 'daily' ? allDates : allMonths;
  
  items.forEach(item => {
    const div = document.createElement("div");
    if(currentView === 'daily') {
      div.textContent = toJalali(item);
      div.onclick = () => { 
        dateBtn.textContent = `📅 ${toJalali(item)}`; 
        dateMenu.classList.remove("show"); 
        loadData(item); 
      };
    } else {
      div.textContent = item.label;
      div.onclick = () => {
        dateBtn.textContent = `📅 ${item.label}`;
        dateMenu.classList.remove("show");
        loadMonthlyData(item.dates);
      };
    }
    dateMenu.appendChild(div);
  });
}

document.getElementById('viewToggle').addEventListener('click', e => {
  if(e.target.tagName === 'BUTTON') {
    document.querySelector('.view-toggle .active').classList.remove('active');
    e.target.classList.add('active');
    currentView = e.target.dataset.view;
    renderDateMenu();
    
    if(currentView === 'daily' && allDates.length) {
      dateBtn.textContent = `📅 ${toJalali(allDates[0])}`;
      loadData(allDates[0]);
    } else if(currentView === 'monthly' && allMonths.length) {
      dateBtn.textContent = `📅 ${allMonths[0].label}`;
      loadMonthlyData(allMonths[0].dates);
    }
  }
});

dateBtn.onclick = () => dateMenu.classList.toggle("show");
document.addEventListener("click", e => { if(!e.target.closest(".date-dropdown")) dateMenu.classList.remove("show"); });

loadAvailableDates();
</script>

</body>
</html>
