<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr" data-style="flat">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
    }

    [dir="rtl"] { --font: 'Vazirmatn', 'Inter', system-ui, sans-serif; }

    /* Persian typography: no letter-spacing between digits/letters */
    html[dir="rtl"] * { letter-spacing: 0 !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      padding: 40px 28px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    /* ---------- Header ---------- */
    header {
      max-width: 1440px;
      margin: 0 auto 28px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-section { display: flex; align-items: center; gap: 12px; }

    .title-section h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em; }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      height: 40px;
    }

    .btn:hover { border-color: var(--muted); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    #dateBtn { padding: 0 14px; min-width: 220px; justify-content: flex-start; }
    #dateBtnText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #langBtn { width: 52px; font-weight: 700; }
    #themeBtn, #styleBtn { width: 40px; }

    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      width: 92px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .view-toggle button.active { background: var(--text); color: var(--bg); }

    .date-dropdown { position: relative; }

    .date-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 230px;
      max-height: 320px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    [dir="rtl"] .date-menu { right: auto; left: 0; }
    .date-menu.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .date-menu div {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.12s ease;
      color: var(--text);
    }

    .date-menu div:hover { background: var(--border); }
    .date-menu div:not(:last-child) { border-bottom: 1px solid var(--border); }

    .date-menu::-webkit-scrollbar { width: 8px; }
    .date-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      max-width: 1440px;
      margin: 0 auto 34px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }

    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0 14px;
      height: 34px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab:hover { border-color: var(--muted); color: var(--text); }
    .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tab svg { width: 12px; height: 12px; }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0 14px;
      height: 40px;
      min-width: 200px;
      outline: none;
      font: inherit;
      font-size: 0.875rem;
      transition: border-color 0.2s ease;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    .mode-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .mode-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      width: 110px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-toggle button svg { width: 14px; height: 14px; }
    .mode-toggle button.active { background: var(--text); color: var(--bg); }

    /* ---------- Icons ---------- */
    .asset-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .asset-icon-fallback {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    /* ---------- Charts Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      column-gap: 24px;
      row-gap: 64px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      height: 500px;
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s ease, background 0.3s ease;
    }

    .card.visible { opacity: 1; transform: translateY(0); }
    .card:hover { border-color: var(--muted); }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 18px;
    }

    .asset-info { min-width: 0; }

    .asset-title { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }

    .asset-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      padding: 2px;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      margin-inline-start: auto;
    }

    .fav-btn svg { width: 16px; height: 16px; }
    .fav-btn:hover { color: #eab308; }
    .fav-btn.active { color: #eab308; }
    .fav-btn.active svg { fill: currentColor; }

    .asset-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .asset-meta strong { color: var(--text); font-weight: 600; margin-left: 4px; }
    [dir="rtl"] .asset-meta strong { margin-left: 0; margin-right: 4px; }

    .range-bar {
      position: relative;
      width: 100%;
      max-width: 250px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      margin-top: 13px;
    }

    .range-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    .range-dot {
      position: absolute;
      top: 50%; left: 0%;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .price-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 0;
    }

    [dir="rtl"] .price-info { text-align: left; align-items: flex-start; }

    .price-current {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .price-change {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
      min-width: 76px;
      justify-content: center;
    }

    .price-change.up { color: var(--green); background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.18); }
    .price-change.down { color: var(--red); background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.18); }

    .chart-wrap { position: relative; flex: 1; min-height: 0; }
    .chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ---------- Heatmap ---------- */
    .heatmap {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .heatmap-tile {
      aspect-ratio: 1.2;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
      overflow: hidden;
    }

    .heatmap-tile:hover { border-color: var(--text); }

    .heatmap-tile.positive {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .heatmap-tile.negative {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .heatmap-tile.neutral { background: var(--card); border: 1px solid var(--border); }

    .heatmap-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      min-width: 0;
    }

    .heatmap-label .hl-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heatmap-label .asset-icon { width: 20px; height: 20px; }

    .heatmap-price { font-size: 0.95rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .heatmap-change { font-size: 0.8rem; font-weight: 700; }
    .heatmap-change.up { color: var(--green); }
    .heatmap-change.down { color: var(--red); }

    /* ---------- Table ---------- */
    .table-container {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .data-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .data-table thead { background: var(--bg); }

    .data-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    [dir="rtl"] .data-table th { text-align: right; }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .data-table tbody tr { transition: background 0.15s ease; }
    .data-table tbody tr:hover { background: var(--bg); }
    .data-table tbody tr:last-child td { border-bottom: none; }

    .table-asset { display: flex; align-items: center; gap: 10px; }
    .table-asset .asset-icon { width: 24px; height: 24px; }
    .table-asset-name { font-weight: 600; }

    .table-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .table-change.up { color: var(--green); background: rgba(34, 197, 94, 0.1); }
    .table-change.down { color: var(--red); background: rgba(239, 68, 68, 0.1); }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      max-width: 1440px;
      margin: 70px auto 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .loader {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 42px; height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 100;
    }

    .loader.show { display: block; }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ============================================================
       NEO-BRUTALISM STYLE
       ============================================================ */
    html[data-style="brutal"] {
      --bg: #F3E9D2;
      --card: #FBF3E0;
      --border: #141414;
      --text: #141414;
      --muted: #6E6552;
      --accent: #F07818;
      --accent-soft: rgba(240, 120, 24, 0.3);
      --green: #178A44;
      --red: #D23B2E;
      --radius: 14px;
    }

    html[data-style="brutal"][data-theme="dark"] {
      --bg: #171310;
      --card: #241E17;
      --border: #EFE3C8;
      --text: #F3E9D2;
      --muted: #A99C82;
      --accent: #F5C33B;
      --accent-soft: rgba(245, 195, 59, 0.3);
      --green: #4CC57A;
      --red: #F26D5E;
    }

    html[data-style="brutal"] body { font-family: 'Space Grotesk', 'Vazirmatn', system-ui, sans-serif; }
    html[data-style="brutal"][dir="rtl"] body { font-family: 'Vazirmatn', 'Space Grotesk', system-ui, sans-serif; }

    html[data-style="brutal"] h1,
    html[data-style="brutal"] .card h2,
    html[data-style="brutal"] .price-current,
    html[data-style="brutal"] .heatmap-label {
      font-family: 'Archivo Black', 'Vazirmatn', sans-serif;
      letter-spacing: 0;
    }

    html[data-style="brutal"] .btn,
    html[data-style="brutal"] .view-toggle,
    html[data-style="brutal"] .mode-toggle,
    html[data-style="brutal"] .tab,
    html[data-style="brutal"] .card,
    html[data-style="brutal"] .date-menu,
    html[data-style="brutal"] .search-input,
    html[data-style="brutal"] .table-container,
    html[data-style="brutal"] .heatmap-tile,
    html[data-style="brutal"] .empty-state {
      border: 3px solid var(--border);
    }

    html[data-style="brutal"] .btn,
    html[data-style="brutal"] .tab,
    html[data-style="brutal"] .view-toggle button,
    html[data-style="brutal"] .mode-toggle button { font-weight: 700; }

    html[data-style="brutal"] .btn svg,
    html[data-style="brutal"] .mode-toggle button svg { stroke-width: 2.75; }

    html[data-style="brutal"] .view-toggle button.active,
    html[data-style="brutal"] .mode-toggle button.active {
      background: var(--accent);
      color: #141414;
    }

    html[data-style="brutal"] .tab.active {
      background: #141414;
      color: #F3E9D2;
      border-color: #141414;
    }

    html[data-style="brutal"][data-theme="dark"] .tab.active {
      background: #F3E9D2;
      color: #141414;
      border-color: #F3E9D2;
    }

    /* Colored cards (light brutal) */
    html[data-style="brutal"] .card:nth-child(5n+1) { background: #F6A9C9; }
    html[data-style="brutal"] .card:nth-child(5n+2) { background: #F5C33B; }
    html[data-style="brutal"] .card:nth-child(5n+3) { background: #7FB8A8; }
    html[data-style="brutal"] .card:nth-child(5n+4) { background: #F0964B; }
    html[data-style="brutal"] .card:nth-child(5n+5) { background: #8FA8D8; }

    /* Colored borders (dark brutal) */
    html[data-style="brutal"][data-theme="dark"] .card { background: var(--card); }
    html[data-style="brutal"][data-theme="dark"] .card:nth-child(5n+1) { border-color: #F6A9C9; }
    html[data-style="brutal"][data-theme="dark"] .card:nth-child(5n+2) { border-color: #F5C33B; }
    html[data-style="brutal"][data-theme="dark"] .card:nth-child(5n+3) { border-color: #7FB8A8; }
    html[data-style="brutal"][data-theme="dark"] .card:nth-child(5n+4) { border-color: #F0964B; }
    html[data-style="brutal"][data-theme="dark"] .card:nth-child(5n+5) { border-color: #8FA8D8; }

    /* Contrast fixes on colored cards */
    html[data-style="brutal"] .asset-meta { color: rgba(20, 20, 20, 0.66); }
    html[data-style="brutal"] .asset-meta strong { color: #141414; }
    html[data-style="brutal"] .price-change { background: #FBF3E0; border: 2px solid #141414; }
    html[data-style="brutal"] .price-change.up { color: #178A44; }
    html[data-style="brutal"] .price-change.down { color: #D23B2E; }
    html[data-style="brutal"] .range-bar { background: rgba(20, 20, 20, 0.25); }
    html[data-style="brutal"] .range-fill { background: rgba(20, 20, 20, 0.35); }
    html[data-style="brutal"] .range-dot { background: #141414; }

    /* Favorite star: solid black on colored cards (cream in dark) */
    html[data-style="brutal"] .fav-btn,
    html[data-style="brutal"] .fav-btn:hover,
    html[data-style="brutal"] .fav-btn.active { color: #141414; }

    html[data-style="brutal"][data-theme="dark"] .fav-btn,
    html[data-style="brutal"][data-theme="dark"] .fav-btn:hover,
    html[data-style="brutal"][data-theme="dark"] .fav-btn.active { color: #F3E9D2; }

    html[data-style="brutal"][data-theme="dark"] .asset-meta { color: rgba(243, 233, 210, 0.66); }
    html[data-style="brutal"][data-theme="dark"] .asset-meta strong { color: #F3E9D2; }
    html[data-style="brutal"][data-theme="dark"] .price-change { background: #241E17; border-color: #EFE3C8; }
    html[data-style="brutal"][data-theme="dark"] .range-bar { background: rgba(243, 233, 210, 0.25); }
    html[data-style="brutal"][data-theme="dark"] .range-fill { background: rgba(243, 233, 210, 0.35); }
    html[data-style="brutal"][data-theme="dark"] .range-dot { background: #F3E9D2; }

    /* Icons as stickers in brutal */
    html[data-style="brutal"] .asset-icon {
      background: #FBF3E0;
      border: 2px solid #141414;
      border-radius: 8px;
      padding: 3px;
    }

    html[data-style="brutal"][data-theme="dark"] .asset-icon {
      background: #241E17;
      border-color: #EFE3C8;
    }

    html[data-style="brutal"] .heatmap-tile.positive { background: #8FD694; border-color: #141414; }
    html[data-style="brutal"] .heatmap-tile.negative { background: #F08A7E; border-color: #141414; }
    html[data-style="brutal"] .heatmap-tile.neutral { background: var(--card); }
    html[data-style="brutal"] .heatmap-change.up { color: #0E5B2A; }
    html[data-style="brutal"] .heatmap-change.down { color: #7E1F16; }
    html[data-style="brutal"][data-theme="dark"] .heatmap-tile.positive { background: rgba(76, 197, 122, 0.2); }
    html[data-style="brutal"][data-theme="dark"] .heatmap-tile.negative { background: rgba(242, 109, 94, 0.2); }
    html[data-style="brutal"][data-theme="dark"] .heatmap-change.up { color: var(--green); }
    html[data-style="brutal"][data-theme="dark"] .heatmap-change.down { color: var(--red); }

    html[data-style="brutal"] .data-table thead { background: var(--accent); }
    html[data-style="brutal"] .data-table th { color: #141414; border-color: var(--border); }
    html[data-style="brutal"] .data-table td { border-color: var(--border); }
    html[data-style="brutal"] .data-table tbody tr:hover { background: rgba(20, 20, 20, 0.06); }
    html[data-style="brutal"][data-theme="dark"] .data-table th { color: #141414; }
    html[data-style="brutal"][data-theme="dark"] .data-table tbody tr:hover { background: rgba(243, 233, 210, 0.06); }

    html[data-style="brutal"] .date-menu div:hover { background: rgba(20, 20, 20, 0.08); }
    html[data-style="brutal"][data-theme="dark"] .date-menu div:hover { background: rgba(243, 233, 210, 0.08); }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      body { padding: 22px 14px; }
      header { margin-bottom: 22px; }
      .toolbar { margin-bottom: 26px; }
      .search-input { width: 100%; }
      .grid { row-gap: 38px; }
      .card { height: 460px; padding: 18px; }
      .card-header { gap: 14px; }
      .heatmap { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .data-table { font-size: 0.75rem; }
      .data-table th, .data-table td { padding: 10px 8px; }
      #dateBtn { min-width: 170px; }
    }
  </style>
</head>
<body>

<header>
  <div class="title-section">
    <i data-feather="trending-up" style="width:24px;height:24px;color:var(--accent)"></i>
    <h1 data-i18n="title">Markets</h1>

  <div class="controls">

<div class="toolbar">

<section class="grid" id="chartGrid"></section>

<section class="table-container" id="tableContainer" style="display:none">
  <table class="data-table" id="dataTable">

    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</section>

<footer id="appFooter">Data updated via GitHub Actions</footer>

<div class="loader" id="loader"></div>

<script>
// ---------- Safe storage ----------
function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, val); } catch {}
}

// ---------- Translations ----------
const translations = {
  en: {
    title: "Markets", daily: "Daily", monthly: "Monthly", loading: "Loading...",
    all: "All", currencies: "Currencies", gold: "Gold", crypto: "Crypto", favorites: "Favorites",
    charts: "Charts", heatmap: "Heatmap", table: "Table", search: "Search assets...",
    asset: "Asset", now: "Now", low: "Low", high: "High", change: "Change",
    noData: "No data loaded.",
    noFavorites: "No favorite assets yet. Click the star on a card to add one.",
    noAssets: "No assets found.",
    lastUpdated: "Last updated", monthlyView: "Monthly view"
  },
  fa: {
    title: "بازارها", daily: "روزانه", monthly: "ماهانه", loading: "در حال بارگذاری...",
    all: "همه", currencies: "ارزها", gold: "طلا", crypto: "کریپتو", favorites: "علاقه‌مندی‌ها",
    charts: "نمودار", heatmap: "نقشه حرارتی", table: "جدول", search: "جستجوی دارایی‌ها...",
    asset: "دارایی", now: "اکنون", low: "کمترین", high: "بیشترین", change: "تغییر",
    noData: "داده‌ای بارگذاری نشده است.",
    noFavorites: "هنوز علاقه‌مندی ندارید. روی ستاره کارت کلیک کنید.",
    noAssets: "دارایی یافت نشد.",
    lastUpdated: "آخرین به‌روزرسانی", monthlyView: "نمای ماهانه"
  }
};

let currentLang = storageGet("lang") || "en";

function t(key) {
  return translations[currentLang]?.[key] || translations.en[key] || key;
}

function numLocale() {
  return currentLang === "fa" ? "fa-IR" : "en-US";
}

// ---------- Jalali date formatters ----------
let jalaliFullFormatter, jalaliShortFormatter, jalaliMonthFormatter;
const jalaliMonthKeyFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric", month: "numeric"
});

function buildDateFormatters() {
  const locale = currentLang === "fa" ? "fa-IR-u-ca-persian" : "en-US-u-ca-persian-nu-latn";
  jalaliFullFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long", day: "numeric" });
  jalaliShortFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "2-digit", day: "2-digit" });
  jalaliMonthFormatter = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long" });
}

function parseDate(dateStr) { return new Date(`${dateStr}T12:00:00Z`); }
function toJalali(dateStr) { return jalaliFullFormatter.format(parseDate(dateStr)); }
function toJalaliShort(dateStr) { return jalaliShortFormatter.format(parseDate(dateStr)); }
function getJalaliMonthLabel(dateStr) { return jalaliMonthFormatter.format(parseDate(dateStr)); }

function getJalaliMonthKey(dateStr) {
  const parts = jalaliMonthKeyFormatter.formatToParts(parseDate(dateStr));
  const year = parts.find(p => p.type === "year")?.value || "0000";
  const month = parts.find(p => p.type === "month")?.value || "00";
  return `${year}-${month.padStart(2, "0")}`;
}

// ---------- Assets ----------
const ASSETS = [
  { id: "usd", key: "usd", label: "USD", color: "#3b82f6", category: "currency" },
  { id: "eur", key: "eur", label: "EUR", color: "#a855f7", category: "currency" },
  { id: "gbp", key: "gbp", label: "GBP", color: "#8b5cf6", category: "currency" },
  { id: "rob", key: "rob", label: "Roub", color: "#ec4899", category: "currency" },
  { id: "try", key: "try", label: "TRY", color: "#ef4444", category: "currency" },
  { id: "aed", key: "aed", label: "AED", color: "#10b981", category: "currency" },
  { id: "sekkeh", key: "sekkeh", label: "Sekkeh", color: "#eab308", category: "gold" },
  { id: "gold", key: "18ayar", label: "Gold 18k", color: "#f59e0b", category: "gold" },
  { id: "btc", key: "usd_btc", label: "Bitcoin", color: "#f97316", category: "crypto" },
  { id: "usdt", key: "usd_usdt", label: "Tether", color: "#22c55e", category: "crypto" },
  { id: "pamp1", key: 1, label: "PAMP 1g", color: "#eab308", category: "pamp" },
  { id: "pamp2_5", key: 2.5, label: "PAMP 2.5g", color: "#eab308", category: "pamp" },
  { id: "pamp5", key: 5, label: "PAMP 5g", color: "#f97316", category: "pamp" },
  { id: "pamp10", key: 10, label: "PAMP 10g", color: "#f97316", category: "pamp" },
  { id: "pamp15", key: 15.55175, label: "PAMP 15.55g", color: "#ef4444", category: "pamp" },
  { id: "pamp20", key: 20, label: "PAMP 20g", color: "#ef4444", category: "pamp" },
  { id: "pamp31_1", key: 31.1035, label: "PAMP 1oz", color: "#ec4899", category: "pamp" },
  { id: "pamp50", key: 50, label: "PAMP 50g", color: "#8b5cf6", category: "pamp" },
  { id: "pamp100", key: 100, label: "PAMP 100g", color: "#a855f7", category: "pamp" }
];

// Hardcoded icon fallbacks (from API samples)
const ICON_FALLBACKS = {
  usd: "https://liara-s3.dastyar.io/Img/icons/finance/dollar.svg",
  eur: "https://liara-s3.dastyar.io/Img/icons/finance/euro.svg",
  gbp: "https://liara-s3.dastyar.io/Img/icons/finance/pound.svg",
  aed: "https://liara-s3.dastyar.io/Img/icons/finance/aed.svg",
  try: "https://liara-s3.dastyar.io/Img/icons/finance/tl.svg",
  pamp1: "https://zcoinn.com/wp-content/uploads/2022/08/1g-blue-copy.webp",
  pamp2_5: "https://zcoinn.com/wp-content/uploads/2022/08/2.5-blue-copy.webp",
  pamp5: "https://zcoinn.com/wp-content/uploads/2022/08/5g-blue-copy.webp",
  pamp10: "https://zcoinn.com/wp-content/uploads/2022/08/1.2oz-blue-copy.webp",
  pamp15: "https://zcoinn.com/wp-content/uploads/2022/08/10g-blue-copy.webp",
  pamp20: "https://zcoinn.com/wp-content/uploads/2022/08/20g-blue-copy.webp",
  pamp31_1: "https://zcoinn.com/wp-content/uploads/2022/12/1oz-blue-copy.webp",
  pamp50: "https://zcoinn.com/wp-content/uploads/2022/08/50blue.png",
  pamp100: "https://zcoinn.com/wp-content/uploads/2022/08/50blue.png"
};

// Live meta (icon + fa title), filled from APIs and/or stored data
const assetMeta = {};

function mergeFinMeta(item) {
  const asset = ASSETS.find(a => String(a.key) === String(item.key));
  if (asset && (item.icon || item.image)) {
    assetMeta[asset.id] = { icon: item.icon || item.image, faTitle: item.title || "" };
  }
}

function mergePampMeta(item) {
  const asset = ASSETS.find(a => Number(a.key) === Number(item.weightGram));
  if (asset && item.image) {
    assetMeta[asset.id] = { icon: item.image, faTitle: item.name || "" };
  }
}

function extractMetaFromEntry(entry) {
  if (!entry) return;
  const fin = Array.isArray(entry.financial) ? entry.financial : (Array.isArray(entry.data) ? entry.data : null);
  if (fin) fin.forEach(mergeFinMeta);
  if (entry.pamp && Array.isArray(entry.pamp.items)) entry.pamp.items.forEach(mergePampMeta);
}

async function loadAssetMetaFromAPI() {
  try {
    const [fin, pamp] = await Promise.allSettled([
      fetch("https://api.dastyar.io/express/financial-item").then(r => r.json()),
      fetch("https://amirmasoud.netlify.app/api/v1/pamp").then(r => r.json())
    ]);
    if (fin.status === "fulfilled" && Array.isArray(fin.value)) fin.value.forEach(mergeFinMeta);
    if (pamp.status === "fulfilled" && pamp.value && Array.isArray(pamp.value.items)) pamp.value.items.forEach(mergePampMeta);
  } catch {}
  if (currentEntries.length) renderDashboard();
}

function getAssetIcon(asset) {
  return assetMeta[asset.id]?.icon || ICON_FALLBACKS[asset.id] || null;
}

function assetLabel(asset) {
  if (currentLang === "fa") {
    if (asset.category === "pamp") {
      return asset.key === 31.1035 ? "پمپ ۱ اونسی" : `پمپ ${asset.key} گرمی`;
    }
    const fa = assetMeta[asset.id]?.faTitle;
    if (fa) return fa;
  }
  return asset.label;
}

function iconHtml(asset) {
  const src = getAssetIcon(asset);
  const dot = `<span class="asset-icon-fallback" style="background:${asset.color};display:${src ? "none" : "inline-block"}"></span>`;
  if (!src) return dot;
  return `<img class="asset-icon" src="${src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';">${dot}`;
}

// ---------- Elements ----------
const charts = {};
const dataCache = new Map();
let assetStats = {};

const grid = document.getElementById("chartGrid");
const heatmapGrid = document.getElementById("heatmapGrid");
const tableContainer = document.getElementById("tableContainer");
const tableBody = document.getElementById("tableBody");
const dateBtn = document.getElementById("dateBtn");
const dateBtnText = document.getElementById("dateBtnText");
const dateMenu = document.getElementById("dateMenu");
const loader = document.getElementById("loader");
const appFooter = document.getElementById("appFooter");
const categoryTabs = document.getElementById("categoryTabs");
const assetSearch = document.getElementById("assetSearch");
const viewToggle = document.getElementById("viewToggle");
const modeToggle = document.getElementById("modeToggle");
const themeBtn = document.getElementById("themeBtn");
const langBtn = document.getElementById("langBtn");
const styleBtn = document.getElementById("styleBtn");

// ---------- State ----------
let currentView = "daily";
let currentMode = "charts";
let activeCategory = "all";
let searchQuery = "";
let allDates = [];
let allMonths = [];
let currentEntries = [];
let currentLabels = [];
let displayLabels = [];
let displayIndices = [];
let selectedDate = null;
let selectedMonthKey = null;
let lastFooter = null;

let favorites = [];
try { favorites = JSON.parse(storageGet("favorites") || "[]"); } catch { favorites = []; }

let currentTheme = storageGet("theme");
if (!currentTheme) {
  currentTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
let currentStyle = storageGet("style") || "flat";

const URL_DEFAULTS = { view: "daily", mode: "charts", category: "all", lang: "en", style: "flat" };

// ---------- URL state ----------
function parseURLState() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("view")) currentView = params.get("view");
  if (params.has("mode")) currentMode = params.get("mode");
  if (params.has("category")) activeCategory = params.get("category");
  if (params.has("lang")) currentLang = params.get("lang");
  if (params.has("style")) currentStyle = params.get("style");
  if (params.has("q")) searchQuery = params.get("q");
}

function updateURLState() {
  const params = new URLSearchParams();
  if (currentView !== URL_DEFAULTS.view) params.set("view", currentView);
  if (currentMode !== URL_DEFAULTS.mode) params.set("mode", currentMode);
  if (activeCategory !== URL_DEFAULTS.category) params.set("category", activeCategory);
  if (currentLang !== URL_DEFAULTS.lang) params.set("lang", currentLang);
  if (currentStyle !== URL_DEFAULTS.style) params.set("style", currentStyle);
  if (searchQuery) params.set("q", searchQuery);

  const qs = params.toString();
  window.history.replaceState({}, "", window.location.pathname + (qs ? `?${qs}` : ""));
}

// ---------- Utils ----------
function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function fmt(value) {
  const n = Number(value);
  if (value == null || !Number.isFinite(n)) return "—";
  return n.toLocaleString(numLocale(), { maximumFractionDigits: 2 });
}

function showLoading(show) { loader.classList.toggle("show", show); }

// ---------- Theme & Style ----------
function getChartColors() {
  const style = document.documentElement.getAttribute("data-style");
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";

  if (style === "brutal") {
    const brutalFont = "'Space Grotesk','Vazirmatn',sans-serif";
    if (isDark) {
      return {
        text: "#F3E9D2", grid: "rgba(243,233,210,0.16)",
        casing: null, fill: true, fontFamily: brutalFont,
        tooltipBg: "#241E17", tooltipText: "#F3E9D2", tooltipBorder: "#EFE3C8"
      };
    }
    return {
      text: "#141414", grid: "rgba(20,20,20,0.22)",
      casing: "#141414", fill: false, fontFamily: brutalFont,
      tooltipBg: "#FBF3E0", tooltipText: "#141414", tooltipBorder: "#141414"
    };
  }

  const flatFont = "'Inter','Vazirmatn',sans-serif";
  return isDark ? {
    text: "#a1a1aa", grid: "rgba(255,255,255,0.06)",
    casing: null, fill: true, fontFamily: flatFont,
    tooltipBg: "#18181b", tooltipText: "#fafafa", tooltipBorder: "#27272a"
  } : {
    text: "#71717a", grid: "rgba(0,0,0,0.06)",
    casing: null, fill: true, fontFamily: flatFont,
    tooltipBg: "#ffffff", tooltipText: "#18181b", tooltipBorder: "#e4e4e7"
  };
}

function applyTheme(theme) {
  currentTheme = theme;
  storageSet("theme", theme);
  document.documentElement.setAttribute("data-theme", theme);
  themeBtn.innerHTML = theme === "dark" ? '<i data-feather="moon"></i>' : '<i data-feather="sun"></i>';
  feather.replace();
  renderDashboard();
}

function applyStyle(style) {
  currentStyle = style;
  storageSet("style", style);
  document.documentElement.setAttribute("data-style", style);
  renderDashboard();
  updateURLState();
}

// ---------- Language ----------
function applyLanguage(lang) {
  currentLang = lang;
  storageSet("lang", lang);

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

  buildDateFormatters();

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });

  langBtn.textContent = lang === "en" ? "EN" : "فا";

  rebuildMonths();
  renderDateMenu();
  refreshDateLabel();
  renderFooter();
  renderDashboard();
}

function refreshDateLabel() {
  if (currentView === "daily") {
    dateBtnText.textContent = selectedDate ? toJalali(selectedDate) : t("loading");
  } else {
    const month = allMonths.find(m => m.key === selectedMonthKey);
    dateBtnText.textContent = month ? month.label : t("loading");
  }
}

function renderFooter() {
  if (!lastFooter) {
    appFooter.textContent = "Data updated via GitHub Actions";
    return;
  }
  const prefix = lastFooter.view === "daily" ? t("lastUpdated") : t("monthlyView");
  appFooter.textContent = `${prefix}: ${toJalali(lastFooter.dateStr)} — ${lastFooter.time}`;
}

// ---------- Favorites ----------
function toggleFavorite(id) {
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  storageSet("favorites", JSON.stringify(favorites));
}

// ---------- Filtering ----------
function getVisibleAssets() {
  const q = searchQuery;
  return ASSETS.filter(asset => {
    const matchesCategory =
      activeCategory === "all" ||
      (activeCategory === "favorites" ? favorites.includes(asset.id) : asset.category === activeCategory);

    if (!matchesCategory) return false;
    if (!q) return true;

    const en = asset.label.toLowerCase();
    const fa = (assetMeta[asset.id]?.faTitle || "").toLowerCase();
    const faPamp = asset.category === "pamp" ? assetLabel(asset) : "";
    return en.includes(q) || fa.includes(q) || faPamp.includes(q);
  });
}

// ---------- Data ----------
async function fetchDay(date) {
  const latestDate = allDates[0];
  const shouldCache = date !== latestDate;
  if (shouldCache && dataCache.has(date)) return dataCache.get(date);

  const res = await fetch(`data/${date}.json`);
  const json = res.ok ? await res.json() : null;
  if (shouldCache && json) dataCache.set(date, json);
  return json;
}

function computeDisplayIndices(length, maxPoints) {
  maxPoints = Math.max(2, maxPoints);
  if (!length) { displayIndices = []; displayLabels = []; return; }
  if (length <= maxPoints) {
    displayIndices = Array.from({ length }, (_, i) => i);
  } else {
    displayIndices = Array.from({ length: maxPoints }, (_, i) =>
      Math.round(i * (length - 1) / (maxPoints - 1)));
  }
  displayLabels = displayIndices.map(i => currentLabels[i]);
}

function getAssetValues(asset, entries) {
  return entries.map(entry => {
    if (!entry) return null;
    let price = null;
    if (Array.isArray(entry.data)) {
      const item = entry.data.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }
    if (price == null && Array.isArray(entry.financial)) {
      const item = entry.financial.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }
    if (price == null && entry.pamp && Array.isArray(entry.pamp.items)) {
      const item = entry.pamp.items.find(i => Number(i.weightGram) === Number(asset.key));
      if (item) price = Number(item.price);
    }
    return Number.isFinite(price) && price > 0 ? price : null;
  });
}

// Change % = latest vs PREVIOUS point
// (daily: latest snapshot vs previous snapshot,
//  monthly: latest day's close vs previous day's close)
function calculateStats(values) {
  const clean = values.filter(v => v != null && v > 0);
  if (!clean.length) return null;

  const open = clean[0];
  const close = clean[clean.length - 1];
  const prev = clean.length > 1 ? clean[clean.length - 2] : open;
  const low = Math.min(...clean);
  const high = Math.max(...clean);
  const change = prev > 0 ? ((close - prev) / prev) * 100 : 0;

  return { open, prev, close, low, high, change };
}

async function loadData(date) {
  showLoading(true);
  const json = await fetchDay(date);
  const entries = Array.isArray(json) ? json : [];

  selectedDate = date;
  selectedMonthKey = null;
  currentEntries = entries;
  currentLabels = entries.map(e => e.time || "");
  computeDisplayIndices(currentLabels.length, 240);

  extractMetaFromEntry(entries[entries.length - 1]);
  refreshDateLabel();
  renderDashboard();

  const lastEntry = entries[entries.length - 1];
  if (lastEntry) {
    lastFooter = { view: "daily", dateStr: date, time: lastEntry.time };
    renderFooter();
  }
  showLoading(false);
}

async function loadMonthlyData(dates, monthKey) {
  showLoading(true);
  const allData = await Promise.all(dates.map(d => fetchDay(d)));

  const labels = [];
  const entries = [];
  for (let i = dates.length - 1; i >= 0; i--) {
    const dayData = allData[i];
    if (Array.isArray(dayData) && dayData.length > 0) {
      labels.push(toJalaliShort(dates[i]));
      entries.push(dayData[dayData.length - 1]);
    }
  }

  selectedMonthKey = monthKey;
  selectedDate = null;
  currentLabels = labels;
  currentEntries = entries;
  computeDisplayIndices(currentLabels.length, 120);

  extractMetaFromEntry(entries[entries.length - 1]);
  refreshDateLabel();
  renderDashboard();

  if (dates.length && entries.length) {
    const lastEntry = entries[entries.length - 1];
    lastFooter = { view: "monthly", dateStr: dates[0], time: lastEntry.time || "" };
    renderFooter();
  }
  showLoading(false);
}

// ---------- Rendering ----------
function destroyCharts() {
  Object.keys(charts).forEach(id => {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  });
}

function createCard(asset) {
  const isFav = favorites.includes(asset.id);
  const label = assetLabel(asset);
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.assetId = asset.id;

  div.innerHTML = `
    <div class="card-header">
      <div class="asset-info">
        <div class="asset-title">
          ${iconHtml(asset)}
          <h2 title="${label}">${label}</h2>
          <button type="button" class="fav-btn ${isFav ? "active" : ""}" data-fav="${asset.id}" title="Favorite">
            <i data-feather="star"></i>
          </button>
        </div>
        <div class="asset-meta">
          <span>${t("now")} <strong id="now-${asset.id}">—</strong></span>
          <span>${t("low")} <strong id="low-${asset.id}">—</strong></span>
          <span>${t("high")} <strong id="high-${asset.id}">—</strong></span>
        </div>
        <div class="range-bar">
          <div class="range-fill" id="range-fill-${asset.id}"></div>
          <div class="range-dot" id="range-dot-${asset.id}"></div>
        </div>
      </div>
      <div class="price-info">
        <div class="price-current" id="price-${asset.id}">—</div>
        <div class="price-change" id="change-${asset.id}">—</div>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="${asset.id}"></canvas>
    </div>
  `;

  grid.appendChild(div);
  requestAnimationFrame(() => div.classList.add("visible"));
}

function createChart(canvasId, labels, data, label, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (charts[canvasId]) charts[canvasId].destroy();

  const colors = getChartColors();

  let lastValidIndex = -1;
  for (let i = data.length - 1; i >= 0; i--) {
    if (data[i] != null && data[i] > 0) { lastValidIndex = i; break; }
  }

  const datasets = [];

  // Black "casing" underlay for brutal light mode (contrast on colored cards)
  if (colors.casing) {
    datasets.push({
      label, data,
      borderColor: colors.casing,
      borderWidth: 6,
      tension: 0.35,
      spanGaps: true,
      fill: false,
      pointRadius: 0,
      pointHoverRadius: 0
    });
  }

  datasets.push({
    label, data,
    borderColor: color,
    borderWidth: colors.casing ? 3 : 2,
    fill: colors.fill,
    tension: 0.35,
    spanGaps: true,
    backgroundColor: colors.fill ? (ctx => {
      const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 300);
      g.addColorStop(0, color + "33");
      g.addColorStop(1, "transparent");
      return g;
    }) : "transparent",
    pointRadius: ctx => ctx.dataIndex === lastValidIndex ? 4.5 : 0,
    pointHoverRadius: 6,
    pointBackgroundColor: color,
    pointBorderColor: colors.casing || color,
    pointBorderWidth: colors.casing ? 2 : 0
  });

  const mainIndex = datasets.length - 1;

  charts[canvasId] = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      resizeDelay: 120,
      animation: { duration: 300, easing: "easeOutQuart" },
      interaction: { intersect: false, mode: "index" },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: colors.tooltipBg,
          titleColor: colors.tooltipText,
          bodyColor: colors.tooltipText,
          borderColor: colors.tooltipBorder,
          borderWidth: 1,
          padding: 12,
          displayColors: false,
          filter: item => item.datasetIndex === mainIndex,
          callbacks: {
            title: items => items.length ? items[0].label : "",
            label: ctx => ctx.parsed.y == null ? "No data" : fmt(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: colors.text, maxRotation: 0, autoSkipPadding: 18, maxTicksLimit: 8,
            font: { family: colors.fontFamily, weight: 600 }
          },
          grid: { color: colors.grid }
        },
        y: {
          beginAtZero: false,
          grace: "10%",
          ticks: {
            color: colors.text, maxTicksLimit: 6,
            font: { family: colors.fontFamily, weight: 600 },
            callback: v => Number(v).toLocaleString(numLocale())
          },
          grid: { color: colors.grid }
        }
      }
    }
  });
}

function updateAssetStats(assetId, values) {
  const stats = calculateStats(values);
  assetStats[assetId] = stats;

  const priceEl = document.getElementById(`price-${assetId}`);
  const changeEl = document.getElementById(`change-${assetId}`);
  const nowEl = document.getElementById(`now-${assetId}`);
  const lowEl = document.getElementById(`low-${assetId}`);
  const highEl = document.getElementById(`high-${assetId}`);
  const fillEl = document.getElementById(`range-fill-${assetId}`);
  const dotEl = document.getElementById(`range-dot-${assetId}`);

  if (!priceEl || !changeEl || !nowEl || !lowEl || !highEl || !fillEl || !dotEl) return;

  if (!stats) {
    priceEl.textContent = "—";
    changeEl.textContent = "—";
    changeEl.className = "price-change";
    nowEl.textContent = "—";
    lowEl.textContent = "—";
    highEl.textContent = "—";
    fillEl.style.width = "0%";
    dotEl.style.left = "0%";
    return;
  }

  priceEl.textContent = fmt(stats.close);
  nowEl.textContent = fmt(stats.close);
  lowEl.textContent = fmt(stats.low);
  highEl.textContent = fmt(stats.high);

  changeEl.textContent = `${stats.change >= 0 ? "▲" : "▼"} ${Math.abs(stats.change).toFixed(2)}%`;
  changeEl.className = `price-change ${stats.change >= 0 ? "up" : "down"}`;

  const pos = stats.high > stats.low ? ((stats.close - stats.low) / (stats.high - stats.low)) * 100 : 0;
  fillEl.style.width = `${pos}%`;
  dotEl.style.left = `${pos}%`;
}

function renderCharts() {
  destroyCharts();
  grid.innerHTML = "";
  grid.style.display = "";
  heatmapGrid.style.display = "none";
  tableContainer.style.display = "none";

  if (!currentEntries.length) {
    grid.innerHTML = `<div class="empty-state">${t("noData")}</div>`;
    return;
  }

  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    grid.innerHTML = `<div class="empty-state">${
      activeCategory === "favorites" ? t("noFavorites") : t("noAssets")
    }</div>`;
    return;
  }

  visibleAssets.forEach(asset => {
    createCard(asset);
    const fullValues = getAssetValues(asset, currentEntries);
    const chartValues = displayIndices.map(i => fullValues[i] ?? null);
    createChart(asset.id, displayLabels, chartValues, asset.label, asset.color);
    updateAssetStats(asset.id, fullValues);
  });

  feather.replace();
}

function renderHeatmap() {
  grid.style.display = "none";
  tableContainer.style.display = "none";
  heatmapGrid.style.display = "";
  heatmapGrid.innerHTML = "";

  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    heatmapGrid.innerHTML = `<div class="empty-state">${t("noAssets")}</div>`;
    return;
  }

  visibleAssets.forEach(asset => {
    const stats = calculateStats(getAssetValues(asset, currentEntries));
    const label = assetLabel(asset);

    const tile = document.createElement("div");
    let tileClass = "heatmap-tile neutral";
    let changeClass = "";
    let changeText = "—";

    if (stats) {
      if (stats.change > 0) {
        tileClass = "heatmap-tile positive";
        changeClass = "heatmap-change up";
        changeText = `▲ ${stats.change.toFixed(2)}%`;
      } else if (stats.change < 0) {
        tileClass = "heatmap-tile negative";
        changeClass = "heatmap-change down";
        changeText = `▼ ${Math.abs(stats.change).toFixed(2)}%`;
      }
    }

    tile.className = tileClass;
    tile.innerHTML = `
      <div class="heatmap-label">${iconHtml(asset)}<span class="hl-text" title="${label}">${label}</span></div>
      <div>
        <div class="heatmap-price">${stats ? fmt(stats.close) : "—"}</div>
        <div class="${changeClass}">${changeText}</div>
      </div>
    `;
    heatmapGrid.appendChild(tile);
  });
}

function renderTable() {
  grid.style.display = "none";
  heatmapGrid.style.display = "none";
  tableContainer.style.display = "";
  tableBody.innerHTML = "";

  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px">${t("noAssets")}</td></tr>`;
    return;
  }

  visibleAssets.forEach(asset => {
    const stats = calculateStats(getAssetValues(asset, currentEntries));
    const label = assetLabel(asset);
    const tr = document.createElement("tr");

    let changeHTML = "—";
    if (stats) {
      const cls = stats.change >= 0 ? "up" : "down";
      const arrow = stats.change >= 0 ? "▲" : "▼";
      changeHTML = `<span class="table-change ${cls}">${arrow} ${Math.abs(stats.change).toFixed(2)}%</span>`;
    }

    tr.innerHTML = `
      <td>
        <div class="table-asset">
          ${iconHtml(asset)}
          <span class="table-asset-name">${label}</span>
        </div>
      </td>
      <td>${stats ? fmt(stats.close) : "—"}</td>
      <td>${stats ? fmt(stats.low) : "—"}</td>
      <td>${stats ? fmt(stats.high) : "—"}</td>
      <td>${changeHTML}</td>
    `;
    tableBody.appendChild(tr);
  });
}

function renderDashboard() {
  assetStats = {};
  if (currentMode === "charts") renderCharts();
  else if (currentMode === "heatmap") renderHeatmap();
  else if (currentMode === "table") renderTable();
  updateURLState();
}

// ---------- Dates ----------
function rebuildMonths() {
  const monthMap = {};
  allDates.forEach(d => {
    const key = getJalaliMonthKey(d);
    if (!monthMap[key]) monthMap[key] = { key, label: getJalaliMonthLabel(d), dates: [] };
    monthMap[key].dates.push(d);
  });
  allMonths = Object.values(monthMap).sort((a, b) => b.key.localeCompare(a.key));
}

function renderDateMenu() {
  dateMenu.innerHTML = "";
  const items = currentView === "daily" ? allDates : allMonths;

  if (!items.length) {
    const div = document.createElement("div");
    div.textContent = "No dates found";
    dateMenu.appendChild(div);
    return;
  }

  items.forEach(item => {
    const div = document.createElement("div");
    if (currentView === "daily") {
      div.textContent = toJalali(item);
      div.onclick = () => {
        dateMenu.classList.remove("show");
        loadData(item);
      };
    } else {
      div.textContent = item.label;
      div.onclick = () => {
        dateMenu.classList.remove("show");
        loadMonthlyData(item.dates, item.key);
      };
    }
    dateMenu.appendChild(div);
  });
}

async function loadAvailableDates() {
  const res = await fetch("data/dates.json", { cache: "no-store" });
  allDates = res.ok ? await res.json() : [];
  if (!Array.isArray(allDates)) allDates = [];

  rebuildMonths();
  renderDateMenu();

  if (!allDates.length) {
    dateBtnText.textContent = "No dates";
    return;
  }

  if (currentView === "daily") {
    loadData(allDates[0]);
  } else {
    loadMonthlyData(allMonths[0].dates, allMonths[0].key);
  }
}

// ---------- Events ----------
themeBtn.addEventListener("click", () => {
  applyTheme(currentTheme === "dark" ? "light" : "dark");
});

styleBtn.addEventListener("click", () => {
  applyStyle(currentStyle === "flat" ? "brutal" : "flat");
});

langBtn.addEventListener("click", () => {
  applyLanguage(currentLang === "en" ? "fa" : "en");
});

viewToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn || btn.classList.contains("active")) return;

  document.querySelector("#viewToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentView = btn.dataset.view;
  renderDateMenu();

  if (currentView === "daily" && allDates.length) {
    loadData(allDates[0]);
  }
  if (currentView === "monthly" && allMonths.length) {
    loadMonthlyData(allMonths[0].dates, allMonths[0].key);
  }
});

modeToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.classList.contains("active")) return;

  document.querySelector("#modeToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentMode = btn.dataset.mode;
  renderDashboard();
});

categoryTabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  activeCategory = btn.dataset.category;
  document.querySelectorAll("#categoryTabs .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.category === activeCategory);
  });
  renderDashboard();
});

assetSearch.addEventListener("input", debounce(() => {
  searchQuery = assetSearch.value.trim().toLowerCase();
  renderDashboard();
}, 200));

grid.addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn");
  if (!favBtn) return;

  const id = favBtn.dataset.fav;
  toggleFavorite(id);
  const isFav = favorites.includes(id);

  if (activeCategory === "favorites") {
    renderDashboard();
    return;
  }

  favBtn.classList.toggle("active", isFav);
});

dateBtn.onclick = () => dateMenu.classList.toggle("show");

document.addEventListener("click", e => {
  if (!e.target.closest(".date-dropdown")) dateMenu.classList.remove("show");
});

// ---------- Init ----------
parseURLState();
buildDateFormatters();
document.documentElement.setAttribute("data-style", currentStyle);
applyTheme(currentTheme);
applyLanguage(currentLang);

if (searchQuery) assetSearch.value = searchQuery;

document.querySelectorAll("#viewToggle button").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.view === currentView);
});
document.querySelectorAll("#modeToggle button").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.mode === currentMode);
});
document.querySelectorAll("#categoryTabs .tab").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.category === activeCategory);
});

feather.replace();
loadAssetMetaFromAPI();
loadAvailableDates();
</script>
