<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --border: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #020617, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
    }

    h1 { font-size: 1.6rem; margin: 0; }

    .date-dropdown {
      position: relative;
    }
    
    #dateBtn {
      background: #020617;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .date-menu {
      position: absolute;
      top: 110%;
      right: 0;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 180px;
      max-height: 260px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 20;
    }
    
    .date-menu.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    .date-menu div {
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .date-menu div:hover {
      background: #1e293b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: 24px;
      row-gap: 40px;
    }
    
    @media(max-width: 768px){
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      height: 500px;
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
      color: var(--text);
      flex-shrink: 0;
    }

    canvas { flex: 1; }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media(max-width:600px){
      .grid { grid-template-columns: 1fr; }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .price-badge {
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: #020617;
      border: 1px solid var(--border);
    }
    
    .price-up {
      color: #22c55e;
      border-color: rgba(34,197,94,0.4);
    }
    
    .price-down {
      color: #ef4444;
      border-color: rgba(239,68,68,0.4);
    }
    
    .last-dot {
      animation: pulse 1.8s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.6); }
      70% { box-shadow: 0 0 0 10px rgba(56,189,248,0); }
      100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); }
    }
  </style>
</head>
<body>

<header>
  <h1>📈 Financial Dashboard</h1>
  
  <div class="date-dropdown">
    <button id="dateBtn">📅 Select date</button>
    <div id="dateMenu" class="date-menu"></div>
  </div>
</header>

<section class="grid" id="chartGrid">
  <!-- Charts will be injected here -->
</section>

<footer>
  Data updated every 30 mins via GitHub Actions
</footer>

<script>
const ASSETS = [
  { id: "usd", key: "usd", label: "USD", color: "#38bdf8" },
  { id: "eur", key: "eur", label: "EUR", color: "#a78bfa" },
  { id: "sekkeh", key: "sekkeh", label: "Sekkeh", color: "#fbbf24" },
  { id: "gold", key: "18ayar", label: "Gold 18k", color: "#f59e0b" },
  { id: "btc", key: "usd_btc", label: "Bitcoin", color: "#f97316" },
  { id: "usdt", key: "usd_usdt", label: "Tether (USDT)", color: "#22c55e" },
  { id: "gbp", key: "gbp", label: "Pound (GBP)", color: "#8b5cf6" },
  { id: "rob", key: "rob", label: "Roub", color: "#f472b6" },
  { id: "try", key: "try", label: "TRY", color: "#f87171" },
  { id: "aed", key: "aed", label: "AED", color: "#34d399" }
];

const charts = {};
const grid = document.getElementById("chartGrid");
const dateBtn = document.getElementById("dateBtn");
const dateMenu = document.getElementById("dateMenu");

function createCard(asset) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="card-header">
      <h2>${asset.label}</h2>
      
      <div style="text-align:right">
        <span class="price-badge" id="badge-${asset.id}">—</span>
        <div id="range-${asset.id}" style="font-size:0.75rem;color:#94a3b8;margin-top:4px"></div>
      </div>
    </div>
    <canvas id="${asset.id}"></canvas>
  `;
  grid.appendChild(div);
}

function createChart(canvasId, labels, data, label, color) {
  if (charts[canvasId]) charts[canvasId].destroy();

  charts[canvasId] = new Chart(
    document.getElementById(canvasId).getContext("2d"),
    {
      type: "line",
      data: {
        labels,
        datasets: [{
          label,
          data,
          borderColor: color,
          backgroundColor: ctx => {
            const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 400);
            g.addColorStop(0, color + "44");
            g.addColorStop(1, "transparent");
            return g;
          },
          borderWidth: 3,
          pointRadius: ctx => ctx.dataIndex === data.length - 1 ? 4 : 0,
          pointHoverRadius: 6,
          pointBackgroundColor: ctx => ctx.dataIndex === data.length - 1 ? color : "transparent",
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: "index" },
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" } },
          y: {
            beginAtZero: false,
            grace: "15%",
            ticks: { color: "#94a3b8", callback: v => v.toLocaleString() },
            grid: { color: "#1e293b" }
          }
        }
      }
    }
  );
}

async function loadData(date) {
  const res = await fetch(`data/${date}.json`);
  if (!res.ok) return;

  const json = await res.json();
  grid.innerHTML = "";
  ASSETS.forEach(createCard);

  const labels = json.map(e => e.time);

  ASSETS.forEach(asset => {
    const values = json.map(entry => {
      const item = entry.data.find(i => i.key === asset.key);
      return item ? Number(item.price || 0) : 0;
    });

    createChart(asset.id, labels, values, asset.label, asset.color);

    const clean = values.filter(v => v > 0);
    const first = clean[0];
    const last = clean[clean.length - 1];
    const min = Math.min(...clean);
    const max = Math.max(...clean);
    
    const badge = document.getElementById(`badge-${asset.id}`);
    const range = document.getElementById(`range-${asset.id}`);
    
    if (first !== undefined && last !== undefined) {
      badge.textContent = last.toLocaleString();
      badge.classList.remove("price-up", "price-down");
      badge.classList.add(last >= first ? "price-up" : "price-down");
    
      range.textContent = `L ${min.toLocaleString()} · H ${max.toLocaleString()}`;
    }
  });
}

async function fileExists(date) {
  const res = await fetch(`data/${date}.json`, { method: "HEAD" });
  return res.ok;
}

async function loadAvailableDates() {
  const res = await fetch("data/dates.json", { cache: "no-store" });
  const dates = await res.json();

  dateMenu.innerHTML = "";

  dates.forEach(date => {
    const item = document.createElement("div");
    item.textContent = date;
    item.onclick = () => {
      dateBtn.textContent = `📅 ${date}`;
      dateMenu.classList.remove("show");
      loadData(date);
    };
    dateMenu.appendChild(item);
  });

  if (dates.length) {
    dateBtn.textContent = `📅 ${dates[0]}`;
    loadData(dates[0]);
  }
}

dateBtn.onclick = () => dateMenu.classList.toggle("show");

document.addEventListener("click", e => {
  if (!e.target.closest(".date-dropdown")) dateMenu.classList.remove("show");
});

loadAvailableDates();
</script>

</body>
</html>
