<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Financial Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --border: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #020617, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0;
    }

    input[type="date"] {
      background: #020617;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 24px;
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
      color: var(--text);
    }

    canvas {
      width: 100%;
      height: 360px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>📈 Financial Dashboard (Hourly)</h1>
  <input type="date" id="datePicker">
</header>

<section class="grid">
  <div class="card">
    <h2>💵 USD (Toman)</h2>
    <canvas id="usd"></canvas>
  </div>

  <div class="card">
    <h2>💶 EUR (Toman)</h2>
    <canvas id="eur"></canvas>
  </div>

  <div class="card">
    <h2>🪙 Sekkeh Emami</h2>
    <canvas id="sekkeh"></canvas>
  </div>

  <div class="card">
    <h2>🥇 Gold 18k (Tala)</h2>
    <canvas id="gold"></canvas>
  </div>

  <div class="card">
    <h2>₿ Bitcoin (USD)</h2>
    <canvas id="btc"></canvas>
  </div>
</section>

<footer>
  Data updated hourly via GitHub Actions
</footer>

<script>
const ASSETS = [
  { id: "usd", key: "usd", label: "USD", color: "#38bdf8" },
  { id: "eur", key: "eur", label: "EUR", color: "#a78bfa" },
  { id: "sekkeh", key: "sekkeh", label: "Sekkeh", color: "#fbbf24" },
  { id: "gold", key: "18ayar", label: "Gold 18k", color: "#f59e0b" },
  { id: "btc", key: "usd_btc", label: "Bitcoin", color: "#f97316" }
];

const charts = {};

function createChart(canvasId, labels, data, label, color) {
  if (charts[canvasId]) charts[canvasId].destroy();

  charts[canvasId] = new Chart(
    document.getElementById(canvasId).getContext("2d"),
    {
      type: "line",
      data: {
        labels,
        datasets: [{
          label,
          data,
          borderColor: color,
          backgroundColor: color + "33",
          borderWidth: 3,
          pointRadius: 0,
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: "index" },
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            ticks: { color: "#94a3b8" },
            grid: { color: "#1e293b" }
          },
          y: {
            ticks: { color: "#94a3b8" },
            grid: { color: "#1e293b" }
          }
        }
      }
    }
  );
}

async function loadData(date) {
  const res = await fetch(`data/${date}.json`);
  const json = await res.json();

  const labels = json.map(e => e.time);

  ASSETS.forEach(asset => {
    const values = json.map(entry => {
      const item = entry.data.find(i => i.key === asset.key);
      return item ? Number(item.priceFloat) : null;
    });

    createChart(asset.id, labels, values, asset.label, asset.color);
  });
}

// Init
const picker = document.getElementById("datePicker");
const today = new Date().toISOString().slice(0, 10);
picker.value = today;

picker.addEventListener("change", e => loadData(e.target.value));
loadData(today);
</script>

</body>
</html>
