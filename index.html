<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --radius: 16px;
      --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    [dir="rtl"] {
      --font: 'Vazirmatn', 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      padding: 40px 28px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    /* Header */
    header {
      max-width: 1440px;
      margin: 0 auto 28px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      font-family: inherit;
      min-width: fit-content;
    }

    .btn:hover {
      border-color: var(--muted);
      transform: translateY(-1px);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn-icon {
      padding: 9px;
    }

    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .view-toggle button.active {
      background: var(--text);
      color: var(--bg);
    }

    .date-dropdown {
      position: relative;
    }

    .date-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 230px;
      max-height: 320px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    [dir="rtl"] .date-menu {
      right: auto;
      left: 0;
    }

    .date-menu.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .date-menu div {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.12s ease;
      color: var(--text);
    }

    .date-menu div:hover {
      background: var(--border);
    }

    .date-menu div:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .date-menu::-webkit-scrollbar {
      width: 8px;
    }

    .date-menu::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }

    /* Toolbar */
    .toolbar {
      max-width: 1440px;
      margin: 0 auto 34px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
      font-family: inherit;
    }

    .tab:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 200px;
      outline: none;
      font: inherit;
      font-size: 0.875rem;
      transition: border-color 0.2s ease;
      box-shadow: var(--shadow);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .mode-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-toggle button svg {
      width: 14px;
      height: 14px;
    }

    .mode-toggle button.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Charts Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      column-gap: 24px;
      row-gap: 64px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      height: 500px;
      transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 18px;
    }

    .asset-info {
      min-width: 0;
    }

    .asset-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .asset-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      padding: 2px;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
    }

    .fav-btn svg {
      width: 16px;
      height: 16px;
    }

    .fav-btn:hover {
      transform: scale(1.1);
      color: #eab308;
    }

    .fav-btn.active {
      color: #eab308;
    }

    .asset-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .asset-meta strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }

    .range-bar {
      position: relative;
      width: 100%;
      max-width: 250px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      margin-top: 13px;
    }

    .range-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    .range-dot {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .price-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 0;
    }

    [dir="rtl"] .price-info {
      text-align: left;
      align-items: flex-start;
    }

    .price-current {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .price-change {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
    }

    .price-change.up {
      color: var(--green);
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.18);
    }

    .price-change.down {
      color: var(--red);
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.18);
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .chart-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .card-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    [dir="rtl"] .card-actions {
      right: auto;
      left: 16px;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .card-action-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .card-action-btn:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .card-action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Heatmap */
    .heatmap {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .heatmap-tile {
      aspect-ratio: 1.2;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .heatmap-tile:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .heatmap-tile.positive {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .heatmap-tile.negative {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .heatmap-tile.neutral {
      background: var(--card);
      border: 1px solid var(--border);
    }

    .heatmap-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heatmap-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .heatmap-change {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .heatmap-change.up {
      color: var(--green);
    }

    .heatmap-change.down {
      color: var(--red);
    }

    /* Table */
    .table-container {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .data-table thead {
      background: var(--bg);
    }

    .data-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    [dir="rtl"] .data-table th {
      text-align: right;
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    .data-table tbody tr {
      transition: background 0.15s ease;
    }

    .data-table tbody tr:hover {
      background: var(--bg);
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .table-asset {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-asset-name {
      font-weight: 600;
    }

    .table-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .table-change.up {
      color: var(--green);
      background: rgba(34, 197, 94, 0.1);
    }

    .table-change.down {
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      max-width: 1440px;
      margin: 70px auto 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 100;
    }

    .loader.show {
      display: block;
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast svg {
      width: 16px;
      height: 16px;
      color: var(--green);
    }

    @media (max-width: 640px) {
      body {
        padding: 22px 14px;
      }

      header {
        margin-bottom: 22px;
      }

      .toolbar {
        margin-bottom: 26px;
      }

      .search-input {
        width: 100%;
      }

      .grid {
        row-gap: 38px;
      }

      .card {
        height: 460px;
        padding: 18px;
      }

      .card-header {
        gap: 14px;
      }

      .heatmap {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }

      .data-table {
        font-size: 0.75rem;
      }

      .data-table th,
      .data-table td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="title-section">
    <i data-feather="trending-up" style="width:24px;height:24px;color:var(--accent)"></i>
    <h1 data-i18n="title">Markets</h1>
  </div>

  <div class="controls">
    <div class="view-toggle" id="viewToggle">
      <button data-view="daily" class="active" data-i18n="daily">Daily</button>
      <button data-view="monthly" data-i18n="monthly">Monthly</button>
    </div>

    <div class="date-dropdown">
      <button class="btn" id="dateBtn">
        <i data-feather="calendar"></i>
        <span id="dateBtnText" data-i18n="loading">Loading...</span>
      </button>
      <div id="dateMenu" class="date-menu"></div>
    </div>

    <button class="btn btn-icon" id="langBtn" title="Language">EN</button>
    <button class="btn btn-icon" id="themeBtn" title="Theme">
      <i data-feather="moon"></i>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-left">
    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-category="all" data-i18n="all">All</button>
      <button class="tab" data-category="currency" data-i18n="currencies">Currencies</button>
      <button class="tab" data-category="gold" data-i18n="gold">Gold</button>
      <button class="tab" data-category="crypto" data-i18n="crypto">Crypto</button>
      <button class="tab" data-category="pamp">PAMP</button>
      <button class="tab" data-category="favorites">
        <i data-feather="star" style="width:12px;height:12px;vertical-align:middle"></i>
        <span data-i18n="favorites">Favorites</span>
      </button>
    </div>
  </div>

  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="charts" class="active">
        <i data-feather="bar-chart-2"></i>
        <span data-i18n="charts">Charts</span>
      </button>
      <button data-mode="heatmap">
        <i data-feather="grid"></i>
        <span data-i18n="heatmap">Heatmap</span>
      </button>
      <button data-mode="table">
        <i data-feather="list"></i>
        <span data-i18n="table">Table</span>
      </button>
    </div>
    <input id="assetSearch" class="search-input" type="text" placeholder="Search..." data-i18n-placeholder="search" />
  </div>
</div>

<section class="grid" id="chartGrid"></section>
<section class="heatmap" id="heatmapGrid" style="display:none"></section>
<section class="table-container" id="tableContainer" style="display:none">
  <table class="data-table" id="dataTable">
    <thead>
      <tr>
        <th data-i18n="asset">Asset</th>
        <th data-i18n="price">Price</th>
        <th data-i18n="open">Open</th>
        <th data-i18n="low">Low</th>
        <th data-i18n="high">High</th>
        <th data-i18n="change">Change</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</section>

<footer id="appFooter">Data updated via GitHub Actions</footer>

<div class="loader" id="loader"></div>
<div class="toast" id="toast">
  <i data-feather="check-circle"></i>
  <span id="toastText"></span>
</div>

<script>
// ---------- Translations ----------
const translations = {
  en: {
    title: "Markets",
    daily: "Daily",
    monthly: "Monthly",
    loading: "Loading...",
    all: "All",
    currencies: "Currencies",
    gold: "Gold",
    crypto: "Crypto",
    favorites: "Favorites",
    charts: "Charts",
    heatmap: "Heatmap",
    table: "Table",
    search: "Search assets...",
    asset: "Asset",
    price: "Price",
    open: "Open",
    low: "Low",
    high: "High",
    change: "Change",
    noData: "No data loaded.",
    noFavorites: "No favorite assets yet. Click the star on a card to add one.",
    noAssets: "No assets found.",
    exported: "Chart exported successfully",
    lastUpdated: "Last updated",
    monthlyView: "Monthly view"

// ---------- URL State ----------
function parseURLState() {
  const params = new URLSearchParams(window.location.search);
  
  if (params.has("view")) currentView = params.get("view");
  if (params.has("mode")) currentMode = params.get("mode");
  if (params.has("category")) activeCategory = params.get("category");
  if (params.has("theme")) currentTheme = params.get("theme");
  if (params.has("lang")) currentLang = params.get("lang");
  if (params.has("search")) searchQuery = params.get("search");
}

function updateURLState() {
  const params = new URLSearchParams();
  params.set("view", currentView);
  params.set("mode", currentMode);
  params.set("category", activeCategory);
  params.set("theme", currentTheme);
  params.set("lang", currentLang);
  if (searchQuery) params.set("search", searchQuery);
  
  const newURL = `${window.location.pathname}?${params.toString()}`;
  window.history.replaceState({}, "", newURL);
}

// ---------- Utils ----------
function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function fmt(value) {
  const n = Number(value);
  if (value == null || !Number.isFinite(n)) return "—";
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function parseDate(dateStr) {
  return new Date(`${dateStr}T12:00:00Z`);
}

const jalaliFullFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric", month: "long", day: "numeric"
});

const jalaliShortFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric", month: "2-digit", day: "2-digit"
});

const jalaliMonthFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric", month: "long"
});

const jalaliMonthKeyFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
  year: "numeric", month: "numeric"
});

function toJalali(dateStr) {
  return jalaliFullFormatter.format(parseDate(dateStr));
}

function toJalaliShort(dateStr) {
  return jalaliShortFormatter.format(parseDate(dateStr));
}

function getJalaliMonthLabel(dateStr) {
  return jalaliMonthFormatter.format(parseDate(dateStr));
}

function getJalaliMonthKey(dateStr) {
  const parts = jalaliMonthKeyFormatter.formatToParts(parseDate(dateStr));
  const year = parts.find(p => p.type === "year")?.value || "0000";
  const month = parts.find(p => p.type === "month")?.value || "00";
  return `${year}-${month.padStart(2, "0")}`;
}

// ---------- Data ----------
async function fetchDay(date) {
  const latestDate = allDates[0];
  const shouldCache = date !== latestDate;
  if (shouldCache && dataCache.has(date)) return dataCache.get(date);
  
  const res = await fetch(`data/${date}.json`);
  const json = res.ok ? await res.json() : null;
  if (shouldCache && json) dataCache.set(date, json);
  return json;
}

function computeDisplayIndices(length, maxPoints) {
  maxPoints = Math.max(2, maxPoints);
  if (!length) {
    displayIndices = [];
    displayLabels = [];
    return;
  }
  if (length <= maxPoints) {
    displayIndices = Array.from({ length }, (_, i) => i);
  } else {
    displayIndices = Array.from({ length: maxPoints }, (_, i) =>
      Math.round(i * (length - 1) / (maxPoints - 1))
    );
  }
  displayLabels = displayIndices.map(i => currentLabels[i]);
}

function getAssetValues(asset, entries) {
  return entries.map(entry => {
    if (!entry) return null;
    let price = null;
    if (Array.isArray(entry.data)) {
      const item = entry.data.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }
    if (price == null && Array.isArray(entry.financial)) {
      const item = entry.financial.find(i => String(i.key) === String(asset.key));
      if (item) price = Number(item.price);
    }
    if (price == null && entry.pamp && Array.isArray(entry.pamp.items)) {
      const item = entry.pamp.items.find(i => Number(i.weightGram) === Number(asset.key));
      if (item) price = Number(item.price);
    }
    return Number.isFinite(price) && price > 0 ? price : null;
  });
}

function calculateStats(assetId, values) {
  const clean = values.filter(v => v != null && v > 0);
  if (!clean.length) return null;
  
  const open = clean[0];
  const close = clean[clean.length - 1];
  const low = Math.min(...clean);
  const high = Math.max(...clean);
  const change = open > 0 ? ((close - open) / open) * 100 : 0;
  
  return { open, close, low, high, change };
}

async function loadData(date) {
  showLoading(true);
  const json = await fetchDay(date);
  const entries = Array.isArray(json) ? json : [];
  
  currentEntries = entries;
  currentLabels = entries.map(e => e.time || "");
  computeDisplayIndices(currentLabels.length, 240);
  
  renderDashboard();
  
  const lastEntry = entries[entries.length - 1];
  if (lastEntry) {
    appFooter.textContent = `${t("lastUpdated")}: ${toJalali(date)} at ${lastEntry.time}`;
  }
  
  showLoading(false);
}

async function loadMonthlyData(dates) {
  showLoading(true);
  const allData = await Promise.all(dates.map(d => fetchDay(d)));
  
  const labels = [];
  const entries = [];
  for (let i = dates.length - 1; i >= 0; i--) {
    const dayData = allData[i];
    if (Array.isArray(dayData) && dayData.length > 0) {
      labels.push(toJalaliShort(dates[i]));
      entries.push(dayData[dayData.length - 1]);
    }
  }
  
  currentLabels = labels;
  currentEntries = entries;
  computeDisplayIndices(currentLabels.length, 120);
  renderDashboard();
  
  if (dates.length && entries.length) {
    const lastEntry = entries[entries.length - 1];
    appFooter.textContent = `${t("monthlyView")}: ending ${toJalali(dates[0])} at ${lastEntry.time || ""}`;
  }
  
  showLoading(false);
}

function destroyCharts() {

function createCard(asset) {

      <canvas id="${asset.id}"></canvas>
    </div>
  `;
  
  grid.appendChild(div);
  requestAnimationFrame(() => div.classList.add("visible"));

function createChart(canvasId, labels, data, label, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  
  const colors = getChartColors();
  let lastValidIndex = -1;
  for (let i = data.length - 1; i >= 0; i--) {
    if (data[i] != null && data[i] > 0) {
      lastValidIndex = i;
      break;
    }
  }
  
  charts[canvasId] = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label, data, borderColor: color, borderWidth: 2, fill: true, tension: 0.35, spanGaps: true,
        backgroundColor: ctx => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 300);
          g.addColorStop(0, color + "33");
          g.addColorStop(1, "transparent");
          return g;
        },
        pointRadius: ctx => ctx.dataIndex === lastValidIndex ? 4 : 0,
        pointHoverRadius: 6,
        pointBackgroundColor: color,
        pointBorderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      resizeDelay: 120,
      animation: { duration: 300, easing: "easeOutQuart" },
      interaction: { intersect: false, mode: "index" },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: colors.tooltipBg,
          titleColor: colors.tooltipText,
          bodyColor: colors.tooltipText,
          borderColor: colors.tooltipBorder,
          borderWidth: 1,
          padding: 12,
          displayColors: false,
          callbacks: {
            title: items => items.length ? items[0].label : "",
            label: ctx => ctx.parsed.y == null ? "No data" : fmt(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: colors.text, maxRotation: 0, autoSkipPadding: 18, maxTicksLimit: 8 },
          grid: { color: colors.grid }
        },
        y: {
          beginAtZero: false,
          grace: "10%",
          ticks: { color: colors.text, maxTicksLimit: 6, callback: v => Number(v).toLocaleString() },
          grid: { color: colors.grid }
        }
      }
    }
  });
}

function updateAssetStats(assetId, values) {
  const stats = calculateStats(assetId, values);
  const priceEl = document.getElementById(`price-${assetId}`);
  const changeEl = document.getElementById(`change-${assetId}`);
  const openEl = document.getElementById(`open-${assetId}`);
  const lowEl = document.getElementById(`low-${assetId}`);
  const highEl = document.getElementById(`high-${assetId}`);
  const fillEl = document.getElementById(`range-fill-${assetId}`);
  const dotEl = document.getElementById(`range-dot-${assetId}`);
  
  if (!priceEl || !changeEl || !openEl || !lowEl || !highEl || !fillEl || !dotEl) return;
  
  if (!stats) {
    priceEl.textContent = "—";
    changeEl.textContent = "—";
    changeEl.className = "price-change";
    openEl.textContent = "—";
    lowEl.textContent = "—";
    highEl.textContent = "—";
    fillEl.style.width = "0%";
    dotEl.style.left = "0%";
    assetStats[assetId] = null;
    return;
  }
  
  assetStats[assetId] = stats;
  
  priceEl.textContent = fmt(stats.close);
  openEl.textContent = fmt(stats.open);
  lowEl.textContent = fmt(stats.low);
  highEl.textContent = fmt(stats.high);
  
  changeEl.textContent = `${stats.change >= 0 ? "▲" : "▼"} ${Math.abs(stats.change).toFixed(2)}%`;
  changeEl.className = `price-change ${stats.change >= 0 ? "up" : "down"}`;
  
  const rangePosition = stats.high > stats.low ? ((stats.close - stats.low) / (stats.high - stats.low)) * 100 : 0;
  fillEl.style.width = `${rangePosition}%`;
  dotEl.style.left = `${rangePosition}%`;
}

function renderCharts() {
  destroyCharts();
  grid.innerHTML = "";
  grid.style.display = "";
  heatmapGrid.style.display = "none";
  tableContainer.style.display = "none";
  
  if (!currentEntries.length) {
    grid.innerHTML = `<div class="empty-state">${t("noData")}</div>`;
    return;
  }
  
  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    grid.innerHTML = `<div class="empty-state">${
      activeCategory === "favorites" ? t("noFavorites") : t("noAssets")
    }</div>`;
    return;
  }
  
  visibleAssets.forEach(asset => {
    createCard(asset);
    const fullValues = getAssetValues(asset, currentEntries);
    const chartValues = displayIndices.map(i => fullValues[i] ?? null);
    createChart(asset.id, displayLabels, chartValues, asset.label, asset.color);
    updateAssetStats(asset.id, fullValues);
  });
  
  feather.replace();
}

function renderHeatmap() {
  grid.style.display = "none";
  tableContainer.style.display = "none";
  heatmapGrid.style.display = "";
  heatmapGrid.innerHTML = "";
  
  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    heatmapGrid.innerHTML = `<div class="empty-state">${t("noAssets")}</div>`;
    return;
  }
  
  visibleAssets.forEach(asset => {
    const fullValues = getAssetValues(asset, currentEntries);
    const stats = calculateStats(asset.id, fullValues);
    
    const tile = document.createElement("div");
    let tileClass = "heatmap-tile neutral";
    let changeClass = "";
    let changeText = "—";
    
    if (stats) {
      if (stats.change > 0) {
        tileClass = "heatmap-tile positive";
        changeClass = "heatmap-change up";
        changeText = `▲ ${stats.change.toFixed(2)}%`;
      } else if (stats.change < 0) {
        tileClass = "heatmap-tile negative";
        changeClass = "heatmap-change down";
        changeText = `▼ ${Math.abs(stats.change).toFixed(2)}%`;
      }
    }
    
    tile.className = tileClass;
    tile.innerHTML = `
      <div class="heatmap-label">${asset.label}</div>
      <div>
        <div class="heatmap-price">${stats ? fmt(stats.close) : "—"}</div>
        <div class="${changeClass}">${changeText}</div>
      </div>
    `;
    
    heatmapGrid.appendChild(tile);
  });
}

function renderTable() {
  grid.style.display = "none";
  heatmapGrid.style.display = "none";
  tableContainer.style.display = "";
  tableBody.innerHTML = "";
  
  const visibleAssets = getVisibleAssets();
  if (!visibleAssets.length) {
    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px">${t("noAssets")}</td></tr>`;
    return;
  }
  
  visibleAssets.forEach(asset => {
    const fullValues = getAssetValues(asset, currentEntries);
    const stats = calculateStats(asset.id, fullValues);
    
    const tr = document.createElement("tr");
    let changeHTML = "—";
    
    if (stats) {
      const changeClass = stats.change >= 0 ? "up" : "down";
      const arrow = stats.change >= 0 ? "▲" : "▼";
      changeHTML = `<span class="table-change ${changeClass}">${arrow} ${Math.abs(stats.change).toFixed(2)}%</span>`;
    }
    
    tr.innerHTML = `
      <td><div class="table-asset"><span class="table-asset-name">${asset.label}</span></div></td>
      <td>${stats ? fmt(stats.close) : "—"}</td>
      <td>${stats ? fmt(stats.open) : "—"}</td>
      <td>${stats ? fmt(stats.low) : "—"}</td>
      <td>${stats ? fmt(stats.high) : "—"}</td>
      <td>${changeHTML}</td>
    `;
    
    tableBody.appendChild(tr);
  });
}

function renderDashboard() {
  assetStats = {};
  
  if (currentMode === "charts") {
    renderCharts();
  } else if (currentMode === "heatmap") {
    renderHeatmap();
  } else if (currentMode === "table") {
    renderTable();
  }
  
  updateURLState();
}

// ---------- Export ----------
async function exportChart(assetId) {
  const chart = charts[assetId];
  if (!chart) return;
  
  const asset = ASSETS.find(a => a.id === assetId);
  if (!asset) return;
  
  const stats = assetStats[assetId];
  if (!stats) return;
  
  // Create export canvas
  const exportCanvas = document.createElement("canvas");
  const exportWidth = 1200;
  const exportHeight = 675;
  exportCanvas.width = exportWidth;
  exportCanvas.height = exportHeight;
  
  const ctx = exportCanvas.getContext("2d");
  const isDark = currentTheme === "dark";
  
  // Background
  ctx.fillStyle = isDark ? "#09090b" : "#ffffff";
  ctx.fillRect(0, 0, exportWidth, exportHeight);
  
  // Header area
  ctx.fillStyle = isDark ? "#18181b" : "#f4f4f5";
  ctx.fillRect(0, 0, exportWidth, 100);
  
  // Title
  ctx.fillStyle = isDark ? "#fafafa" : "#18181b";
  ctx.font = "bold 32px Inter, system-ui";
  ctx.textAlign = "left";
  ctx.fillText(asset.label, 40, 60);
  
  // Price
  ctx.font = "600 24px Inter, system-ui";
  ctx.fillText(fmt(stats.close), 40, 90);
  
  // Change
  const changeColor = stats.change >= 0 ? "#22c55e" : "#ef4444";
  ctx.fillStyle = changeColor;
  ctx.font = "600 20px Inter, system-ui";
  const arrow = stats.change >= 0 ? "▲" : "▼";
  ctx.fillText(`${arrow} ${Math.abs(stats.change).toFixed(2)}%`, 200, 90);
  
  // Chart area
  const chartImage = new Image();
  chartImage.src = chart.toBase64Image();
  
  await new Promise(resolve => {
    chartImage.onload = () => {
      ctx.drawImage(chartImage, 40, 130, exportWidth - 80, exportHeight - 180);
      resolve();
    };
  });
  
  // Footer
  ctx.fillStyle = isDark ? "#a1a1aa" : "#71717a";
  ctx.font = "400 14px Inter, system-ui";
  ctx.textAlign = "center";
  ctx.fillText(`Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}`, exportWidth / 2, exportHeight - 20);
  
  // Download
  const link = document.createElement("a");
  link.download = `${asset.label.toLowerCase()}-${Date.now()}.png`;
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
  
  showToast(t("exported"));
}

// ---------- Dates ----------
function renderDateMenu() {
  dateMenu.innerHTML = "";
  const items = currentView === "daily" ? allDates : allMonths;
  
  if (!items.length) {
    const div = document.createElement("div");
    div.textContent = "No dates found";
    dateMenu.appendChild(div);
    return;
  }
  
  items.forEach(item => {
    const div = document.createElement("div");
    if (currentView === "daily") {
      div.textContent = toJalali(item);
      div.onclick = () => {
        dateBtnText.textContent = toJalali(item);
        dateMenu.classList.remove("show");
        loadData(item);
      };
    } else {
      div.textContent = item.label;
      div.onclick = () => {
        dateBtnText.textContent = item.label;
        dateMenu.classList.remove("show");
        loadMonthlyData(item.dates);
      };
    }
    dateMenu.appendChild(div);
  });
}

async function loadAvailableDates() {
  const res = await fetch("data/dates.json", { cache: "no-store" });
  allDates = res.ok ? await res.json() : [];
  if (!Array.isArray(allDates)) allDates = [];
  
  const monthMap = {};
  allDates.forEach(d => {
    const key = getJalaliMonthKey(d);
    if (!monthMap[key]) {
      monthMap[key] = { key, label: getJalaliMonthLabel(d), dates: [] };
    }
    monthMap[key].dates.push(d);
  });
  
  allMonths = Object.values(monthMap).sort((a, b) => b.key.localeCompare(a.key));
  renderDateMenu();
  
  if (!allDates.length) {
    dateBtnText.textContent = "No dates";
    return;
  }
  
  if (currentView === "daily") {
    dateBtnText.textContent = toJalali(allDates[0]);
    loadData(allDates[0]);
  } else {
    dateBtnText.textContent = allMonths[0].label;
    loadMonthlyData(allMonths[0].dates);
  }
}

// ---------- Events ----------
themeBtn.addEventListener("click", () => {
  applyTheme(currentTheme === "dark" ? "light" : "dark");
  updateURLState();
});

langBtn.addEventListener("click", () => {
  applyLanguage(currentLang === "en" ? "fa" : "en");
  renderDashboard();
  updateURLState();
});

viewToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn || btn.classList.contains("active")) return;
  
  document.querySelector("#viewToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentView = btn.dataset.view;
  renderDateMenu();
  
  if (currentView === "daily" && allDates.length) {
    dateBtnText.textContent = toJalali(allDates[0]);
    loadData(allDates[0]);
  }
  if (currentView === "monthly" && allMonths.length) {
    dateBtnText.textContent = allMonths[0].label;
    loadMonthlyData(allMonths[0].dates);
  }
});

modeToggle.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.classList.contains("active")) return;
  
  document.querySelector("#modeToggle .active")?.classList.remove("active");
  btn.classList.add("active");
  currentMode = btn.dataset.mode;
  renderDashboard();
});

categoryTabs.addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  
  activeCategory = btn.dataset.category;
  document.querySelectorAll("#categoryTabs .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.category === activeCategory);
  });
  renderDashboard();
});

assetSearch.addEventListener("input", debounce(() => {
  searchQuery = assetSearch.value.trim().toLowerCase();
  renderDashboard();
}, 200));

grid.addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn");
  if (favBtn) {
    const id = favBtn.dataset.fav;
    toggleFavorite(id);
    const isFav = favorites.includes(id);
    
    if (activeCategory === "favorites") {
      renderDashboard();
      return;
    }
    
    favBtn.classList.toggle("active", isFav);
    const icon = favBtn.querySelector("i");
    if (icon) icon.setAttribute("fill", isFav ? "currentColor" : "");
    feather.replace();
  }
  
  const exportBtn = e.target.closest("[data-export]");
  if (exportBtn) {
    exportChart(exportBtn.dataset.export);
  }
});

dateBtn.onclick = () => dateMenu.classList.toggle("show");

document.addEventListener("click", e => {
  if (!e.target.closest(".date-dropdown")) {
    dateMenu.classList.remove("show");
  }
});

// ---------- Init ----------
parseURLState();
applyTheme(currentTheme);
applyLanguage(currentLang);
if (searchQuery) assetSearch.value = searchQuery;

document.querySelectorAll("#viewToggle button").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.view === currentView);
});

document.querySelectorAll("#modeToggle button").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.mode === currentMode);
});

document.querySelectorAll("#categoryTabs .tab").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.category === activeCategory);
});

feather.replace();
loadAvailableDates();
</script>

</body>
