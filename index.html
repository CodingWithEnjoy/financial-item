  <style>
    :root {
      --bg:#09090b; --card:#18181b; --border:#27272a;
      --text:#fafafa; --muted:#a1a1aa;
      --accent:#3b82f6; --accent-soft:rgba(59,130,246,.18);
      --green:#22c55e; --red:#ef4444;
      --radius:16px; --font:'Inter',system-ui,sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    [data-theme="light"] {
      --bg:#fff; --card:#f4f4f5; --border:#e4e4e7;
      --text:#18181b; --muted:#71717a;
      --accent:#2563eb; --accent-soft:rgba(37,99,235,.14);
    }
    [dir="rtl"] { --font:'Vazirmatn','Inter',system-ui,sans-serif; }

    * { box-sizing:border-box; margin:0; padding:0; letter-spacing:0; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

    .price-current,.price-change,.asset-meta,.asset-meta strong,.heatmap-price,.heatmap-change,.afford-qty,.afford-price,.wallet-stat-value,.data-table td,.data-table th,.cal-tooltip,.today-chip,#affordAmount,.command-item-shortcut,.cols-toggle button,.trend-arrow,.trend-label,.compare-head-text h3 { letter-spacing:0; }

    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:999px; border:2px solid var(--bg); }

    ::selection { background:var(--accent); color:#fff; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

    body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; padding:28px; transition:background .3s ease, color .3s ease; min-height:100vh; overflow-x:hidden; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .anim-in { animation:fadeUp .3s ease; }

    @keyframes pulseAlert { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.4); } 50% { box-shadow:0 0 0 8px rgba(239,68,68,0); } }
    .card.alert-hit { border-color:var(--red); animation:pulseAlert 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001s !important; transition-duration:.001s !important; }
    }

    header { max-width:1440px; margin:0 auto 24px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px 16px; }
    .header-brand { grid-column:1/-1; display:flex; align-items:center; gap:14px; min-width:0; }
    .brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .brand-mark { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:block; }
    .brand-text { display:flex; flex-direction:column; line-height:1.1; }
    .brand-fa { font-size:1.3rem; font-weight:800; }
    .brand-en { font-size:.68rem; font-weight:700; color:var(--muted); text-transform:uppercase; }
    .header-tagline { color:var(--muted); font-size:.85rem; border-inline-start:1px solid var(--border); padding-inline-start:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .header-spacer { flex:1; }
    .today-chip { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:.8rem; font-weight:600; color:var(--muted); white-space:nowrap; flex-shrink:0; }
    .today-chip svg { width:14px; height:14px; }

    .header-controls { display:contents; }
    .header-row { grid-column:1/-1; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px 10px; min-width:0; }
    .header-row-main { justify-content:space-between; flex-wrap:wrap; }
    .header-row .mode-toggle { background:transparent; border:none; padding:0; }
    .header-row .tabs { padding:0; }
    .controls-main { display:flex; gap:10px; align-items:center; flex-wrap:nowrap; }
    .controls-icons { display:flex; gap:8px; align-items:center; }

    .btn.menu-btn, .btn.drawer-close, .drawer-divider { display:none; }
    .drawer-overlay { display:none; }

    .btn { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px; font-size:.875rem; font-weight:500; cursor:pointer; transition:border-color .2s, background .2s, transform .12s var(--ease); display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; height:40px; white-space:nowrap; }
    .btn:hover { border-color:var(--muted); }
    .btn:active { transform:scale(.95); }
    .btn svg { width:16px; height:16px; flex-shrink:0; }
    #dateBtn { padding:0 14px; min-width:200px; justify-content:flex-start; }
    #dateBtnText { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #langBtn { width:52px; font-weight:700; }
    #themeBtn, #styleBtn, #alertsBtn, #shortcutsBtn { width:40px; }

    .view-toggle { display:flex; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:3px; }
    .view-toggle button { background:transparent; border:none; color:var(--muted); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:.82rem; font-weight:600; transition:all .2s var(--ease); font-family:inherit; white-space:nowrap; }
    .view-toggle button:active { transform:scale(.95); }
    .view-toggle button.active { background:var(--text); color:var(--bg); }

    .date-dropdown { position:relative; }
    .date-menu { position:absolute; top:calc(100% + 8px); right:0; background:var(--card); border:1px solid var(--border); border-radius:12px; min-width:230px; max-height:320px; overflow-y:auto; opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none; transition:.22s var(--ease); z-index:50; }
    [dir="rtl"] .date-menu { right:auto; left:0; }
    .date-menu.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .date-menu div { padding:12px 14px; cursor:pointer; font-size:.875rem; transition:background .12s; color:var(--text); }
    .date-menu div:hover { background:var(--border); }
    .date-menu div:not(:last-child) { border-bottom:1px solid var(--border); }

    .tabs { display:flex; gap:8px; flex:1 1 auto; min-width:0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:2px; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:0 14px; height:34px; border-radius:999px; cursor:pointer; font-size:.8rem; font-weight:600; transition:all .2s var(--ease); font-family:inherit; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto; }
    .tab:hover { border-color:var(--muted); color:var(--text); }
    .tab:active { transform:scale(.95); }
    .tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
    .tab svg { width:12px; height:12px; }

    .mode-toggle { display:flex; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .mode-toggle::-webkit-scrollbar { display:none; }
    .mode-toggle button { background:transparent; border:none; color:var(--muted); padding:7px 12px; border-radius:8px; cursor:pointer; font-size:.8rem; font-weight:600; transition:all .2s var(--ease); font-family:inherit; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto; }
    .mode-toggle button:active { transform:scale(.95); }
    .mode-toggle button svg { width:14px; height:14px; }
    .mode-toggle button.active { background:var(--text); color:var(--bg); }

    .search-section { max-width:1440px; margin:0 auto 24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .cols-toggle { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px 10px 4px 14px; height:40px; flex-shrink:0; }
    .cols-label { font-size:.78rem; color:var(--muted); font-weight:600; white-space:nowrap; }
    .cols-toggle button { width:28px; height:28px; border:none; border-radius:7px; background:transparent; color:var(--muted); font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; transition:all .15s var(--ease); }
    .cols-toggle button:hover { color:var(--text); }
    .cols-toggle button:active { transform:scale(.9); }
    .cols-toggle button.active { background:var(--text); color:var(--bg); }

    .search-wrap { position:relative; width:280px; margin-inline-start:auto; }
    .search-wrap svg { position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); pointer-events:none; }
    .search-input { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:0 14px; height:40px; width:100%; outline:none; font:inherit; font-size:.875rem; transition:border-color .2s, box-shadow .2s; }
    .search-wrap .search-input { padding-inline-start:36px; }
    .search-input::placeholder { color:var(--muted); }
    .search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

    .asset-icon { width:22px; height:22px; object-fit:contain; border-radius:6px; flex-shrink:0; }
    .asset-icon-fallback { width:12px; height:12px; border-radius:50%; flex-shrink:0; display:inline-block; }
    .hl-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,480px),1fr)); column-gap:24px; row-gap:64px; max-width:1440px; margin:0 auto; }
    .grid.cols-1 { grid-template-columns:1fr; }
    .grid.cols-2 { grid-template-columns:repeat(2,1fr); }
    .grid.cols-3 { grid-template-columns:repeat(3,1fr); }
    .grid.cols-4 { grid-template-columns:repeat(4,1fr); }
    .grid.cols-3 .card, .grid.cols-4 .card { height:440px; padding:18px; }
    .grid.cols-4 .price-current { font-size:1.25rem; }
    .grid.cols-4 .asset-meta { gap:6px 10px; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; position:relative; overflow:hidden; opacity:0; transform:translateY(12px); height:500px; transition:opacity .35s ease, transform .35s var(--ease), border-color .2s, background .3s; user-select:none; }
    .card.visible { opacity:1; transform:translateY(0); }
    .card:hover { border-color:var(--muted); }

    .card-header { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:start; margin-bottom:18px; }
    .asset-info { min-width:0; }
    .asset-title { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
    .asset-title h2 { font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .fav-btn, .detail-btn { background:transparent; border:none; color:var(--muted); cursor:pointer; border-radius:6px; padding:2px; transition:color .2s, transform .12s var(--ease); display:flex; align-items:center; flex-shrink:0; }
    .fav-btn:active, .detail-btn:active { transform:scale(.88); }
    .fav-btn svg, .detail-btn svg { width:16px; height:16px; }
    .fav-btn:hover { color:#eab308; }
    .fav-btn.active { color:#eab308; }
    .fav-btn.active svg { fill:currentColor; }
    .detail-btn:hover { color:var(--accent); }

    .asset-meta { display:flex; flex-wrap:wrap; gap:8px 14px; font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums; }
    .asset-meta strong { color:var(--text); font-weight:600; margin-left:4px; }
    [dir="rtl"] .asset-meta strong { margin-left:0; margin-right:4px; }

    .range-bar { position:relative; width:100%; max-width:250px; height:6px; border-radius:999px; background:var(--border); margin-top:13px; }
    .range-fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:999px; background:var(--accent-soft); transition:width .4s var(--ease); }
    .range-dot { position:absolute; top:50%; left:0%; width:10px; height:10px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); transition:left .4s var(--ease); }

    .trend-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .trend-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:.68rem; font-weight:600; background:var(--border); color:var(--muted); }
    .trend-chip.up { background:rgba(34,197,94,.15); color:var(--green); }
    .trend-chip.down { background:rgba(239,68,68,.15); color:var(--red); }
    .trend-arrow { font-size:.9rem; font-weight:700; }

    .price-info { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:0; }
    [dir="rtl"] .price-info { text-align:left; align-items:flex-start; }
    .price-current { font-size:clamp(1.25rem,2vw,1.75rem); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .price-change { font-size:.74rem; font-weight:700; padding:4px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; color:var(--muted); border:1px solid var(--border); background:transparent; min-width:76px; justify-content:center; transition:all .2s; }
    .price-change.up { color:var(--green); background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.18); }
    .price-change.down { color:var(--red); background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.18); }

    .chart-wrap { position:relative; flex:1; min-height:0; }
    .chart-wrap canvas { position:absolute; inset:0; width:100%; height:100%; }

    .skeleton-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; height:500px; display:flex; flex-direction:column; gap:16px; }
    .skeleton-line { height:20px; border-radius:8px; background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
    .skeleton-line.title { width:60%; height:24px; }
    .skeleton-line.price { width:40%; height:32px; }
    .skeleton-line.chart { flex:1; border-radius:12px; }
    @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

    .heatmap { max-width:1440px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
    .heatmap-tile { aspect-ratio:1.2; border-radius:12px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; transition:border-color .2s, transform .2s var(--ease); overflow:hidden; }
    .heatmap-tile:hover { border-color:var(--text); transform:translateY(-3px); }
    .heatmap-tile.positive { background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.05)); border:1px solid rgba(34,197,94,.3); }
    .heatmap-tile.negative { background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05)); border:1px solid rgba(239,68,68,.3); }
    .heatmap-tile.neutral { background:var(--card); border:1px solid var(--border); }
    .heatmap-label { display:flex; align-items:center; gap:8px; font-size:.85rem; font-weight:600; color:var(--text); min-width:0; }
    .heatmap-label .asset-icon { width:20px; height:20px; }
    .heatmap-price { font-size:.95rem; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
    .heatmap-change { font-size:.8rem; font-weight:700; }
    .heatmap-change.up { color:var(--green); }
    .heatmap-change.down { color:var(--red); }

    .table-container { max-width:1440px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; overflow-y:hidden; }
    .data-table { width:100%; border-collapse:collapse; font-size:.875rem; }
    .data-table thead { background:var(--bg); }
    .data-table th { padding:14px 16px; text-align:left; font-weight:600; color:var(--muted); font-size:.75rem; text-transform:uppercase; border-bottom:1px solid var(--border); }
    [dir="rtl"] .data-table th { text-align:right; }
    .data-table td { padding:14px 16px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
    .data-table tbody tr { transition:background .15s; }
    .data-table tbody tr:hover { background:var(--bg); }
    .data-table tbody tr:last-child td { border-bottom:none; }
    .table-asset { display:flex; align-items:center; gap:10px; }
    .table-asset .asset-icon { width:24px; height:24px; }
    .table-asset-name { font-weight:600; }
    .table-change { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-weight:600; font-size:.8rem; }
    .table-change.up { color:var(--green); background:rgba(34,197,94,.1); }
    .table-change.down { color:var(--red); background:rgba(239,68,68,.1); }
    .sparkline-canvas { width:80px; height:30px; display:block; }

    .wallet-section { max-width:1440px; margin:0 auto; display:grid; gap:24px; }
    .wallet-summary { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
    .wallet-stat { display:flex; flex-direction:column; gap:6px; }
    .wallet-stat-label { font-size:.75rem; color:var(--muted); text-transform:uppercase; }
    .wallet-stat-value { font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .wallet-actions { display:flex; gap:12px; flex-wrap:wrap; }
    .wallet-table { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; overflow-y:hidden; }
    .wallet-empty { padding:60px 20px; text-align:center; color:var(--muted); }

    .calendar-section { max-width:1440px; margin:0 auto; }
    .calendar-header { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
    .calendar-grid { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(18px,1fr)); gap:3px; }
    .calendar-cell { aspect-ratio:1; border-radius:3px; cursor:pointer; transition:transform .15s var(--ease); }
    .calendar-cell:hover { transform:scale(1.3); z-index:10; position:relative; }
    .calendar-cell.positive { background:var(--green); opacity:.3; }
    .calendar-cell.positive.strong { opacity:.6; }
    .calendar-cell.positive.stronger { opacity:1; }

const jalaliMonthKeyFormatter = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn",{year:"numeric",month:"numeric"});

  const locale = currentLang==="fa"?"fa-IR-u-ca-persian":"en-US-u-ca-persian-nu-latn";

function parseDate(d){return new Date(`${d}T12:00:00Z`);}
function toJalali(d){return jalaliFullFormatter.format(parseDate(d));}
function toJalaliShort(d){return jalaliShortFormatter.format(parseDate(d));}

  const p = jalaliMonthKeyFormatter.formatToParts(parseDate(d));
  const y = p.find(x=>x.type==="year")?.value||"0000";
  const m = p.find(x=>x.type==="month")?.value||"00";
  return `${y}-${m.padStart(2,"0")}`;
}

function extractMetaFromEntry(e){
  if(!e)return;
  const fin = Array.isArray(e.financial)?e.financial:(Array.isArray(e.data)?e.data:null);
  if(fin) fin.forEach(mergeFinMeta);
  if(e.pamp&&Array.isArray(e.pamp.items)) e.pamp.items.forEach(mergePampMeta);
}
async function loadAssetMetaFromAPI(){
  try{
    const [fin,pamp] = await Promise.allSettled([
      fetch("https://api.dastyar.io/express/financial-item").then(r=>r.json()),
      fetch("https://amirmasoud.netlify.app/api/v1/pamp").then(r=>r.json())

    if(fin.status==="fulfilled"&&Array.isArray(fin.value)) fin.value.forEach(mergeFinMeta);
    if(pamp.status==="fulfilled"&&pamp.value&&Array.isArray(pamp.value.items)) pamp.value.items.forEach(mergePampMeta);
  }catch{}
  if(currentEntries.length) renderDashboard();
}

// Price alerts (in-app only)
function checkPriceAlerts(){
  if(!priceAlerts.length||!currentEntries.length)return;
  const latest=currentEntries[currentEntries.length-1];
  const triggered=[];
  priceAlerts.forEach(al=>{
    const asset=ASSETS.find(a=>a.id===al.assetId); if(!asset)return;
    let price=null;
    if(Array.isArray(latest.financial)){const it=latest.financial.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
    if(price==null&&Array.isArray(latest.data)){const it=latest.data.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
    if(price==null)return;
    const hit=(al.cond==="gt"&&price>=al.price)||(al.cond==="lt"&&price<=al.price);
    if(hit&&!al.triggered){al.triggered=true;al.lastPrice=price;triggered.push({al,asset,price});}
  });
  if(triggered.length){
    storageSet("priceAlerts",JSON.stringify(priceAlerts));
    triggered.forEach(({al,asset,price})=>{
      toast(t("alertTriggered"),`${assetLabel(asset)}: ${fmt(price)}`,"warning");
      const card=grid.querySelector(`[data-asset-id="${asset.id}"]`);
      if(card){card.classList.add("alert-hit");setTimeout(()=>card.classList.remove("alert-hit"),6000);}
    });
  }
}

async function loadDetailData(){
  const asset=ASSETS.find(a=>a.id===detailAssetId); if(!asset)return;
  const days=detailRange===0?allDates.length:detailRange;
  const dates=allDates.slice(0,Math.min(days,allDates.length));
  const allData=await Promise.all(dates.map(d=>fetchDay(d)));
  const labels=[],values=[];
  for(let i=dates.length-1;i>=0;i--){
    const day=allData[i];
    if(Array.isArray(day)&&day.length>0){
      labels.push(toJalaliShort(dates[i]));
      const last=day[day.length-1];
      let price=null;
      if(Array.isArray(last.financial)){const it=last.financial.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
      if(price==null&&Array.isArray(last.data)){const it=last.data.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
      values.push(price);
    }
  }
  if(detailChart){detailChart.destroy();detailChart=null;}
  const colors=getChartColors();
  detailChart=new Chart(document.getElementById("detailChart").getContext("2d"),{
    type:"line",
    data:{labels,datasets:[{label:asset.label,data:values,borderColor:asset.color,backgroundColor:hexA(asset.color,.18),borderWidth:2.5,fill:true,tension:.35,spanGaps:true,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:asset.color}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},
      plugins:{legend:{display:false},tooltip:{backgroundColor:colors.tooltipBg,titleColor:colors.tooltipText,bodyColor:colors.tooltipText,borderColor:colors.tooltipBorder,borderWidth:1,padding:12,callbacks:{title:items=>items.length?items[0].label:"",label:ctx=>ctx.parsed.y==null?"—":fmt(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:colors.text,maxTicksLimit:10},grid:{color:colors.grid}},y:{ticks:{color:colors.text,callback:v=>Number(v).toLocaleString(numLocale())},grid:{color:colors.grid}}}}
  });
  const clean=values.filter(v=>v!=null);
  const min=Math.min(...clean),max=Math.max(...clean),first=clean[0],last=clean[clean.length-1];
  const chg=first?((last-first)/first)*100:0;
  const avg=clean.reduce((a,b)=>a+b,0)/clean.length;
  document.getElementById("detailStats").innerHTML=`
    <div class="detail-stat"><div class="detail-stat-label">${t("low")}</div><div class="detail-stat-value">${fmt(min)}</div></div>
    <div class="detail-stat"><div class="detail-stat-label">${t("high")}</div><div class="detail-stat-value">${fmt(max)}</div></div>
    <div class="detail-stat"><div class="detail-stat-label">${t("change")}</div><div class="detail-stat-value ${chg>=0?"up":"down"}">${chg>=0?"+":""}${chg.toFixed(2)}%</div></div>
    <div class="detail-stat"><div class="detail-stat-label">Avg</div><div class="detail-stat-value">${fmt(avg)}</div></div>
    <div class="detail-stat"><div class="detail-stat-label">${t("days")}</div><div class="detail-stat-value">${clean.length}</div></div>`;
}

async function loadCompareData(){
  const key=compareKey();
  let series, labels;
  if(compareCache.has(key)){ ({series,labels}=compareCache.get(key)); }
  else {
    const days=30; const dates=allDates.slice(0,Math.min(days,allDates.length));
    const allData=await Promise.all(dates.map(d=>fetchDay(d)));
    labels=[]; for(let i=dates.length-1;i>=0;i--) labels.push(toJalaliShort(dates[i]));
    series={};
    compareAssets.forEach(id=>{
      const asset=ASSETS.find(a=>a.id===id); const vals=[];
      for(let i=dates.length-1;i>=0;i--){
        const day=allData[i];
        if(Array.isArray(day)&&day.length>0){
          const last=day[day.length-1]; let price=null;
          if(Array.isArray(last.financial)){const it=last.financial.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
          if(price==null&&Array.isArray(last.data)){const it=last.data.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
          vals.push(price);
        } else vals.push(null);
      }
      series[id]=vals;
    });
    compareCache.set(key,{series,labels});
  }

  const colors=getChartColors();
  const datasets=compareAssets.map(id=>{
    const a=ASSETS.find(x=>x.id===id); const vals=series[id];
    const base=vals.find(v=>v!=null)||1;
    return {label:assetLabel(a),data:vals.map(v=>v!=null?(v/base)*100:null),borderColor:a.color,backgroundColor:"transparent",borderWidth:2.5,fill:false,tension:.35,spanGaps:true,pointRadius:0,pointHoverRadius:4};
  });
  const ex=Chart.getChart("compareChart"); if(ex)ex.destroy();
  document.getElementById("compareChart").style.display="";
  new Chart(document.getElementById("compareChart").getContext("2d"),{
    type:"line",data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},
      plugins:{legend:{position:"top",labels:{color:colors.text,usePointStyle:true}},tooltip:{backgroundColor:colors.tooltipBg,titleColor:colors.tooltipText,bodyColor:colors.tooltipText,borderColor:colors.tooltipBorder,borderWidth:1,callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}`}}},
      scales:{x:{ticks:{color:colors.text,maxTicksLimit:10},grid:{color:colors.grid}},y:{ticks:{color:colors.text,callback:v=>v.toFixed(0)},grid:{color:colors.grid}}}}
  });

  // Best performer
  const perf=compareAssets.map(id=>{
    const vals=series[id].filter(v=>v!=null);
    const base=vals[0]||1, last=vals[vals.length-1]||base;
    return {id, pct:((last-base)/base)*100};
  }).sort((a,b)=>b.pct-a.pct);
  document.getElementById("compareBest").innerHTML =
    `<span style="font-size:.8rem;color:var(--muted);align-self:center">${t("bestPerformer")}:</span>` +
    perf.map((p,i)=>{const a=ASSETS.find(x=>x.id===p.id);return `<span class="trend-chip ${p.pct>=0?"up":"down"}">${i+1}. ${assetLabel(a)} ${p.pct>=0?"+":""}${p.pct.toFixed(2)}%</span>`;}).join("");

  renderCorrelation(series);
}
function renderCorrelation(series){
  const ids=Object.keys(series);
  if(ids.length<2){document.getElementById("correlationTable").innerHTML="";return;}
  let html=`<table class="correlation-table"><thead><tr><th></th>${ids.map(id=>`<th>${assetLabel(ASSETS.find(a=>a.id===id))}</th>`).join("")}</tr></thead><tbody>`;
  ids.forEach(a=>{
    html+=`<tr><th>${assetLabel(ASSETS.find(x=>x.id===a))}</th>`;
    ids.forEach(b=>{const c=pearson(series[a],series[b]);const col=c>0.5?"var(--green)":c<-0.5?"var(--red)":"var(--muted)";html+=`<td style="color:${col}">${c.toFixed(2)}</td>`;});
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById("correlationTable").innerHTML=html;
}
function pearson(x,y){
  const n=Math.min(x.length,y.length); if(n<5)return 0;
  let sx=0,sy=0,sxy=0,sx2=0,sy2=0,c=0;
  for(let i=0;i<n;i++){if(x[i]!=null&&y[i]!=null){sx+=x[i];sy+=y[i];sxy+=x[i]*y[i];sx2+=x[i]**2;sy2+=y[i]**2;c++;}}
  if(c<3)return 0;
  const num=c*sxy-sx*sy;
  const den=Math.sqrt((c*sx2-sx**2)*(c*sy2-sy**2));
  return den===0?0:num/den;
}

  if(currentMode!==URL_DEFAULTS.mode)p.set("mode",currentMode);

function hexA(hex,a){

}

function getChartColors(){
  const style=document.documentElement.getAttribute("data-style");
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  const flatFont="'Inter','Vazirmatn',sans-serif";

function calculateWalletValue(){

async function loadCalendarData(){

  const datesToLoad=allDates.slice(0,Math.min(365,allDates.length));
  const batchSize=20,dayChanges=[];
  for(let i=0;i<datesToLoad.length;i+=batchSize){
    const batch=datesToLoad.slice(i,i+batchSize);
    const res=await Promise.all(batch.map(async date=>{
      const json=await fetchDay(date);

      const vals=getAssetValues(asset,json);const clean=vals.filter(v=>v!=null&&v>0);
      const first=clean[0]??null,last=clean.length?clean[clean.length-1]:null;
      let change=0;if(first&&last&&first>0)change=((last-first)/first)*100;
      return{date,change,open:first,close:last};

function drawSparkline(canvas,values,color){
  const ctx=canvas.getContext("2d");
  canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx.scale(2,2);
  const clean=values.filter(v=>v!=null&&v>0);if(clean.length<2)return;
  const min=Math.min(...clean),max=Math.max(...clean),range=max-min||1;
  const w=canvas.offsetWidth,h=canvas.offsetHeight,step=w/(clean.length-1);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  clean.forEach((v,i)=>{const x=i*step,y=h-((v-min)/range)*(h-4)-2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
}

async function fetchDay(date){
  const latest=allDates[0];const cache=date!==latest;
  if(cache&&dataCache.has(date))return dataCache.get(date);
  const res=await fetch(`data/${date}.json`);
  const json=res.ok?await res.json():null;
  if(cache&&json)dataCache.set(date,json);
  return json;
}
function computeDisplayIndices(len,max){
  max=Math.max(2,max);
  if(!len){displayIndices=[];displayLabels=[];return;}
  if(len<=max)displayIndices=Array.from({length:len},(_,i)=>i);
  else displayIndices=Array.from({length:max},(_,i)=>Math.round(i*(len-1)/(max-1)));
  displayLabels=displayIndices.map(i=>currentLabels[i]);
}
function getAssetValues(asset,entries){
  return entries.map(entry=>{
    if(!entry)return null;let price=null;
    if(Array.isArray(entry.data)){const it=entry.data.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
    if(price==null&&Array.isArray(entry.financial)){const it=entry.financial.find(i=>String(i.key)===String(asset.key));if(it)price=Number(it.price);}
    if(price==null&&entry.pamp&&Array.isArray(entry.pamp.items)){const it=entry.pamp.items.find(i=>Number(i.weightGram)===Number(asset.key));if(it)price=Number(it.price);}
    return Number.isFinite(price)&&price>0?price:null;
  });
}
function calculateStats(values){
  const clean=values.filter(v=>v!=null&&v>0);if(!clean.length)return null;
  const open=clean[0],close=clean[clean.length-1];
  const prev=clean.length>1?clean[clean.length-2]:open;
  const low=Math.min(...clean),high=Math.max(...clean);
  const change=prev>0?((close-prev)/prev)*100:0;
  return{open,prev,close,low,high,change};
}

function updateAssetStats(assetId,values){
  const stats=calculateStats(values);assetStats[assetId]=stats;
  const priceEl=document.getElementById(`price-${assetId}`);
  const changeEl=document.getElementById(`change-${assetId}`);
  const nowEl=document.getElementById(`now-${assetId}`);
  const lowEl=document.getElementById(`low-${assetId}`);
  const highEl=document.getElementById(`high-${assetId}`);
  const fillEl=document.getElementById(`range-fill-${assetId}`);
  const dotEl=document.getElementById(`range-dot-${assetId}`);
  const trendEl=document.getElementById(`trend-${assetId}`);
  if(!priceEl)return;
  if(!stats){priceEl.textContent="—";changeEl.textContent="—";changeEl.className="price-change";nowEl.textContent="—";lowEl.textContent="—";highEl.textContent="—";fillEl.style.width="0%";dotEl.style.left="0%";if(trendEl)trendEl.innerHTML="";return;}
  priceEl.textContent=fmt(stats.close);nowEl.textContent=fmt(stats.close);lowEl.textContent=fmt(stats.low);highEl.textContent=fmt(stats.high);
  changeEl.textContent=`${stats.change>=0?"▲":"▼"} ${Math.abs(stats.change).toFixed(2)}%`;
  changeEl.className=`price-change ${stats.change>=0?"up":"down"}`;
  const pos=stats.high>stats.low?((stats.close-stats.low)/(stats.high-stats.low))*100:0;
  fillEl.style.width=pos+"%";dotEl.style.left=pos+"%";
  const tr=calcTrend(values);
  if(trendEl){const c=tr.dir==="up"?"up":tr.dir==="down"?"down":"";trendEl.innerHTML=`<span class="trend-chip ${c}"><span class="trend-arrow">${tr.arrow}</span>${tr.label}</span>`;}
}
function calcTrend(v){const c=v.filter(x=>x!=null);if(c.length<10)return{arrow:"→",label:t("trendFlat"),dir:"flat"};const rec=c.slice(-10).reduce((a,b)=>a+b,0)/10;const old=c.slice(0,10).reduce((a,b)=>a+b,0)/Math.min(10,c.slice(0,10).length);const pct=old?((rec-old)/old)*100:0;if(pct>1.5)return{arrow:"↗",label:t("trendUp"),dir:"up"};if(pct<-1.5)return{arrow:"↘",label:t("trendDown"),dir:"down"};return{arrow:"→",label:t("trendFlat"),dir:"flat"};}

  });
  feather.replace();
  grid.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openDetailModal(b.dataset.detail);}));
}
function renderHeatmap(){
  grid.style.display="none";tableContainer.style.display="none";compareSection.style.display="none";
  walletSection.style.display="none";calendarSection.style.display="none";affordSection.style.display="none";
  heatmapGrid.style.display="";heatmapGrid.innerHTML="";
  const visible=getVisibleAssets();
  if(!visible.length){heatmapGrid.innerHTML=`<div class="empty-state">${t("noAssets")}</div>`;return;}
  visible.forEach(asset=>{
    const stats=calculateStats(getAssetValues(asset,currentEntries));
    const label=assetLabel(asset);
    const tile=document.createElement("div");
    let cls="heatmap-tile neutral",chCls="",chTxt="—";
    if(stats){if(stats.change>0){cls="heatmap-tile positive";chCls="heatmap-change up";chTxt=`▲ ${stats.change.toFixed(2)}%`;}else if(stats.change<0){cls="heatmap-tile negative";chCls="heatmap-change down";chTxt=`▼ ${Math.abs(stats.change).toFixed(2)}%`;}}
    tile.className=cls;
    tile.innerHTML=`<div class="heatmap-label">${iconHtml(asset)}<span class="hl-text" title="${label}">${label}</span></div><div><div class="heatmap-price">${stats?fmt(stats.close):"—"}</div><div class="${chCls}">${chTxt}</div></div>`;
    heatmapGrid.appendChild(tile);
  });
}
function renderTable(){
  grid.style.display="none";heatmapGrid.style.display="none";compareSection.style.display="none";
  walletSection.style.display="none";calendarSection.style.display="none";affordSection.style.display="none";
  tableContainer.style.display="";tableBody.innerHTML="";
  const visible=getVisibleAssets();
  if(!visible.length){tableBody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:40px">${t("noAssets")}</td></tr>`;return;}
  visible.forEach(asset=>{
    const full=getAssetValues(asset,currentEntries);
    const stats=calculateStats(full);
    const label=assetLabel(asset);
    const tr=document.createElement("tr");tr.style.cursor="pointer";
    tr.addEventListener("click",()=>openDetailModal(asset.id));
    let ch="—";
    if(stats){const cls=stats.change>=0?"up":"down";const arrow=stats.change>=0?"▲":"▼";ch=`<span class="table-change ${cls}">${arrow} ${Math.abs(stats.change).toFixed(2)}%</span>`;}
    const sparkId=`spark-${asset.id}`;
    tr.innerHTML=`<td><div class="table-asset">${iconHtml(asset)}<span class="table-asset-name">${label}</span></div></td><td><canvas id="${sparkId}" class="sparkline-canvas"></canvas></td><td>${stats?fmt(stats.close):"—"}</td><td>${stats?fmt(stats.low):"—"}</td><td>${stats?fmt(stats.high):"—"}</td><td>${ch}</td>`;
    tableBody.appendChild(tr);
    requestAnimationFrame(()=>{const c=document.getElementById(sparkId);if(c)drawSparkline(c,full.slice(-50),asset.color);});
  });
}
function renderDashboard(){
  assetStats={};calTooltip.classList.remove("show");
  colsToggle.style.display=currentMode==="charts"?"":"none";
  if(currentMode==="charts")renderCharts();
  else if(currentMode==="heatmap")renderHeatmap();
  else if(currentMode==="table")renderTable();
  else if(currentMode==="compare")renderCompare();
  else if(currentMode==="wallet")renderWallet();
  else if(currentMode==="calendar")renderCalendar();
  else if(currentMode==="afford")renderAfford();
  animateIn(modeSections[currentMode]);
  updateURLState();
}

const commands=[
  {id:"daily",text:"Daily View",shortcut:"D",action:()=>setView("daily")},
  {id:"monthly",text:"Monthly View",shortcut:"M",action:()=>setView("monthly")},
  {id:"charts",text:"Charts Mode",shortcut:"1",action:()=>setMode("charts")},
  {id:"heatmap",text:"Heatmap Mode",shortcut:"2",action:()=>setMode("heatmap")},
  {id:"table",text:"Table Mode",shortcut:"3",action:()=>setMode("table")},
  {id:"compare",text:"Compare Mode",shortcut:"4",action:()=>setMode("compare")},
  {id:"wallet",text:"Wallet Mode",shortcut:"5",action:()=>setMode("wallet")},
  {id:"calendar",text:"Calendar Mode",shortcut:"6",action:()=>setMode("calendar")},
  {id:"afford",text:"Afford Mode",shortcut:"7",action:()=>setMode("afford")},
  {id:"alerts",text:"Open Price Alerts",shortcut:"A",action:()=>openAlertsModal()},
  {id:"shortcuts",text:"Keyboard Shortcuts",shortcut:"?",action:()=>openShortcutsModal()},
  {id:"theme",text:"Toggle Theme",shortcut:"T",action:()=>applyTheme(currentTheme==="dark"?"light":"dark")},
  {id:"lang",text:"Toggle Language",shortcut:"L",action:()=>applyLanguage(currentLang==="en"?"fa":"en")},
  {id:"style",text:"Cycle UI Style",shortcut:"S",action:()=>{const i=STYLES.indexOf(currentStyle);applyStyle(STYLES[(i+1)%STYLES.length]);}}
];
function setView(v){currentView=v;document.querySelector("#viewToggle .active")?.classList.remove("active");document.querySelector(`#viewToggle [data-view="${v}"]`)?.classList.add("active");renderDateMenu();if(v==="daily"&&allDates.length)loadData(allDates[0]);if(v==="monthly"&&allMonths.length)loadMonthlyData(allMonths[0].dates,allMonths[0].key);}
function setMode(m){currentMode=m;document.querySelector("#modeToggle .active")?.classList.remove("active");document.querySelector(`#modeToggle [data-mode="${m}"]`)?.classList.add("active");renderDashboard();}
function setCategory(c){activeCategory=c;document.querySelectorAll("#categoryTabs .tab").forEach(b=>b.classList.toggle("active",b.dataset.category===c));renderDashboard();}
let commandSelectedIndex=0,commandFiltered=commands;
function openCommandPalette(){commandPalette.classList.add("show");commandSearch.value="";commandSearch.focus();commandFiltered=commands;commandSelectedIndex=0;renderCommandList();}
function closeCommandPalette(){commandPalette.classList.remove("show");}
function renderCommandList(){
  commandList.innerHTML=commandFiltered.map((cmd,i)=>`<div class="command-item ${i===commandSelectedIndex?"selected":""}" data-index="${i}"><div class="command-item-text">${cmd.text}</div>${cmd.shortcut?`<div class="command-item-shortcut">${cmd.shortcut}</div>`:""}</div>`).join("");
  commandList.querySelectorAll(".command-item").forEach(el=>{el.onclick=()=>{commandFiltered[parseInt(el.dataset.index)].action();closeCommandPalette();};});
}
commandSearch.addEventListener("input",()=>{const q=commandSearch.value.toLowerCase();commandFiltered=commands.filter(c=>c.text.toLowerCase().includes(q));commandSelectedIndex=0;renderCommandList();});
commandSearch.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();commandSelectedIndex=Math.min(commandSelectedIndex+1,commandFiltered.length-1);renderCommandList();}
  else if(e.key==="ArrowUp"){e.preventDefault();commandSelectedIndex=Math.max(commandSelectedIndex-1,0);renderCommandList();}
  else if(e.key==="Enter"){e.preventDefault();if(commandFiltered[commandSelectedIndex]){commandFiltered[commandSelectedIndex].action();closeCommandPalette();}}
  else if(e.key==="Escape")closeCommandPalette();
});
commandPalette.addEventListener("click",e=>{if(e.target===commandPalette)closeCommandPalette();});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable)return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="k"){e.preventDefault();openCommandPalette();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return; // never hijack browser shortcuts
  if(k==="/"||k==="?"){e.preventDefault();k==="?"?openShortcutsModal():openCommandPalette();}
  else if(k==="escape"){closeCommandPalette();closeDrawer();dateMenu.classList.remove("show");document.querySelectorAll(".modal-overlay.show").forEach(m=>m.classList.remove("show"));}
  else if(k==="d")setView("daily");
  else if(k==="m")setView("monthly");
  else if(k==="1")setMode("charts");
  else if(k==="2")setMode("heatmap");
  else if(k==="3")setMode("table");
  else if(k==="4")setMode("compare");
  else if(k==="5")setMode("wallet");
  else if(k==="6")setMode("calendar");
  else if(k==="7")setMode("afford");
  else if(k==="t")applyTheme(currentTheme==="dark"?"light":"dark");
  else if(k==="l")applyLanguage(currentLang==="en"?"fa":"en");
  else if(k==="a")openAlertsModal();
  else if(k==="s"){const i=STYLES.indexOf(currentStyle);applyStyle(STYLES[(i+1)%STYLES.length]);}
});

function rebuildMonths(){
  const map={};
  allDates.forEach(d=>{const k=getJalaliMonthKey(d);if(!map[k])map[k]={key:k,label:getJalaliMonthLabel(d),dates:[]};map[k].dates.push(d);});
  allMonths=Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));
}
function renderDateMenu(){
  dateMenu.innerHTML="";
  const items=currentView==="daily"?allDates:allMonths;
  if(!items.length){const d=document.createElement("div");d.textContent="No dates found";dateMenu.appendChild(d);return;}
  items.forEach(item=>{
    const div=document.createElement("div");
    if(currentView==="daily"){div.textContent=toJalali(item);div.onclick=()=>{dateMenu.classList.remove("show");closeDrawerIfMobile();loadData(item);};}
    else{div.textContent=item.label;div.onclick=()=>{dateMenu.classList.remove("show");closeDrawerIfMobile();loadMonthlyData(item.dates,item.key);};}
    dateMenu.appendChild(div);
  });
}
async function loadAvailableDates(){
  const res=await fetch("data/dates.json",{cache:"no-store"});
  allDates=res.ok?await res.json():[];
  if(!Array.isArray(allDates))allDates=[];
  rebuildMonths();renderDateMenu();
  if(!allDates.length){dateBtnText.textContent="No dates";return;}
  if(currentView==="daily")loadData(allDates[0]);
  else loadMonthlyData(allMonths[0].dates,allMonths[0].key);
}

themeBtn.addEventListener("click",()=>applyTheme(currentTheme==="dark"?"light":"dark"));
styleBtn.addEventListener("click",()=>{const i=STYLES.indexOf(currentStyle);applyStyle(STYLES[(i+1)%STYLES.length]);});
langBtn.addEventListener("click",()=>applyLanguage(currentLang==="en"?"fa":"en"));
viewToggle.addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]");if(!b||b.classList.contains("active"))return;
  document.querySelector("#viewToggle .active")?.classList.remove("active");b.classList.add("active");
  currentView=b.dataset.view;renderDateMenu();closeDrawerIfMobile();
  if(currentView==="daily"&&allDates.length)loadData(allDates[0]);
  if(currentView==="monthly"&&allMonths.length)loadMonthlyData(allMonths[0].dates,allMonths[0].key);
});
modeToggle.addEventListener("click",e=>{
  const b=e.target.closest("button[data-mode]");if(!b||b.classList.contains("active"))return;
  document.querySelector("#modeToggle .active")?.classList.remove("active");b.classList.add("active");
  currentMode=b.dataset.mode;closeDrawerIfMobile();renderDashboard();
});
categoryTabs.addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  activeCategory=b.dataset.category;
  document.querySelectorAll("#categoryTabs .tab").forEach(x=>x.classList.toggle("active",x.dataset.category===activeCategory));
  closeDrawerIfMobile();renderDashboard();
});
assetSearch.addEventListener("input",debounce(()=>{searchQuery=assetSearch.value.trim().toLowerCase();renderDashboard();},200));
grid.addEventListener("click",e=>{
  const fb=e.target.closest(".fav-btn");
  if(fb){const id=fb.dataset.fav;toggleFavorite(id);const isFav=favorites.includes(id);if(activeCategory==="favorites"){renderDashboard();return;}fb.classList.toggle("active",isFav);}
});
dateBtn.onclick=()=>dateMenu.classList.toggle("show");
document.addEventListener("click",e=>{if(!e.target.closest(".date-dropdown"))dateMenu.classList.remove("show");});

parseURLState();
buildDateFormatters();
document.documentElement.setAttribute("data-style",currentStyle);
styleBtn.title="Style: "+(STYLE_NAMES[currentStyle]||currentStyle);
const savedAmount=(storageGet("affordAmount")||"1000000").replace(/\D/g,"");
affordAmountInput.dataset.raw=savedAmount;
affordAmountInput.value=savedAmount?Number(savedAmount).toLocaleString(numLocale()):"";
applyCols();applyTheme(currentTheme);applyLanguage(currentLang);
if(searchQuery)assetSearch.value=searchQuery;
document.querySelectorAll("#viewToggle button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentMode));
document.querySelectorAll("#categoryTabs .tab").forEach(b=>b.classList.toggle("active",b.dataset.category===activeCategory));
feather.replace();fillSEO();loadAssetMetaFromAPI();loadAvailableDates();
</script>
